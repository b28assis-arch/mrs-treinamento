<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRS - Dashboard de Segurança Operacional</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           SISTEMA DE IDENTIDADE VISUAL - FOCO EM OPERAÇÃO DE CAMPO
           ============================================================
        */
        :root {
            --mrs-blue: #0b3a6f; 
            --accent: #ffffff; 
            --selected: #3b82f6; 
            --danger: #ff2a2a; 
            --warning: #ffcc00; 
            --info: #00ffaa; 
            --neon-blue: #00d2ff;
            --glass-bg: rgba(10, 15, 30, 0.98); 
            --glass-border: rgba(0, 210, 255, 0.3);
        }
        
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: #020617; 
            color: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 15px; 
            box-sizing: border-box; 
            overflow-x: hidden;
        }

        /* --- CABEÇALHO --- */
        .banner-topo { 
            width: 100%; 
            max-width: 1200px; 
            margin-bottom: 25px; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .banner-topo img { width: 100%; display: block; }

        /* --- DASHBOARD LAYOUT --- */
        .dashboard-container { 
            display: grid; 
            grid-template-columns: 1fr 1.5fr 1fr; 
            gap: 20px; 
            width: 100%; 
            max-width: 1200px; 
            margin-bottom: 25px; 
        }

        .panel { 
            background: var(--glass-bg); 
            backdrop-filter: blur(25px); 
            border: 1px solid var(--glass-border); 
            border-radius: 15px; 
            padding: 25px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            display: flex; 
            flex-direction: column; 
        }

        /* --- PAINEL DE STATUS --- */
        .status-panel { text-align: center; justify-content: center; }
        .mrs-titulo { 
            margin: 0; 
            font-size: 1.7rem; 
            font-weight: 800; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            color: var(--accent);
        }
        .status-label { margin-top: 15px; font-weight: 700; color: #94a3b8; font-size: 0.95rem; text-transform: uppercase; }
        .contador-num { 
            margin: 10px 0;
            display: inline-block;
            background: #000; 
            padding: 6px 20px; 
            border-radius: 8px; 
            color: var(--neon-blue); 
            border: 1px solid var(--neon-blue); 
            font-family: monospace;
            font-size: 1.4rem;
            text-shadow: 0 0 12px var(--neon-blue);
        }

        /* --- GRID DE BUSCA (REGRAS DE NITIDEZ) --- */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 6px; 
            width: 100%; 
            max-width: 340px; 
            margin: 0 auto; 
            padding: 12px; 
            background: rgba(0,0,0,0.4); 
            border-radius: 12px; 
        }
        .cell { 
            aspect-ratio: 1; 
            background: #ffffff; 
            color: #0b1120; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 4px; 
            font-weight: 600; /* Peso 600 evita borrão em telas mobile */
            font-size: 1.4rem; 
            cursor: pointer; 
            transition: 0.2s; 
            user-select: none;
        }
        .selected { background: var(--selected) !important; color: #fff !important; }
        .found-word { 
            background: var(--danger) !important; 
            color: #fff !important; 
            box-shadow: 0 0 15px var(--danger); 
            font-weight: 800;
        }

        /* --- TERMINAL DE INTELIGÊNCIA OPERACIONAL (DADOS COMPLETOS) --- */
        .intel-panel { 
            border-left: 6px solid var(--neon-blue); 
            min-height: 520px; 
        }
        .intel-title { 
            font-size: 1.1rem; 
            font-weight: 800; 
            margin-bottom: 20px; 
            color: var(--neon-blue); 
            text-transform: uppercase;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        .intel-output { font-size: 1.05rem; line-height: 1.6; color: #f1f5f9; }
        
        .intel-entry { 
            margin-bottom: 20px; 
            padding: 15px; 
            border-radius: 10px; 
            animation: fadeIn 0.4s ease-out forwards;
        }
        .entry-context { background: rgba(255,255,255,0.05); border-left: 4px solid var(--info); }
        .entry-fatal { background: rgba(255,42,42,0.12); border-left: 4px solid var(--danger); color: #ffa0a0; }
        .entry-daily { background: rgba(0,210,255,0.12); border-left: 4px solid var(--neon-blue); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- RODAPÉ: RÁDIO TRECHO (FORMS GIGANTE) --- */
        .footer-panel { 
            width: 100%; 
            max-width: 1200px; 
            border-bottom: 6px solid var(--selected); 
            margin-top: 15px; 
        }
        .radio-title {
            text-align: center;
            margin-bottom: 15px;
        }
        .radio-title h3 { margin: 0; font-size: 1.4rem; text-transform: uppercase; color: var(--accent); letter-spacing: 1px; }
        
        .input-mrs { 
            background: rgba(0,0,0,0.7); 
            border: 2px solid var(--glass-border); 
            padding: 30px; 
            border-radius: 12px; 
            color: #fff; 
            width: 100%; 
            box-sizing: border-box; 
            font-family: inherit; 
            font-size: 1.3rem; 
            min-height: 280px; /* Tamanho Gigante Conforme Solicitado */
            resize: none;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .input-mrs:focus { border-color: var(--neon-blue); outline: none; background: rgba(0,0,0,0.9); }

        .btn-main { 
            background: linear-gradient(90deg, #1e40af, #3b82f6); 
            color: #fff; 
            border: none; 
            padding: 25px; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 1.5rem; 
            cursor: pointer; 
            text-transform: uppercase; 
            width: 100%; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .btn-main:active { transform: scale(0.98); }

        /* --- MOBILE ADAPTATION --- */
        @media (max-width: 1024px) {
            .dashboard-container { grid-template-columns: 1fr; gap: 15px; }
            .grid { max-width: 320px; }
            .intel-panel { min-height: auto; }
            .panel { padding: 20px; }
            .input-mrs { font-size: 1.1rem; min-height: 200px; }
        }
    </style>
</head>
<body>

    <div class="banner-topo">
        <img src="1000121485.png" alt="MRS LOGÍSTICA">
    </div>

    <div class="dashboard-container">
        <div class="panel status-panel">
            <h1 class="mrs-titulo">MRS LOGÍSTICA</h1>
            <div class="status-label">Protocolos de Segurança</div>
            <div><span class="contador-num" id="contador-txt">0/5</span></div>
            <button class="btn-main" style="padding:12px; font-size:0.8rem; background:#1e293b; margin-top:15px;" onclick="location.reload()">REINICIAR TRILHA</button>
        </div>

        <div class="panel">
            <div class="grid" id="grid-box"></div>
        </div>

        <div class="panel intel-panel">
            <div class="intel-title">Relatório de Inteligência Operacional</div>
            <div id="intel-content" class="intel-output">
                "Aguardando varredura. Localize as 5 palavras-chave críticas (SONO, CELULAR, ATENÇÃO, SINAL, PRESSA) para carregar os protocolos de impacto."
            </div>
        </div>
    </div>

    <div class="panel footer-panel">
        <div class="radio-title">
            <h3>📡 Rádio Trecho: Registro de Compromisso DDS</h3>
        </div>
        <textarea class="input-mrs" id="feedback-caixa" placeholder="Relate aqui as percepções da equipe, situações reais vivenciadas no trecho e os compromissos de segurança firmados hoje..."></textarea>
        <button class="btn-main" onclick="transmitir()">TRANSMITIR RELATÓRIO AO FORMS</button>
    </div>

    <script>
        /* ============================================================
           MOTOR LÓGICO DO DASHBOARD - MRS LOGÍSTICA
           ============================================================
        */
        const SIZE = 10;
        let selecionadas = [], encontradas = [], gridData = [];
        
        // BANCO DE DADOS TÉCNICO E HISTÓRICO
        const bancoDados = [
            {
                txt: "SONO", display: "ALERTA: SONO / FADIGA",
                expl: "A exaustão física é um colapso fisiológico que ignora o regulamento. Maquinistas sob fadiga severa apresentam tempos de reação comparáveis a um estado de embriaguez profunda.",
                fato: "TRAGÉDIA REAL: Desastre de Hinton (Canadá, 1986). A tripulação dormiu por exaustão extrema, o trem cruzou um sinal e colidiu frontalmente com um trem de passageiros. 23 mortos em segundos.",
                simu: "DIA A DIA: Você sente o 'pescoço caído' ou visão turva faltando 1 hora para o fim do turno. AÇÃO: Pare o trem em local seguro imediatamente e reporte. O sono não se vence com café ou força de vontade."
            },
            {
                txt: "CELULAR", display: "ALERTA: DISPOSITIVOS ELETRÔNICOS",
                expl: "Uma única mensagem remove o foco da via por tempo suficiente para percorrer centenas de metros sem supervisão. O cérebro 'vê', mas não processa o perigo durante a distração.",
                fato: "TRAGÉDIA REAL: Chatsworth (EUA, 2008). 25 mortos e 135 feridos. O maquinista enviou um SMS, ignorou o sinal vermelho e colidiu frontalmente com um trem de carga. O SMS foi sua última ação de vida.",
                simu: "DIA A DIA: O celular vibra no bolso com uma notificação durante a manobra no pátio. AÇÃO: Mantenha o foco na via. O aparelho deve estar desligado e inacessível na bolsa durante a condução."
            },
            {
                txt: "ATENCAO", display: "ALERTA: ATENÇÃO OPERACIONAL",
                expl: "O excesso de confiança no trecho rotineiro é o maior assassino silencioso. O cérebro entra em 'modo automático' e para de processar os riscos reais em locais familiares.",
                fato: "TRAGÉDIA REAL: Santiago de Compostela (Espanha, 2013). 79 mortos. O maquinista conhecia o trecho tão bem que relaxou, perdeu a noção de localização e entrou na curva a 179km/h.",
                simu: "DIA A DIA: Cruzar aquela PN (Passagem de Nível) que raramente tem tráfego. AÇÃO: Trate cada metro como território desconhecido. Use o 'Anotar e Cantar' para cada sinal e marco quilométrico."
            },
            {
                txt: "SINAL", display: "ALERTA: SINALIZAÇÃO E MODO DEGRADADO",
                expl: "Sinalização ferroviária é lei física. Dúvida no sinal é ordem de parada. Ignorar a hierarquia dos sinais ou forçar comandos é convidar a colisão para dentro da cabine.",
                fato: "TRAGÉDIA REAL: Bad Aibling (Alemanha, 2016). 12 mortos. Uma série de interpretações erradas de sinais e comandos manuais forçados resultou em colisão violenta em via singela.",
                simu: "DIA A DIA: Sinal com aspecto duvidoso, apagado ou 'luz fantasma'. AÇÃO: Considere o aspecto mais restritivo: PARADA. Pare e peça instruções. Antes um atraso do que uma fatalidade."
            },
            {
                txt: "PRESSA", display: "ALERTA: PRESSA E CUMPRIMENTO DE HORÁRIO",
                expl: "A pressa gera 'visão de túnel'. O condutor foca tanto no objetivo de compensar um atraso que seu cérebro ignora leis físicas básicas de frenagem e protocolos laterais de segurança.",
                fato: "TRAGÉDIA REAL: Amagasaki (Japão, 2005). 107 mortos. O condutor acelerou em uma curva perigosa para tentar recuperar um atraso de apenas 90 segundos. A pressa matou centenas por causa de 1,5 minuto.",
                simu: "DIA A DIA: Pressão para liberar trecho para trem prioritário. AÇÃO: A segurança precede o relógio. Respeite rigorosamente a velocidade regulamentada, independentemente do tempo de atraso."
            }
        ];

        // INICIALIZAÇÃO DO GRID
        function init() {
            let pronto = false;
            while (!pronto) { 
                gridData = Array(SIZE).fill(null).map(() => Array(SIZE).fill('')); 
                pronto = distribuirPalavras(); 
            }
            preencherLixo(); 
            renderizarGrid();
        }

        function distribuirPalavras() {
            const lista = [...bancoDados].sort((a,b) => b.txt.length - a.txt.length);
            for (let p of lista) {
                let colocada = false, tentativas = 0;
                while (!colocada && tentativas < 4000) {
                    let h = Math.random() > 0.5, r = Math.floor(Math.random() * (h ? SIZE : SIZE - p.txt.length)), c = Math.floor(Math.random() * (h ? SIZE - p.txt.length : SIZE));
                    let ok = true;
                    for (let i = 0; i < p.txt.length; i++) if (gridData[h?r:r+i][h?c+i:c] !== '') ok = false;
                    if (ok) { for (let i = 0; i < p.txt.length; i++) gridData[h?r:r+i][h?c+i:c] = p.txt[i]; colocada = true; }
                    tentativas++;
                }
                if (!colocada) return false;
            } return true;
        }

        function preencherLixo() {
            const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) 
                if (gridData[r][c] === '') gridData[r][c] = abc[Math.floor(Math.random() * abc.length)];
        }

        function renderizarGrid() {
            const container = document.getElementById("grid-box"); 
            container.innerHTML = '';
            gridData.forEach((row, r) => row.forEach((letra, c) => {
                const div = document.createElement("div"); 
                div.className = "cell"; 
                div.innerText = letra;
                div.onclick = () => gerenciarClique(div, letra, r, c); 
                container.appendChild(div);
            }));
        }

        // LÓGICA DE INTERAÇÃO (SUPORTE A LINHA RETA E REBOBINAR)
        function gerenciarClique(el, letra, r, c) {
            if (el.classList.contains('found-word')) return;
            
            // Rebobinar: Desmarca se clicar na última letra
            if (el.classList.contains('selected')) {
                const index = selecionadas.findIndex(s => s.el === el);
                if (index === selecionadas.length - 1) { 
                    el.classList.remove('selected'); 
                    selecionadas.pop(); 
                }
                return;
            }

            // Trava de direção para evitar seleção torta
            if (selecionadas.length > 0) {
                const last = selecionadas[selecionadas.length - 1];
                const dr = Math.abs(r - last.r), dc = Math.abs(c - last.c);
                if ((dr > 1 || dc > 1) || (dr === 1 && dc === 1)) return;
                if (selecionadas.length >= 2) {
                    const first = selecionadas[0], second = selecionadas[1];
                    if (first.r === second.r && r !== last.r) return;
                    if (first.c === second.c && c !== last.c) return;
                }
            }

            el.classList.add('selected'); 
            selecionadas.push({el, letra, r, c}); 
            verificarMatch();
        }

        // VERIFICAÇÃO DE PALAVRA (SUPORTE A MARCAÇÃO INVERTIDA)
        function verificarMatch() {
            const formada = selecionadas.map(s => s.letra).join('');
            const invertida = [...formada].reverse().join('');
            
            const alvo = bancoDados.find(p => (p.txt === formada || p.txt === invertida) && !encontradas.includes(p.txt));
            
            if (alvo) {
                selecionadas.forEach(s => { 
                    s.el.classList.remove('selected'); 
                    s.el.classList.add('found-word'); 
                });
                encontradas.push(alvo.txt); 
                selecionadas = [];
                document.getElementById("contador-txt").innerText = `${encontradas.length}/5`;
                carregarImpacto(alvo);
            }
        }

        // APRESENTAÇÃO DOS DADOS NO TERMINAL
        function carregarImpacto(alvo) {
            const painel = document.getElementById("intel-content");
            painel.innerHTML = `
                <div style="color:var(--danger); font-weight:800; margin-bottom:18px; font-size:1.15rem; border-bottom: 2px solid var(--danger); padding-bottom:8px;">
                   [ ! ] DETECTADO: ${alvo.display}
                </div>
                <div class="intel-box entry-context">${alvo.expl}</div>
                <div class="intel-box entry-fatal"><b>OCORRÊNCIA NO MUNDO:</b><br>${alvo.fato}</div>
                <div class="intel-box entry-daily"><b>BOA PRÁTICA NO DIA A DIA:</b><br>${alvo.simu}</div>
            `;
        }

        function transmitir() {
            if(!document.getElementById("feedback-caixa").value) { 
                alert("Atenção: É obrigatório registrar o compromisso do DDS no Rádio Trecho antes da transmissão."); 
                return; 
            }
            window.open('https://forms.gle/ut3jDiKRPWSGVXw37');
        }

        init();
    </script>
</body>
</html>
