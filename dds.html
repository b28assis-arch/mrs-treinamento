<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRS - Dashboard Trem Bão</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           CONFIGURAÇÕES DE CORES E VARIÁVEIS (SISTEMA NEON)
           ============================================================ */
        :root {
            --mrs-blue: #0b3a6f; 
            --accent: #ffffff;
            --selected: #3b82f6; 
            --danger: #ff2a2a;   
            --warning: #ffcc00;  
            --info: #00ffaa;     
            --neon-blue: #00d2ff;
            --glass-bg: rgba(10, 15, 30, 0.95); 
            --glass-border: rgba(0, 210, 255, 0.3);
        }
        
        /* --- RESET E FUNDO --- */
        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background: #020617 url('fundo-mrs.png') no-repeat center center fixed; 
            background-size: cover; color: #f8fafc; min-height: 100vh; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 15px; box-sizing: border-box; overflow-x: hidden;
        }

        /* --- BANNER PRINCIPAL --- */
        .banner-topo { 
            width: 100%; max-width: 1200px; margin-bottom: 15px; 
            border-radius: 12px; overflow: hidden; border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .banner-topo img { width: 100%; display: block; }

        /* --- GRID E PAINÉIS --- */
        .dashboard-container { 
            display: grid; grid-template-columns: 1fr 1.5fr 1fr; 
            gap: 15px; width: 100%; max-width: 1200px; margin-bottom: 15px; 
        }

        .panel { 
            background: var(--glass-bg); backdrop-filter: blur(25px); 
            border: 1px solid var(--glass-border); border-radius: 20px; 
            padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); 
            display: flex; flex-direction: column; position: relative;
        }

        /* --- STATUS E CONTADORES --- */
        .status-panel { text-align: center; justify-content: center; }
        .mrs-titulo { margin: 0; font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .contador-container { margin: 15px 0; font-size: 0.9rem; font-weight: 800; }
        .contador { 
            background: #000; padding: 4px 12px; border-radius: 6px; 
            color: var(--neon-blue); border: 1px solid var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue); font-family: monospace;
        }

        /* --- DESIGN DAS CÉLULAS DO CAÇA-PALAVRAS --- */
        .grid { 
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; 
            width: 100%; max-width: 320px; margin: 0 auto; padding: 10px; 
            background: rgba(0,0,0,0.5); border-radius: 12px;
        }
        .cell { 
            aspect-ratio: 1; background: #ffffff; color: #0b1120; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 4px; font-weight: 900; font-size: 1.3rem; 
            cursor: pointer; transition: 0.2s; user-select: none;
        }
        .selected { background: var(--selected) !important; color: #fff !important; box-shadow: 0 0 15px var(--selected); }
        .found-grave { background: var(--danger) !important; color: #fff !important; box-shadow: 0 0 10px var(--danger); }
        .found-medio { background: var(--warning) !important; color: #000 !important; box-shadow: 0 0 10px var(--warning); }
        .found-leve { background: var(--info) !important; color: #000 !important; box-shadow: 0 0 10px var(--info); }

        /* --- MASCOTE TREM BÃO (HOLOGRAMA) --- */
        .mascote-wrapper { 
            position: relative; width: 140px; height: 140px; margin: 0 auto 15px; 
            display: flex; align-items: center; justify-content: center;
        }
        .trem-bao { 
            width: 130px; height: 130px; object-fit: cover; border-radius: 50%;
            border: 3px solid var(--neon-blue); animation: flutuar 3s ease-in-out infinite; 
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.6); z-index: 2;
        }
        .hologram-base { 
            position: absolute; bottom: -5px; width: 80px; height: 12px; 
            background: rgba(0, 210, 255, 0.3); border-radius: 50%; 
            filter: blur(5px); animation: pulsarBase 3s ease-in-out infinite; 
        }

        @keyframes flutuar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes pulsarBase { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.3); opacity: 0.6; } }

        /* --- TERMINAL DE INTELIGÊNCIA --- */
        .intel-panel { border-left: 4px solid var(--neon-blue); min-height: 320px; }
        .intel-title { font-size: 1.1rem; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; }
        .intel-text { font-size: 1rem; line-height: 1.5; color: #e2e8f0; }
        .fato-box { 
            margin-top: 15px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.1);
            font-style: italic; color: #94a3b8; font-size: 0.9rem;
        }

        /* --- RODAPÉ E FEEDBACK --- */
        .footer-panel { width: 100%; max-width: 1200px; border-bottom: 4px solid var(--selected); gap: 10px; }
        .input-mrs { 
            background: rgba(0,0,0,0.6); border: 1px solid var(--glass-border); 
            padding: 15px; border-radius: 10px; color: #fff; width: 100%; 
            box-sizing: border-box; margin-bottom: 10px; font-family: inherit; font-size: 1rem;
        }
        .btn-main { 
            background: linear-gradient(90deg, #2563eb, #3b82f6); color: #fff; 
            border: none; padding: 18px; border-radius: 10px; font-weight: 900; 
            font-size: 1.1rem; cursor: pointer; text-transform: uppercase; width: 100%;
            box-shadow: 0 5px 20px rgba(59, 130, 246, 0.5); transition: 0.3s;
        }
        .btn-main:hover { transform: translateY(-2px); filter: brightness(1.2); }

        /* --- RESPONSIVIDADE --- */
        @media (max-width: 1024px) {
            .dashboard-container { grid-template-columns: 1fr; }
            .grid { max-width: 300px; }
            .panel { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="banner-topo"><img src="1000121485.png" alt="MRS"></div>

    <div class="dashboard-container">
        <div class="panel status-panel">
            <h1 class="mrs-titulo">MRS LOGÍSTICA</h1>
            <div class="contador-container">STATUS: <span class="contador" id="contador-txt">0/5</span></div>
            <button class="btn-main" style="padding: 10px; font-size: 0.75rem; background: #1e293b;" onclick="location.reload()">REINICIAR SISTEMA</button>
        </div>

        <div class="panel"><div class="grid" id="grid-box"></div></div>

        <div class="panel intel-panel">
            <div class="mascote-wrapper">
                <img src="1000123476.png" alt="Trem Bão" class="trem-bao">
                <div class="hologram-base"></div>
            </div>
            <div id="intel-content" class="intel-text">
                "Sistemas de monitoramento ativos. Localize os pontos de atenção no grid acima para iniciar a análise de segurança."
            </div>
        </div>
    </div>

    <div class="panel footer-panel">
        <input type="text" class="input-mrs" id="feedback-caixa" placeholder="Registre aqui sua sugestão ou relato de segurança do trecho...">
        <button class="btn-main" onclick="transmitirRelatorio()">TRANSMITIR RELATÓRIO AO FORMS</button>
    </div>

    <script>
        /* ============================================================
           LÓGICA DO JOGO E INTELIGÊNCIA ARTIFICIAL
           ============================================================ */
        const SIZE = 10;
        let selecionadas = [], encontradas = [], gridData = [];
        
        // Banco de Dados de Conhecimento
        const bancoDados = [
            {txt: "PRESSA", nivel: "grave", dica: "A pressa é a inimiga da segurança operacional.", fato: "FATO: 46% das amputações ferroviárias em pátios ocorrem por pressa nas manobras de engate."},
            {txt: "CELULAR", nivel: "grave", dica: "Foco total na via! O celular anula sua percepção.", fato: "FATO: O desastre de Chatsworth ocorreu porque o maquinista ignorou o sinal ao enviar um SMS."},
            {txt: "FADIGA", nivel: "medio", dica: "Cansaço reduz reflexos de forma crítica.", fato: "FATO: Micro-sonos de 2 segundos a 40km/h são suficientes para causar descarrilamentos fatais."},
            {txt: "ATENCAO", nivel: "medio", dica: "A rotina pode criar cegueira operacional.", fato: "FATO: A maioria dos incidentes ocorre em locais conhecidos, onde o excesso de confiança baixa a guarda."},
            {txt: "TEMPO", nivel: "leve", dica: "Planejamento evita urgências desnecessárias.", fato: "FATO: Saídas antecipadas reduzem o estresse cognitivo e falhas de comunicação em 70%."}
        ];

        // Inicialização do Tabuleiro
        function init() {
            let pronto = false;
            while (!pronto) { 
                gridData = Array(SIZE).fill(null).map(() => Array(SIZE).fill('')); 
                pronto = distribuirPalavras(); 
            }
            preencherLixo(); 
            renderizarGrid();
        }

        function distribuirPalavras() {
            for (let p of bancoDados) {
                let colocada = false, tentativas = 0;
                while (!colocada && tentativas < 2500) {
                    let h = Math.random() > 0.5;
                    let r = Math.floor(Math.random() * (h ? SIZE : SIZE - p.txt.length));
                    let c = Math.floor(Math.random() * (h ? SIZE - p.txt.length : SIZE));
                    let ok = true;
                    for (let i = 0; i < p.txt.length; i++) {
                        if (gridData[h ? r : r + i][h ? c + i : c] !== '') ok = false;
                    }
                    if (ok) {
                        for (let i = 0; i < p.txt.length; i++) gridData[h ? r : r + i][h ? c + i : c] = p.txt[i];
                        colocada = true;
                    }
                    tentativas++;
                }
                if (!colocada) return false;
            } return true;
        }

        function preencherLixo() {
            const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < SIZE; r++) 
                for (let c = 0; c < SIZE; c++) 
                    if (gridData[r][c] === '') gridData[r][c] = abc[Math.floor(Math.random() * abc.length)];
        }

        function renderizarGrid() {
            const container = document.getElementById("grid-box"); container.innerHTML = '';
            gridData.forEach((row, r) => row.forEach((letra, c) => {
                const div = document.createElement("div"); 
                div.className = "cell"; div.innerText = letra;
                div.onclick = () => processarClique(div, letra, r, c); 
                container.appendChild(div);
            }));
        }

        function processarClique(el, letra, r, c) {
            if (el.classList.contains('found-grave') || el.classList.contains('found-medio') || el.classList.contains('found-leve')) return;
            
            // Rebobinar seleção
            if (el.classList.contains('selected')) {
                const index = selecionadas.findIndex(s => s.el === el);
                if (index === selecionadas.length - 1) { el.classList.remove('selected'); selecionadas.pop(); }
                return;
            }

            // Trava direcional e adjacência
            if (selecionadas.length > 0) {
                const last = selecionadas[selecionadas.length - 1];
                const dr = Math.abs(r - last.r), dc = Math.abs(c - last.c);
                if ((dr > 1 || dc > 1) || (dr === 1 && dc === 1)) return;
                if (selecionadas.length >= 2) {
                    const first = selecionadas[0], second = selecionadas[1];
                    if (first.r === second.r && r !== last.r) return;
                    if (first.c === second.c && c !== last.c) return;
                }
            }

            el.classList.add('selected'); 
            selecionadas.push({el, letra, r, c}); 
            verificarMatch();
        }

        function verificarMatch() {
            const formada = selecionadas.map(s => s.letra).join('');
            const invertida = [...formada].reverse().join('');
            const alvo = bancoDados.find(p => (p.txt === formada || p.txt === invertida) && !encontradas.includes(p.txt));
            
            if (alvo) {
                const corClas = `found-${alvo.nivel}`;
                selecionadas.forEach(s => { s.el.classList.remove('selected'); s.el.classList.add(corClas); });
                encontradas.push(alvo.txt); selecionadas = [];
                document.getElementById("contador-txt").innerText = `${encontradas.length}/5`;
                dispararInteligencia(alvo);
            }
        }

        // SISTEMA DE VOZ E TERMINAL
        function dispararInteligencia(alvo) {
            const painel = document.getElementById("intel-content");
            const corHex = alvo.nivel === 'grave' ? '#ff2a2a' : alvo.nivel === 'medio' ? '#ffcc00' : '#00ffaa';
            
            painel.innerHTML = `
                <div class="intel-title" style="color:${corHex}">[!] ${alvo.txt} DETECTADO</div>
                <div id="typewriter"></div>
                <div id="fato-box" class="fato-box"></div>
            `;
            
            let i = 0;
            const msg = alvo.dica;
            function digitar() {
                if (i < msg.length) {
                    document.getElementById("typewriter").innerHTML += msg.charAt(i);
                    i++; setTimeout(digitar, 15); // TURBO SPEED
                } else {
                    document.getElementById("fato-box").innerHTML = alvo.fato;
                }
            }

            // VOZ MASCULINA ROBÓTICA
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const voz = new SpeechSynthesisUtterance(msg + ". " + alvo.fato);
                voz.lang = 'pt-BR'; 
                voz.pitch = 0.5; // GRAVE MASCULINO
                voz.rate = 1.2;  // RÁPIDO
                window.speechSynthesis.speak(voz);
            }
            digitar();
        }

        function transmitirRelatorio() {
            const feedback = document.getElementById("feedback-caixa").value;
            if(!feedback) { alert("Atenção: Registre sua percepção antes de transmitir."); return; }
            window.open('https://forms.gle/ut3jDiKRPWSGVXw37');
        }

        init();
    </script>
</body>
</html>
