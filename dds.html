<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRS - Dashboard Neuro-Operacional</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --mrs-blue: #0b3a6f; --accent: #ffffff; --selected: #3b82f6; 
            --danger: #ff2a2a; --warning: #ffcc00; --info: #00ffaa; --neon-blue: #00d2ff;
            --glass-bg: rgba(10, 15, 30, 0.96); --glass-border: rgba(0, 210, 255, 0.3);
        }
        
        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background: #020617; color: #f8fafc; min-height: 100vh; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 15px; box-sizing: border-box; overflow-x: hidden;
        }

        .banner-topo { 
            width: 100%; max-width: 1200px; margin-bottom: 25px; 
            border-radius: 12px; overflow: hidden; border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .banner-topo img { width: 100%; display: block; }

        .dashboard-container { 
            display: grid; grid-template-columns: 1fr 1.5fr 1fr; 
            gap: 20px; width: 100%; max-width: 1200px; margin-bottom: 25px; 
        }

        .panel { 
            background: var(--glass-bg); backdrop-filter: blur(25px); 
            border: 1px solid var(--glass-border); border-radius: 18px; 
            padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); 
            display: flex; flex-direction: column; 
        }

        .status-panel { text-align: center; justify-content: center; }
        .mrs-titulo { margin: 0; font-size: 1.8rem; font-weight: 800; text-transform: uppercase; color: var(--accent); }
        .status-badge { margin: 20px 0; font-weight: 700; font-size: 1.2rem; color: var(--neon-blue); }

        .grid { 
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; 
            width: 100%; max-width: 350px; margin: 0 auto; padding: 15px; 
            background: rgba(0,0,0,0.4); border-radius: 14px; 
        }
        .cell { 
            aspect-ratio: 1; background: #ffffff; color: #0b1120; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 4px; font-weight: 600; font-size: 1.4rem; 
            cursor: pointer; transition: 0.2s; user-select: none;
        }
        .selected { background: var(--selected) !important; color: #fff !important; }
        .found-word { background: var(--danger) !important; color: #fff !important; box-shadow: 0 0 15px var(--danger); }

        /* TERMINAL DE INTELIGÊNCIA */
        .intel-panel { border-left: 6px solid var(--neon-blue); min-height: 600px; }
        .intel-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 20px; color: var(--neon-blue); text-transform: uppercase; border-bottom: 2px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        
        .intel-box { margin-bottom: 18px; padding: 15px; border-radius: 10px; font-size: 1rem; line-height: 1.6; animation: slideIn 0.4s ease-out; }
        .box-neuro { background: rgba(255,255,255,0.05); border-left: 4px solid var(--info); }
        .box-fatal { background: rgba(255,42,42,0.12); border-left: 4px solid var(--danger); color: #ffa0a0; }
        .box-pratica { background: rgba(0,210,255,0.12); border-left: 4px solid var(--neon-blue); }

        @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

        /* RÁDIO TRECHO GIGANTE */
        .footer-panel { width: 100%; max-width: 1200px; border-bottom: 6px solid var(--selected); margin-top: 20px; }
        .radio-header { margin-bottom: 15px; text-align: center; }
        .radio-header h3 { margin: 0; font-size: 1.4rem; text-transform: uppercase; color: var(--accent); }
        
        .input-mrs { 
            background: rgba(0,0,0,0.7); border: 2px solid var(--glass-border); 
            padding: 30px; border-radius: 15px; color: #fff; width: 100%; 
            box-sizing: border-box; font-family: inherit; font-size: 1.3rem; 
            min-height: 300px; /* Gigante */ resize: none; margin-bottom: 15px;
        }
        .btn-main { background: linear-gradient(90deg, #1e40af, #3b82f6); color: #fff; border: none; padding: 25px; border-radius: 12px; font-weight: 800; font-size: 1.5rem; cursor: pointer; text-transform: uppercase; width: 100%; }

        @media (max-width: 1024px) { .dashboard-container { grid-template-columns: 1fr; } .grid { max-width: 320px; } .panel { padding: 20px; } .input-mrs { min-height: 250px; } }
    </style>
</head>
<body>

    <div class="banner-topo"><img src="1000121485.png" alt="MRS LOGÍSTICA"></div>

    <div class="dashboard-container">
        <div class="panel status-panel">
            <h1 class="mrs-titulo">MRS LOGÍSTICA</h1>
            <div class="status-badge">CONCEITOS NEUROCOMPORTAMENTAIS [<span id="contador-txt">0/5</span>]</div>
            <button class="btn-main" style="padding:15px; font-size:0.9rem; background:#1e293b;" onclick="location.reload()">REINICIAR TRILHA</button>
        </div>

        <div class="panel"><div class="grid" id="grid-box"></div></div>

        <div class="panel intel-panel">
            <div class="intel-title">Relatório de Inteligência Operacional</div>
            <div id="intel-content">
                "Identifique os termos no grid para carregar estudos neurocomportamentais e análises de impacto fatal."
            </div>
        </div>
    </div>

    <div class="panel footer-panel">
        <div class="radio-header"><h3>📡 Rádio Trecho: Registro Operacional</h3></div>
        <textarea class="input-mrs" id="feedback-caixa" placeholder="Registre aqui a síntese neurocomportamental da equipe e compromissos firmados..."></textarea>
        <button class="btn-main" onclick="transmitir()">TRANSMITIR RELATÓRIO AO FORMS</button>
    </div>

    <script>
        const SIZE = 10;
        let selecionadas = [], encontradas = [], gridData = [];
        
        const bancoDados = [
            {
                txt: "SONO", display: "ALERTA: SONO / FADIGA",
                neuro: "A Dessincronose Circadiana impede a recaptação de adenosina no cérebro. Sob fadiga extrema, o córtex pré-frontal 'desliga' por frações de segundo (microsso) enquanto os olhos permanecem abertos.",
                fatal: "TRAGÉDIA REAL: Hinton (Canadá, 1986). A tripulação em estado de exaustão extrema não processou visualmente a sinalização. Colisão frontal resultou em 23 mortes.",
                pratica: "Utilize a higiene do sono e monitore pródromos neurais (bocejos cíclicos e fixação ocular). Identificado o microsso, a única ação segura é a interrupção imediata da condução."
            },
            {
                txt: "CELULAR", display: "ALERTA: CEGUEIRA POR DESATENÇÃO",
                neuro: "O processamento de mensagens sequestra a 'Rede de Saliência' do cérebro. O fenômeno 'Inattentional Blindness' faz com que o condutor olhe para o sinal, mas o cérebro não o 'registre' por estar saturado.",
                fatal: "TRAGÉDIA REAL: Chatsworth (EUA, 2008). 25 fatalidades. O maquinista enviou mensagens de texto segundos antes de ignorar o sinal vermelho. O 'gargalo cognitivo' impediu a detecção do perigo.",
                pratica: "Elimine o 'brain bottleneck'. O cérebro não realiza multitarefa real na condução; ele alterna focos. Desligue o dispositivo para liberar largura de banda neural para a via."
            },
            {
                txt: "ATENCAO", display: "ALERTA: ATENÇÃO / HABITUAÇÃO",
                neuro: "A 'Hipnose Ferroviária' ocorre pela habituação sensorial. Estímulos repetitivos (trecho conhecido) fazem o cérebro economizar energia, reduzindo a consciência situacional para níveis críticos.",
                fatal: "TRAGÉDIA REAL: Santiago de Compostela (Espanha, 2013). 79 mortos. O maquinista, por excesso de familiaridade, perdeu a noção de localização espacial e entrou na curva a 179km/h.",
                pratica: "Force a neuroplasticidade variando o foco visual ativamente. O protocolo 'Apontar e Falar' (Shisa Kanko) obriga o sistema límbico a validar a percepção real sobre a projeção mental."
            },
            {
                txt: "SINAL", display: "ALERTA: VIÉS DE CONFIRMAÇÃO",
                neuro: "O processamento 'Top-Down' faz o cérebro 'projetar' o verde por expectativa (padrão habitual). Em situações de sinal duvidoso, o viés de confirmação faz o condutor ignorar evidências de perigo.",
                fatal: "TRAGÉDIA REAL: Bad Aibling (Alemanha, 2016). 12 mortos. Uma série de interpretações erradas de sinais forçadas pela expectativa de fluxo resultou em colisão violenta em via singela.",
                pratica: "Quebre o viés de expectativa. Em aspectos degradados, aplique o 'Anotar e Cantar'. Trate cada sinalização como uma informação inédita para evitar a projeção mental de padrão verde."
            },
            {
                txt: "PRESSA", display: "ALERTA: SEQUESTRO DA AMÍGDALA",
                neuro: "A urgência temporal dispara o cortisol e causa o 'Sequestro da Amígdala'. O sistema límbico prioriza a meta (chegar) e causa 'Visão de Túnel' física, reduzindo a percepção periférica em até 70%.",
                fatal: "TRAGÉDIA REAL: Amagasaki (Japão, 2005). 107 mortos. O condutor acelerou em uma curva para compensar um atraso de apenas 90 segundos. A pressa química anulou o julgamento de risco.",
                pratica: "Monitore a taquicardia induzida por atrasos. Respire fundo para modular o sistema parassimpático e recuperar a visão periférica esencial para detecção de anomalias na via."
            }
        ];

        function init() {
            let pronto = false;
            while (!pronto) { gridData = Array(SIZE).fill(null).map(() => Array(SIZE).fill('')); pronto = distribuirPalavras(); }
            preencherLixo(); renderizarGrid();
        }

        function distribuirPalavras() {
            const lista = [...bancoDados].sort((a,b) => b.txt.length - a.txt.length);
            for (let p of lista) {
                let colocada = false, tentativas = 0;
                while (!colocada && tentativas < 4000) {
                    let h = Math.random() > 0.5, r = Math.floor(Math.random() * (h ? SIZE : SIZE - p.txt.length)), c = Math.floor(Math.random() * (h ? SIZE - p.txt.length : SIZE));
                    let ok = true;
                    for (let i = 0; i < p.txt.length; i++) if (gridData[h?r:r+i][h?c+i:c] !== '') ok = false;
                    if (ok) { for (let i = 0; i < p.txt.length; i++) gridData[h?r:r+i][h?c+i:c] = p.txt[i]; colocada = true; }
                    tentativas++;
                }
                if (!colocada) return false;
            } return true;
        }

        function preencherLixo() {
            const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) 
                if (gridData[r][c] === '') gridData[r][c] = abc[Math.floor(Math.random() * abc.length)];
        }

        function renderizarGrid() {
            const container = document.getElementById("grid-box"); container.innerHTML = '';
            gridData.forEach((row, r) => row.forEach((letra, c) => {
                const div = document.createElement("div"); div.className = "cell"; div.innerText = letra;
                div.onclick = () => gerenciarClique(div, letra, r, c); container.appendChild(div);
            }));
        }

        function gerenciarClique(el, letra, r, c) {
            if (el.classList.contains('found-word')) return;
            if (el.classList.contains('selected')) {
                const index = selecionadas.findIndex(s => s.el === el);
                if (index === selecionadas.length - 1) { el.classList.remove('selected'); selecionadas.pop(); }
                return;
            }
            if (selecionadas.length > 0) {
                const last = selecionadas[selecionadas.length - 1];
                if (Math.abs(r - last.r) > 1 || Math.abs(c - last.c) > 1 || (r !== last.r && c !== last.c)) return;
                if (selecionadas.length >= 2) {
                    const first = selecionadas[0], second = selecionadas[1];
                    if (first.r === second.r && r !== last.r) return;
                    if (first.c === second.c && c !== last.c) return;
                }
            }
            el.classList.add('selected'); selecionadas.push({el, letra, r, c}); verificarMatch();
        }

        function verificarMatch() {
            const formada = selecionadas.map(s => s.letra).join('');
            const invertida = [...formada].reverse().join('');
            const alvo = bancoDados.find(p => (p.txt === formada || p.txt === invertida) && !encontradas.includes(p.txt));
            if (alvo) {
                selecionadas.forEach(s => { s.el.classList.remove('selected'); s.el.classList.add('found-word'); });
                encontradas.push(alvo.txt); selecionadas = [];
                document.getElementById("contador-txt").innerText = `${encontradas.length}/5`;
                apresentarImpacto(alvo);
            }
        }

        function apresentarImpacto(alvo) {
            const painel = document.getElementById("intel-content");
            painel.innerHTML = `
                <div style="color:var(--danger); font-weight:800; margin-bottom:15px; font-size:1.15rem; border-bottom: 2px solid var(--danger); padding-bottom:5px;">
                   [ ! ] DETECTADO: ${alvo.display}
                </div>
                <div class="intel-box box-neuro"><b>ANÁLISE NEURAL:</b><br>${alvo.neuro}</div>
                <div class="intel-box box-fatal"><b>OCORRÊNCIA NO MUNDO:</b><br>${alvo.fatal}</div>
                <div class="intel-box box-pratica"><b>BOA PRÁTICA RECOMENDADA:</b><br>${alvo.pratica}</div>
            `;
        }

        function transmitir() {
            if(!document.getElementById("feedback-caixa").value) { alert("Registre o relatório neurocomportamental."); return; }
            window.open('https://forms.gle/ut3jDiKRPWSGVXw37');
        }

        init();
    </script>
</body>
</html>
