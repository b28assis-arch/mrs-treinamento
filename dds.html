<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRS - Dashboard Trem Bão</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --mrs-blue: #0b3a6f; --accent: #ffffff; --selected: #3b82f6; 
            --danger: #ff2a2a; --warning: #ffcc00; --info: #00ffaa; --neon-blue: #00d2ff;
            --glass-bg: rgba(10, 15, 30, 0.95); --glass-border: rgba(0, 210, 255, 0.3);
        }
        
        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background: #020617 url('fundo-mrs.png') no-repeat center center fixed; 
            background-size: cover; color: #f8fafc; min-height: 100vh; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 15px; box-sizing: border-box; overflow-x: hidden;
        }

        /* --- ESTRUTURA --- */
        .banner-topo { 
            width: 100%; max-width: 1200px; margin-bottom: 20px; 
            border-radius: 16px; overflow: hidden; border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .banner-topo img { width: 100%; display: block; }

        .dashboard-container { 
            display: grid; grid-template-columns: 1fr 1.5fr 1fr; 
            gap: 20px; width: 100%; max-width: 1200px; margin-bottom: 20px; 
        }

        .panel { 
            background: var(--glass-bg); backdrop-filter: blur(25px); 
            border: 1px solid var(--glass-border); border-radius: 20px; 
            padding: 25px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); 
            display: flex; flex-direction: column; 
        }

        /* --- STATUS --- */
        .status-panel { text-align: center; justify-content: center; }
        .mrs-titulo { margin: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
        .contador-container { margin: 20px 0; font-size: 1rem; font-weight: 700; }
        .contador { background: #000; padding: 5px 15px; border-radius: 8px; color: var(--neon-blue); border: 1px solid var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); font-family: monospace; }

        /* --- GRID NÍTIDO --- */
        .grid { 
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; 
            width: 100%; max-width: 320px; margin: 0 auto; padding: 12px; 
            background: rgba(0,0,0,0.5); border-radius: 15px; 
        }
        .cell { 
            aspect-ratio: 1; background: #ffffff; color: #0b1120; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 5px; font-weight: 600; /* Peso ideal para não borrar */
            font-size: 1.4rem; cursor: pointer; transition: 0.2s; user-select: none;
        }
        .selected { background: var(--selected) !important; color: #fff !important; }
        .found-grave { background: var(--danger) !important; color: #fff !important; box-shadow: 0 0 12px var(--danger); }
        .found-medio { background: var(--warning) !important; color: #000 !important; box-shadow: 0 0 12px var(--warning); }
        .found-leve { background: var(--info) !important; color: #000 !important; box-shadow: 0 0 12px var(--info); }

        /* --- TERMINAL DE INTELIGÊNCIA --- */
        .intel-panel { border-left: 5px solid var(--neon-blue); min-height: 420px; }
        .intel-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; text-transform: uppercase; color: var(--neon-blue); border-bottom: 1px solid var(--glass-border); padding-bottom: 10px; }
        .intel-text { font-size: 1.1rem; line-height: 1.5; color: #f1f5f9; }
        
        .fato-box { margin-top: 15px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 10px; color: #cbd5e1; font-size: 0.95rem; border-left: 3px solid var(--warning); }
        .exemplo-box { margin-top: 10px; padding: 12px; background: rgba(0, 210, 255, 0.1); border-radius: 10px; color: var(--neon-blue); font-size: 0.95rem; border-left: 3px solid var(--neon-blue); }

        /* --- RÁDIO TRECHO GIGANTE --- */
        .footer-panel { width: 100%; max-width: 1200px; border-bottom: 5px solid var(--selected); margin-top: 20px; }
        .radio-header { margin-bottom: 15px; }
        .radio-header h3 { margin: 0; font-size: 1.4rem; color: var(--accent); text-transform: uppercase; display: flex; align-items: center; gap: 10px; }
        
        .input-mrs { 
            background: rgba(0,0,0,0.7); border: 2px solid var(--glass-border); 
            padding: 25px; border-radius: 12px; color: #fff; width: 100%; 
            box-sizing: border-box; margin-bottom: 20px; font-family: inherit; 
            font-size: 1.2rem; min-height: 180px; resize: none;
        }
        .btn-main { 
            background: linear-gradient(90deg, #2563eb, #3b82f6); color: #fff; 
            border: none; padding: 25px; border-radius: 12px; font-weight: 900; 
            font-size: 1.3rem; cursor: pointer; text-transform: uppercase; width: 100%; 
            box-shadow: 0 5px 25px rgba(59, 130, 246, 0.6); 
        }

        @media (max-width: 1024px) {
            .dashboard-container { grid-template-columns: 1fr; }
            .grid { max-width: 300px; }
            .panel { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="banner-topo"><img src="1000121485.png" alt="MRS LOGÍSTICA"></div>

    <div class="dashboard-container">
        <div class="panel status-panel">
            <h1 class="mrs-titulo">MRS LOGÍSTICA</h1>
            <div class="contador-container">VARREDURA: <span class="contador" id="contador-txt">0/5</span></div>
            <button class="btn-main" style="padding:12px; font-size:0.8rem; background:#1e293b;" onclick="location.reload()">REINICIAR SISTEMA</button>
        </div>

        <div class="panel"><div class="grid" id="grid-box"></div></div>

        <div class="panel intel-panel">
            <div id="intel-content" class="intel-text">
                <div class="intel-title">Inteligência Operacional</div>
                "Terminal em prontidão. Localize os riscos de SONO, CELULAR, ATENÇÃO, SINAL e TEMPO no grid."
            </div>
        </div>
    </div>

    <div class="panel footer-panel">
        <div class="radio-header">
            <h3>📡 Rádio Trecho: Sua voz na operação</h3>
        </div>
        <textarea class="input-mrs" id="feedback-caixa" placeholder="Registre aqui um compromisso, desvio observado ou sugestão da equipe..."></textarea>
        <button class="btn-main" onclick="transmitir()">TRANSMITIR AO FORMS</button>
    </div>

    <script>
        const SIZE = 10;
        let selecionadas = [], encontradas = [], gridData = [];
        
        const bancoDados = [
            {
                txt: "SONO", nivel: "grave", 
                dica: "Fadiga é fisiológica. O sono não avisa quando chega.", 
                fato: "FATO: Micro-sonos de 2s a 40km/h fazem o trem percorrer 22m sem controle. O desastre em Hinton (Canadá) foi causado por exaustão extrema.",
                exemplo: "BOA PRÁTICA: Se sentir sinais de fadiga, pare o trem imediatamente e peça instruções conforme o regulamento."
            },
            {
                txt: "CELULAR", nivel: "grave", 
                dica: "O uso do celular anula sua percepção de risco na via.", 
                fato: "PEGADINHA: No desastre de Chatsworth, o maquinista enviou 22 mensagens antes de ignorar o sinal vermelho e colidir de frente.",
                exemplo: "BOA PRÁTICA: Celular deve permanecer guardado e em modo silencioso durante toda a operação na cabine."
            },
            {
                txt: "ATENCAO", nivel: "medio", 
                dica: "A rotina gera excesso de confiança e cegueira operacional.", 
                fato: "FATO: 80% dos erros operacionais ocorrem em locais que o colaborador conhece muito bem, onde ele 'baixa a guarda'.",
                exemplo: "BOA PRÁTICA: Use o 'Anotar e Cantar' para cada sinalização, mesmo naqueles trechos que você faz todo dia."
            },
            {
                txt: "SINAL", nivel: "grave", 
                dica: "Em modo degradado, a atenção deve ser redobrada.", 
                fato: "FATO: O avanço de sinal em modo degradado é um dos riscos mais altos da ferrovia por falta de proteção automática.",
                exemplo: "BOA PRÁTICA: Utilize mapas de sinalização e layouts de pátios. Em caso de dúvida, pare e pergunte."
            },
            {
                txt: "TEMPO", nivel: "leve", 
                dica: "O planejamento elimina a urgência e a pressa.", 
                fato: "FATO: O descarrilamento em Amagasaki (Japão) ocorreu porque o maquinista correu para compensar um atraso de apenas 90 segundos.",
                exemplo: "BOA PRÁTICA: No trajeto casa-trabalho, saia com antecedência. A pressa gera visão de túnel e causa atropelamentos."
            }
        ];

        function init() {
            let pronto = false;
            while (!pronto) { gridData = Array(SIZE).fill(null).map(() => Array(SIZE).fill('')); pronto = distribuirPalavras(); }
            preencherLixo(); renderizarGrid();
        }

        function distribuirPalavras() {
            const lista = [...bancoDados].sort((a,b) => b.txt.length - a.txt.length);
            for (let p of lista) {
                let colocada = false, tentativas = 0;
                while (!colocada && tentativas < 3000) {
                    let h = Math.random() > 0.5, r = Math.floor(Math.random() * (h ? SIZE : SIZE - p.txt.length)), c = Math.floor(Math.random() * (h ? SIZE - p.txt.length : SIZE));
                    let ok = true;
                    for (let i = 0; i < p.txt.length; i++) if (gridData[h?r:r+i][h?c+i:c] !== '') ok = false;
                    if (ok) { for (let i = 0; i < p.txt.length; i++) gridData[h?r:r+i][h?c+i:c] = p.txt[i]; colocada = true; }
                    tentativas++;
                }
                if (!colocada) return false;
            } return true;
        }

        function preencherLixo() {
            const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (gridData[r][c] === '') gridData[r][c] = abc[Math.floor(Math.random() * abc.length)];
        }

        function renderizarGrid() {
            const container = document.getElementById("grid-box"); container.innerHTML = '';
            gridData.forEach((row, r) => row.forEach((letra, c) => {
                const div = document.createElement("div"); div.className = "cell"; div.innerText = letra;
                div.onclick = () => clicar(div, letra, r, c); container.appendChild(div);
            }));
        }

        function clicar(el, letra, r, c) {
            if (el.classList.contains('found-grave') || el.classList.contains('found-medio') || el.classList.contains('found-leve')) return;
            if (el.classList.contains('selected')) {
                const index = selecionadas.findIndex(s => s.el === el);
                if (index === selecionadas.length - 1) { el.classList.remove('selected'); selecionadas.pop(); }
                return;
            }
            if (selecionadas.length > 0) {
                const last = selecionadas[selecionadas.length - 1];
                if (Math.abs(r - last.r) > 1 || Math.abs(c - last.c) > 1 || (r !== last.r && c !== last.c)) return;
                if (selecionadas.length >= 2) {
                    const first = selecionadas[0], second = selecionadas[1];
                    if (first.r === second.r && r !== last.r) return;
                    if (first.c === second.c && c !== last.c) return;
                }
            }
            el.classList.add('selected'); selecionadas.push({el, letra, r, c}); verificar();
        }

        function verificar() {
            const formada = selecionadas.map(s => s.letra).join('');
            const invertida = [...formada].reverse().join('');
            const alvo = bancoDados.find(p => (p.txt === formada || p.txt === invertida) && !encontradas.includes(p.txt));
            if (alvo) {
                const cor = `found-${alvo.nivel}`;
                selecionadas.forEach(s => { s.el.classList.remove('selected'); s.el.classList.add(cor); });
                encontradas.push(alvo.txt); selecionadas = [];
                document.getElementById("contador-txt").innerText = `${encontradas.length}/5`;
                processarIntel(alvo);
            }
        }

        function processarIntel(alvo) {
            const painel = document.getElementById("intel-content");
            const cor = alvo.nivel === 'grave' ? '#ff2a2a' : alvo.nivel === 'medio' ? '#ffcc00' : '#00ffaa';
            painel.innerHTML = `<div style="color:${cor}; font-weight:800; margin-bottom:10px; font-size:1.2rem">[!] ${alvo.txt}</div><div id="typing"></div><div class="fato-box" id="fato"></div><div class="exemplo-box" id="exemplo"></div>`;
            
            let i = 0;
            function digitar() {
                if (i < alvo.dica.length) {
                    document.getElementById("typing").innerHTML += alvo.dica.charAt(i);
                    i++; setTimeout(digitar, 15);
                } else { 
                    document.getElementById("fato").innerHTML = "<b>FATO:</b> " + alvo.fato;
                    document.getElementById("exemplo").innerHTML = "<b>EXEMPLO:</b> " + alvo.exemplo;
                }
            }

            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const voz = new SpeechSynthesisUtterance(alvo.dica + ". Fato: " + alvo.fato);
                voz.lang = 'pt-BR'; voz.pitch = 0.5; voz.rate = 1.2;
                window.speechSynthesis.speak(voz);
            }
            digitar();
        }

        function transmitir() {
            if(!document.getElementById("feedback-caixa").value) { alert("Registre o DDS antes de transmitir."); return; }
            window.open('https://forms.gle/ut3jDiKRPWSGVXw37');
        }

        init();
    </script>
</body>
</html>
