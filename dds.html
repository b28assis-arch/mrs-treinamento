<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRS - Trilha de Conhecimento: DDS Trajeto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mrs-blue: #0b3a6f; 
            --bg-dark: #0f172a; 
            --bg-darker: #020617;
            --accent: #ffffff;
            --selected: #3b82f6; 
            
            /* Cores dos Botões (Fortes) */
            --danger-btn: #ef4444; 
            --warning-btn: #f59e0b;
            --info-btn: #10b981; 
            
            /* Cores dos Textos (Mais Suaves e Elegantes) */
            --danger-text: #fb7185; /* Coral suave */
            --warning-text: #fbbf24;
            --info-text: #34d399;

            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
        }
        
        /* Ajuste: Removido o padding inferior para a imagem colar no fundo */
        body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 100%); color: #f8fafc; text-align: center; padding: 15px 12px 0 12px; min-height: 100vh; overflow-x: hidden; }
        
        /* CABEÇALHO CLEAN */
        .header-simple { 
            background: rgba(0,0,0,0.3);
            padding: 25px 15px; 
            border-radius: 20px; 
            margin-bottom: 20px; 
            border: 1px solid var(--glass-border); 
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .mrs-titulo { margin: 0; font-size: 1.3rem; font-weight: 900; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
        .fase-badge { background: var(--mrs-blue); color: var(--accent); display: inline-block; padding: 6px 16px; border-radius: 30px; font-weight: 800; font-size: 0.7rem; letter-spacing: 0.5px; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.2); margin: 10px 0;}
        
        .progresso-container { font-weight: 600; font-size: 0.8rem; display: flex; gap: 8px; color: #cbd5e1; }
        .contador-bolinha { background: rgba(0,0,0,0.5); padding: 2px 10px; border-radius: 20px; color: var(--accent); font-weight: 800; }
        
        /* Controles Modernos */
        .controles { display: flex; justify-content: center; gap: 12px; margin: 20px 0; }
        .btn-aux { background: var(--glass-bg); color: #cbd5e1; border: 1px solid var(--glass-border); padding: 12px; border-radius: 12px; font-weight: 600; cursor: pointer; font-size: 0.7rem; text-transform: uppercase; flex: 1; max-width: 180px; transition: all 0.2s; }
        .btn-aux:active { transform: scale(0.95); background: rgba(255,255,255,0.15); color: #fff; }
        
        /* GRID 10x10 NEUMÓRFICO */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 4px; 
            width: 100%; 
            max-width: 360px; 
            margin: 0 auto 20px auto; 
            background: var(--glass-bg); 
            padding: 15px; 
            border-radius: 24px; 
            border: 1px solid var(--glass-border); 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
        }
        
        .cell { 
            aspect-ratio: 1; 
            background: rgba(255, 255, 255, 0.9); 
            color: var(--bg-darker); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 6px; 
            font-weight: 900; 
            font-size: 0.9rem; 
            cursor: pointer; 
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); 
            user-select: none; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        .cell:active { transform: scale(0.85); }
        
        /* Cores de Acerto e Pulso Visual (Vibração Falsa) */
        .selected { background: var(--selected) !important; color: #fff !important; }
        .found-grave { background: var(--danger-btn) !important; color: #fff !important; animation: successPulse 0.6s cubic-bezier(0.16, 1, 0.3, 1); border: none; }
        .found-medio { background: var(--warning-btn) !important; color: #000 !important; animation: successPulse 0.6s cubic-bezier(0.16, 1, 0.3, 1); border: none; }
        .found-leve { background: var(--info-btn) !important; color: #000 !important; animation: successPulse 0.6s cubic-bezier(0.16, 1, 0.3, 1); border: none; }

        @keyframes successPulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); box-shadow: 0 0 25px rgba(255,255,255,0.8); z-index: 10; }
            100% { transform: scale(1); }
        }
        
        /* Insights Estilo App (Agora com o vermelho suave) */
        #resultado { width: 100%; max-width: 440px; margin: 0 auto 20px auto; display: flex; flex-direction: column; gap: 15px; }
        .insight { background: var(--bg-darker); padding: 20px; border-radius: 16px; text-align: left; font-size: 0.8rem; font-weight: 400; line-height: 1.6; color: #cbd5e1; border-left: 4px solid transparent; box-shadow: 0 10px 25px rgba(0,0,0,0.5); animation: slideUp 0.4s ease; }
        
        /* O título recebe a cor, mas o restante do negrito fica branco! */
        .alerta-titulo { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 10px; font-weight: 900; }
        .insight strong { color: #ffffff; } 
        
        .insight.grave { border-left-color: var(--danger-btn); }
        .insight.grave .alerta-titulo { color: var(--danger-text); }
        
        .insight.medio { border-left-color: var(--warning-btn); }
        .insight.medio .alerta-titulo { color: var(--warning-text); }
        
        .insight.leve { border-left-color: var(--info-btn); }
        .insight.leve .alerta-titulo { color: var(--info-text); }

        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* Área do Rádio Trecho */
        .analise-section { width: 100%; max-width: 440px; margin: 0 auto 40px auto; background: var(--glass-bg); padding: 25px 20px; border-radius: 24px; text-align: left; box-sizing: border-box; border: 1px solid var(--glass-border); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .analise-section h3 { margin: 0 0 8px 0; font-size: 0.9rem; color: var(--accent); text-transform: uppercase; font-weight: 800; }
        .analise-section p { font-size: 0.75rem; color: #cbd5e1; line-height: 1.5; margin-bottom: 15px; }
        textarea { width: 100%; height: 90px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.2); padding: 15px; box-sizing: border-box; font-family: 'Inter', sans-serif; margin-bottom: 15px; font-size: 0.8rem; background: rgba(0,0,0,0.2); color: #fff; transition: all 0.3s; resize: none; }
        textarea:focus { outline: none; border-color: var(--selected); }
        .btn-box { display: flex; gap: 12px; }
        .btn-acao, .btn-forms { border: none; padding: 14px; border-radius: 12px; cursor: pointer; font-weight: 800; font-size: 0.75rem; flex: 1; text-transform: uppercase; }
        .btn-acao { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn-forms { background: var(--selected); color: #fff; }
        
        /* NOVO RODAPÉ FULL-BLEED (Preenche o azul vazio) */
        .footer-logo-section {
            width: 100vw; /* Força a pegar a largura total da tela */
            position: relative;
            left: 50%;
            right: 50%;
            margin-left: -50vw; /* Truque CSS para ignorar as margens do body */
            margin-right: -50vw;
            margin-top: 40px;
            margin-bottom: 0;
            line-height: 0; /* Remove os espaços em branco debaixo da imagem */
        }
        .footer-logo-section img {
            width: 100%;
            height: auto;
            display: block;
            border-top: 2px solid var(--glass-border);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8); /* Sombra invertida para cima */
        }
    </style>
</head>
<body>
    <div class="header-simple">
        <h1 class="mrs-titulo">MRS LOGÍSTICA</h1>
        <div id="fase-badge" class="fase-badge">DDS: Segurança no Trajeto</div>
        <div class="progresso-container">
            <span>PALAVRAS ENCONTRADAS:</span>
            <span class="contador-bolinha" id="contador-txt">0 / 5</span>
        </div>
    </div>
    
    <div class="controles">
        <button class="btn-aux" id="btn-reset">Limpar Seleção</button>
        <button class="btn-aux" id="btn-master">Reiniciar Trilha</button>
    </div>
    
    <div class="grid" id="grid-box"></div>
    
    <div id="resultado"></div>

    <div class="analise-section">
        <h3>📡 RÁDIO TRECHO: SUA VOZ NA OPERAÇÃO</h3>
        <p>A segurança é feita por quem vive a via. Deixe uma sugestão, relate uma experiência que sirva de lição ou dê seu feedback sobre o DDS.</p>
        <textarea id="input-comentario" placeholder="Ex: Uma vez a fadiga bateu no trecho Y e percebi que..."></textarea>
        <div class="btn-box">
            <button class="btn-acao" onclick="salvarComentario()">Salvar Local</button>
            <button class="btn-forms" onclick="abrirForms()">Enviar ao Forms</button>
        </div>
        <div id="lista-comentarios" style="margin-top:12px; font-size:0.75rem; font-weight: 600; color: var(--info-text); text-align: center;"></div>
    </div>

    <div class="footer-logo-section">
        <img src="1000121485.png" alt="MRS LOGÍSTICA ÉPICA">
    </div>

    <script>
        const SIZE = 10;
        let selecionadas = [], encontradas = [], gridData = [], faseAtual = 1;
        
        const fasesPalavras = {
            1: [
                {txt: "PRESSA", nome: "PRESSA", nivel: "grave", dica: "A pressa é a maior inimiga da segurança; o tempo ganho correndo nunca compensa o risco do acidente. <br><br><strong>FATO Ferroviário:</strong> Segundo a FRA (EUA), a pressa nas manobras é a causa raiz de 46% das amputações no pátio. <br><br><strong>PEGADINHA Reflexiva:</strong> Vale a pena arriscar um escorregão no lastro para ganhar 2 minutos na troca de turno?"},
                {txt: "CELULAR", nome: "CELULAR", nivel: "grave", dica: "O uso do celular destrói a atenção periférica. Pare de caminhar ou estacione o veículo se precisar olhar a tela. <br><br><strong>FATO Ferroviário:</strong> O desastre de Chatsworth (EUA) forçou a adoção do Freio Automático após um maquinista passar o sinal vermelho enviando SMS. <br><br><strong>PEGADINHA Reflexiva:</strong> Você caminharia de olhos vendados entre dois vagões na pera de manobra?"},
                {txt: "FADIGA", nome: "FADIGA", nivel: "medio", dica: "O cansaço afeta os reflexos; redobre o cuidado no trajeto de volta para casa após o término do turno. <br><br><strong>FATO Ferroviário:</strong> No desastre de Hinton (Canadá), a exaustão causou micro-sonos que ignoraram sinais de parada, tornando obrigatórios os vigilantes (pedal do homem-morto) no mundo. <br><br><strong>PEGADINHA Reflexiva:</strong> Acha que um café forte vence a biologia do micro-sono? Se o corpo apagar, acione o CCO. Fadiga é fisiologia, não falta de vontade."},
                {txt: "ATENCAO", nome: "ATENÇÃO", nivel: "medio", dica: "O cérebro relaxa na rotina do trajeto diário. Force a atenção e redobre o cuidado em dias de chuva. <br><br><strong>FATO Ferroviário:</strong> Ferrovias do Japão reduziram falhas humanas em 85% com o método 'Apontar e Falar' (Shisa Kanko) para combater a 'cegueira da rotina'. <br><br><strong>PEGADINHA Reflexiva:</strong> Desafio de hoje: No próximo sinal ou AMV, aponte fisicamente com a mão e verbalize o aspecto em voz alta na cabine para focar no 'agora'."},
                {txt: "TEMPO", nome: "TEMPO", nivel: "leve", dica: "Programe seu relógio e saia com antecedência. O planejamento elimina a urgência e garante uma viagem calma. <br><br><strong>FATO Ferroviário:</strong> Em Amagasaki (Japão), o medo de uma punição por atraso de apenas 90 segundos fez o maquinista perder o controle emocional e acelerar, causando um descarrilamento letal. <br><br><strong>PEGADINHA Reflexiva:</strong> Você gerencia seu tempo ou o estresse do relógio guia sua tração? A segurança das 10 mil toneladas começa no despertador em casa."}
            ]
        };

        function init() {
            let pronto = false;
            while (!pronto) { gridData = Array(SIZE).fill(null).map(() => Array(SIZE).fill('')); pronto = distribuirPalavras(); }
            preencherLixo(); desenhar(); atualizarUI();
        }

        function distribuirPalavras() {
            const lista = [...fasesPalavras[faseAtual]].sort((a,b) => b.txt.length - a.txt.length);
            for (let p of lista) {
                let colocada = false, tentativas = 0;
                while (!colocada && tentativas < 5000) {
                    let h = Math.random() > 0.5, r = Math.floor(Math.random() * (h ? SIZE : SIZE - p.txt.length)), c = Math.floor(Math.random() * (h ? SIZE - p.txt.length : SIZE));
                    if (podeColocar(p.txt, r, c, h)) {
                        for (let i = 0; i < p.txt.length; i++) gridData[h ? r : r + i][h ? c + i : c] = p.txt[i];
                        colocada = true;
                    }
                    tentativas++;
                }
                if (!colocada) return false;
            }
            return true;
        }

        function podeColocar(p, r, c, h) {
            for (let i = -1; i <= p.length; i++) {
                for (let j = -1; j <= 1; j++) {
                    let currR = h ? r + j : r + i, currC = h ? c + i : c + j;
                    if (currR >= 0 && currR < SIZE && currC >= 0 && currC < SIZE) {
                        if (i >= 0 && i < p.length && j === 0) { if (gridData[currR][currC] !== '' && gridData[currR][currC] !== p[i]) return false; }
                        else if (i >= 0 && i < p.length && gridData[currR][currC] !== '') return false;
                    }
                }
            }
            return true;
        }

        function preencherLixo() { const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"; for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (gridData[r][c] === '') gridData[r][c] = abc[Math.floor(Math.random() * abc.length)]; }

        function desenhar() {
            const container = document.getElementById("grid-box"); container.innerHTML = '';
            gridData.forEach((row, r) => row.forEach((letra, c) => {
                const div = document.createElement("div"); div.className = "cell"; div.innerText = letra;
                div.onclick = () => clicarCelula(div, letra, r, c); container.appendChild(div);
            }));
        }

        function clicarCelula(el, letra, r, c) {
            if ('vibrate' in navigator) { navigator.vibrate(30); }

            if (el.classList.contains('found-grave') || el.classList.contains('found-medio') || el.classList.contains('found-leve')) return;
            if (el.classList.contains('selected')) { if (selecionadas.length > 0 && selecionadas[selecionadas.length - 1].el === el) { el.classList.remove('selected'); selecionadas.pop(); } return; }
            
            if (selecionadas.length > 0) {
                const last = selecionadas[selecionadas.length - 1];
                if (Math.abs(r - last.r) > 1 || Math.abs(c - last.c) > 1 || (Math.abs(r - last.r) === 1 && Math.abs(c - last.c) === 1)) return;
                if (selecionadas.length >= 2) {
                    const first = selecionadas[0], second = selecionadas[1];
                    if (first.r === second.r && r !== last.r) return; if (first.r !== second.r && c !== last.c) return;
                }
            }
            el.classList.add('selected'); selecionadas.push({el, letra, r, c}); verificarJogo();
        }

        function verificarJogo() {
            const palavraFormada = selecionadas.map(s => s.letra).join('');
            const alvo = fasesPalavras[faseAtual].find(p => p.txt === palavraFormada && !encontradas.includes(p.txt));
            if (alvo) {
                if ('vibrate' in navigator) { navigator.vibrate([100, 50, 100]); }

                selecionadas.forEach(s => { s.el.classList.remove('selected'); s.el.classList.add(alvo.nivel === 'grave' ? 'found-grave' : alvo.nivel === 'medio' ? 'found-medio' : 'found-leve'); });
                encontradas.push(alvo.txt); exibirInsight(alvo); selecionadas = []; atualizarUI(); checarFimFase();
            }
        }

        function exibirInsight(p) {
            const res = document.getElementById("resultado");
            const card = document.createElement("div"); card.className = `insight ${p.nivel}`;
            card.innerHTML = `<span class="alerta-titulo">ALERTA OPERACIONAL: ${p.nome}</span>${p.dica}`; 
            res.appendChild(card); 
        }

        function atualizarUI() {
            const total = fasesPalavras[faseAtual].length;
            document.getElementById("contador-txt").innerText = `${encontradas.length} / ${total}`;
        }

        function checarFimFase() { 
            if (encontradas.length === fasesPalavras[faseAtual].length) { 
                setTimeout(() => {
                    alert("🎯 Treinamento Concluído! Você encontrou todas as palavras da MRS. Deixe sua voz no Rádio Trecho abaixo e envie para a coordenação!");
                }, 600);
            } 
        }

        function salvarComentario() {
            const texto = document.getElementById("input-comentario").value;
            if (!texto) return;
            document.getElementById("lista-comentarios").innerHTML = `✔ Rascunho salvo. Clique em "Enviar ao Forms" para finalizar.`;
        }

        function abrirForms() { window.open("https://forms.gle/ut3jDiKRPWSGVXw37", '_blank'); }

        document.getElementById("btn-reset").onclick = function() { document.querySelectorAll(".cell.selected").forEach(el => el.classList.remove("selected")); selecionadas = []; };
        document.getElementById("btn-master").onclick = function() { if(confirm("Reiniciar a trilha?")) { encontradas = []; selecionadas = []; document.getElementById("resultado").innerHTML = ""; init(); } };

        init();
    </script>
</body>
</html>
