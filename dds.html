<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRS - Dashboard Operacional DDS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           SISTEMA DE IDENTIDADE VISUAL E DESIGN OPERACIONAL MRS
           ============================================================
        */
        :root {
            --mrs-blue: #0b3a6f; 
            --accent: #ffffff; 
            --selected: #3b82f6; 
            --danger: #ff2a2a; 
            --warning: #ffcc00; 
            --info: #00ffaa; 
            --neon-blue: #00d2ff;
            --glass-bg: rgba(10, 15, 30, 0.95); 
            --glass-border: rgba(0, 210, 255, 0.3);
        }
        
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: #020617; 
            color: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 15px; 
            box-sizing: border-box; 
            overflow-x: hidden;
        }

        /* --- CABEÇALHO --- */
        .banner-topo { 
            width: 100%; 
            max-width: 1200px; 
            margin-bottom: 25px; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .banner-topo img { width: 100%; display: block; }

        /* --- CONTAINER DO DASHBOARD --- */
        .dashboard-container { 
            display: grid; 
            grid-template-columns: 1fr 1.5fr 1fr; 
            gap: 20px; 
            width: 100%; 
            max-width: 1200px; 
            margin-bottom: 25px; 
        }

        .panel { 
            background: var(--glass-bg); 
            backdrop-filter: blur(25px); 
            border: 1px solid var(--glass-border); 
            border-radius: 18px; 
            padding: 30px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); 
            display: flex; 
            flex-direction: column; 
        }

        /* --- PAINEL DE STATUS --- */
        .status-panel { text-align: center; justify-content: center; }
        .mrs-titulo { 
            margin: 0; 
            font-size: 1.8rem; 
            font-weight: 800; 
            letter-spacing: 1px; 
            text-transform: uppercase; 
            color: var(--accent);
        }
        .status-badge { 
            margin: 20px 0; 
            font-weight: 700; 
            font-size: 1.2rem; 
            color: var(--neon-blue); 
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        /* --- GRID DE INTERAÇÃO OPERACIONAL --- */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 6px; 
            width: 100%; 
            max-width: 350px; 
            margin: 0 auto; 
            padding: 15px; 
            background: rgba(0,0,0,0.4); 
            border-radius: 14px; 
        }
        .cell { 
            aspect-ratio: 1; 
            background: #ffffff; 
            color: #0b1120; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 4px; 
            font-weight: 600; /* Peso balanceado para evitar borrão em telas mobile */
            font-size: 1.4rem; 
            cursor: pointer; 
            transition: transform 0.1s, background 0.2s; 
            user-select: none;
        }
        .cell:active { transform: scale(0.9); }
        .selected { background: var(--selected) !important; color: #fff !important; }
        .found-grave { 
            background: var(--danger) !important; 
            color: #fff !important; 
            box-shadow: 0 0 15px var(--danger); 
            animation: pulseFound 1s ease-in-out;
        }
        @keyframes pulseFound { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* --- TERMINAL DE INTELIGÊNCIA (CONTEÚDO EXPANDIDO) --- */
        .intel-panel { 
            border-left: 6px solid var(--neon-blue); 
            min-height: 550px; 
        }
        .intel-title { 
            font-size: 1.1rem; 
            font-weight: 800; 
            margin-bottom: 20px; 
            color: var(--neon-blue); 
            text-transform: uppercase;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .intel-text-wrapper { font-size: 1.05rem; line-height: 1.6; color: #f1f5f9; }
        
        .intel-box { 
            margin-bottom: 18px; 
            padding: 15px; 
            border-radius: 10px; 
            animation: slideIn 0.4s ease-out forwards;
        }
        .box-context { background: rgba(255,255,255,0.05); border-left: 4px solid var(--info); }
        .box-fatal { background: rgba(255,42,42,0.12); border-left: 4px solid var(--danger); color: #ffa0a0; }
        .box-daily { background: rgba(0,210,255,0.12); border-left: 4px solid var(--neon-blue); }

        @keyframes slideIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }

        /* --- RÁDIO TRECHO (RELATÓRIO FORMS GIGANTE) --- */
        .footer-panel { 
            width: 100%; 
            max-width: 1200px; 
            border-bottom: 6px solid var(--selected); 
            margin-top: 20px; 
            gap: 20px;
        }
        .radio-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 5px;
        }
        .radio-header h3 { margin: 0; font-size: 1.4rem; text-transform: uppercase; color: var(--accent); letter-spacing: 1px; }
        
        .input-mrs { 
            background: rgba(0,0,0,0.7); 
            border: 2px solid var(--glass-border); 
            padding: 30px; 
            border-radius: 15px; 
            color: #fff; 
            width: 100%; 
            box-sizing: border-box; 
            font-family: inherit; 
            font-size: 1.3rem; 
            min-height: 250px; /* Tamanho massivo para foco no feedback */
            resize: none;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .input-mrs:focus { border-color: var(--neon-blue); outline: none; background: rgba(0,0,0,0.9); }

        .btn-main { 
            background: linear-gradient(90deg, #1e40af, #3b82f6); 
            color: #fff; 
            border: none; 
            padding: 25px; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 1.5rem; 
            cursor: pointer; 
            text-transform: uppercase; 
            width: 100%; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transition: 0.3s;
        }
        .btn-main:hover { filter: brightness(1.2); transform: translateY(-3px); }

        /* --- AJUSTES PARA DISPOSITIVOS MÓVEIS --- */
        @media (max-width: 1024px) {
            .dashboard-container { grid-template-columns: 1fr; gap: 15px; }
            .grid { max-width: 320px; }
            .intel-panel { min-height: auto; }
            .panel { padding: 20px; }
            .input-mrs { font-size: 1.1rem; min-height: 200px; }
            .mrs-titulo { font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <div class="banner-topo">
        <img src="1000121485.png" alt="MRS LOGÍSTICA">
    </div>

    <div class="dashboard-container">
        <div class="panel status-panel">
            <h1 class="mrs-titulo">MRS LOGÍSTICA</h1>
            <div class="status-badge">PROGRESSO: <span id="contador-txt">0/5</span></div>
            <button class="btn-main" style="padding:15px; font-size:0.9rem; background:#1e293b;" onclick="location.reload()">REINICIAR TRILHA</button>
        </div>

        <div class="panel">
            <div class="grid" id="grid-box"></div>
        </div>

        <div class="panel intel-panel">
            <div class="intel-title">Terminal de Inteligência Operacional</div>
            <div id="intel-content" class="intel-text-wrapper">
                "Aguardando varredura manual. Localize as 5 palavras-chave críticas (SONO, CELULAR, ATENÇÃO, SINAL, PRESSA) para processar os protocolos de segurança."
            </div>
        </div>
    </div>

    <div class="panel footer-panel">
        <div class="radio-header">
            <h3>📡 Rádio Trecho: Registro de Compromisso</h3>
        </div>
        <textarea class="input-mrs" id="feedback-caixa" placeholder="Relate aqui as percepções da equipe, situações reais vivenciadas no trecho e os compromissos de segurança firmados hoje..."></textarea>
        <button class="btn-main" onclick="transmitir()">TRANSMITIR RELATÓRIO AO FORMS</button>
    </div>

    <script>
        /* ============================================================
           MOTOR LÓGICO E PROCESSAMENTO DE DADOS
           ============================================================
        */
        const SIZE = 10;
        let selecionadas = [], encontradas = [], gridData = [];
        
        // BANCO DE DADOS DE ALTO IMPACTO (FATOS FATAIS)
        const bancoDados = [
            {
                txt: "SONO", nivel: "grave", display: "SONO",
                expl: "O sono na cabine não é uma escolha, é um colapso fisiológico. A fadiga severa reduz a percepção de perigo ao mesmo nível de uma embriaguez profunda.",
                fato: "TRAGÉDIA REAL: Desastre de Hinton (Canadá). O maquinista dormiu por exaustão, cruzou um sinal e colidiu de frente com outro trem. 23 mortos carbonizados e toneladas de aço retorcido.",
                simu: "DIA A DIA: Você percebe 'visão de túnel' ou piscar de olhos lento no fim da madrugada. Ação: Pare o trem em local seguro imediatamente. A ferrovia não perdoa o cansaço."
            },
            {
                txt: "CELULAR", nivel: "grave", display: "CELULAR",
                expl: "Uma única mensagem de texto remove o foco da via por tempo suficiente para percorrer centenas de metros sem qualquer supervisão visual.",
                fato: "TRAGÉDIA REAL: Chatsworth (EUA). 25 mortos e 135 feridos. O maquinista enviou um SMS, ignorou o sinal vermelho e colidiu frontalmente com um trem de carga. O aparelho foi o gatilho da morte.",
                simu: "DIA A DIA: O celular vibra na mochila com uma emergência familiar. Ação: O foco é a via. O aparelho deve estar desligado e inacessível durante toda a condução."
            },
            {
                txt: "ATENCAO", nivel: "grave", display: "ATENÇÃO",
                expl: "O excesso de confiança no trecho familiar anula a vigilância. O cérebro 'vê' o que espera ver (o sinal verde habitual) e ignora a realidade (o sinal vermelho real).",
                fato: "TRAGÉDIA REAL: Santiago de Compostela (Espanha). 79 mortos. O maquinista conhecia o trecho tão bem que relaxou, perdeu a noção de localização e entrou na curva a 179km/h.",
                simu: "DIA A DIA: Cruzar aquela PN que 'nunca tem carro'. Ação: Trate cada metro como se fosse território desconhecido. Use o 'Anotar e Cantar' para cada placa e sinal."
            },
            {
                txt: "SINAL", nivel: "grave", display: "SINAL",
                expl: "Sinalização ferroviária é o contrato de vida entre maquinista e via. Ignorar o aspecto mais restritivo em caso de dúvida é a falha mais fatal do sistema.",
                fato: "TRAGÉDIA REAL: Bad Aibling (Alemanha). 12 mortos. Uma série de interpretações erradas de sinais e comandos manuais forçados resultou em uma colisão violenta em via singela.",
                simu: "DIA A DIA: Você avista um sinal apagado ou com luz fantasma. Ação: Considere PARADA ABSOLUTA. A dúvida no sinal é uma ordem de parada, nunca de prosseguimento."
            },
            {
                txt: "PRESSA", nivel: "grave", display: "PRESSA",
                expl: "A pressa destrói a consciência situacional. O medo de um atraso insignificante faz o condutor ignorar leis físicas e protocolos básicos de frenagem.",
                fato: "TRAGÉDIA REAL: Tragédia de Amagasaki (Japão). 107 mortos. O condutor acelerou em uma curva perigosa para tentar recuperar um atraso de apenas 90 segundos. A pressa matou centenas por um minuto e meio.",
                simu: "DIA A DIA: Pressão para liberar a via para um trem prioritário. Ação: A segurança precede o relógio. Respeite a velocidade regulamentada, independentemente do tempo de atraso."
            }
        ];

        // INICIALIZAÇÃO DO GRID
        function init() {
            let pronto = false;
            while (!pronto) { 
                gridData = Array(SIZE).fill(null).map(() => Array(SIZE).fill('')); 
                pronto = distribuirPalavras(); 
            }
            preencherLixo(); 
            renderizarGrid();
        }

        function distribuirPalavras() {
            const lista = [...bancoDados].sort((a,b) => b.txt.length - a.txt.length);
            for (let p of lista) {
                let colocada = false, tentativas = 0;
                while (!colocada && tentativas < 4000) {
                    let h = Math.random() > 0.5, r = Math.floor(Math.random() * (h ? SIZE : SIZE - p.txt.length)), c = Math.floor(Math.random() * (h ? SIZE - p.txt.length : SIZE));
                    let ok = true;
                    for (let i = 0; i < p.txt.length; i++) if (gridData[h?r:r+i][h?c+i:c] !== '') ok = false;
                    if (ok) { for (let i = 0; i < p.txt.length; i++) gridData[h?r:r+i][h?c+i:c] = p.txt[i]; colocada = true; }
                    tentativas++;
                }
                if (!colocada) return false;
            } return true;
        }

        function preencherLixo() {
            const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) 
                if (gridData[r][c] === '') gridData[r][c] = abc[Math.floor(Math.random() * abc.length)];
        }

        function renderizarGrid() {
            const container = document.getElementById("grid-box"); 
            container.innerHTML = '';
            gridData.forEach((row, r) => row.forEach((letra, c) => {
                const div = document.createElement("div"); 
                div.className = "cell"; 
                div.innerText = letra;
                div.onclick = () => gerenciarClique(div, letra, r, c); 
                container.appendChild(div);
            }));
        }

        // LÓGICA DE INTERAÇÃO (SELEÇÃO RETA E REBOBINAR)
        function gerenciarClique(el, letra, r, c) {
            if (el.classList.contains('found-grave')) return;
            
            // Rebobinar: Desmarca se clicar na última letra selecionada
            if (el.classList.contains('selected')) {
                const index = selecionadas.findIndex(s => s.el === el);
                if (index === selecionadas.length - 1) { 
                    el.classList.remove('selected'); 
                    selecionadas.pop(); 
                }
                return;
            }

            // Trava de direção e linha reta
            if (selecionadas.length > 0) {
                const last = selecionadas[selecionadas.length - 1];
                const dr = Math.abs(r - last.r), dc = Math.abs(c - last.c);
                if ((dr > 1 || dc > 1) || (dr === 1 && dc === 1)) return;
                if (selecionadas.length >= 2) {
                    const first = selecionadas[0], second = selecionadas[1];
                    if (first.r === second.r && r !== last.r) return;
                    if (first.c === second.c && c !== last.c) return;
                }
            }

            el.classList.add('selected'); 
            selecionadas.push({el, letra, r, c}); 
            verificarMatch();
        }

        // VERIFICAÇÃO DE PALAVRA (NORMAL E INVERTIDA)
        function verificarMatch() {
            const formada = selecionadas.map(s => s.letra).join('');
            const invertida = [...formada].reverse().join('');
            
            const alvo = bancoDados.find(p => (p.txt === formada || p.txt === invertida) && !encontradas.includes(p.txt));
            
            if (alvo) {
                selecionadas.forEach(s => { 
                    s.el.classList.remove('selected'); 
                    s.el.classList.add('found-grave'); 
                });
                encontradas.push(alvo.txt); 
                selecionadas = [];
                document.getElementById("contador-txt").innerText = `${encontradas.length}/5`;
                apresentarRelatorio(alvo);
            }
        }

        // APRESENTAÇÃO DOS DADOS NO TERMINAL
        function apresentarRelatorio(alvo) {
            const painel = document.getElementById("intel-content");
            painel.innerHTML = `
                <div style="color:var(--danger); font-weight:800; margin-bottom:18px; font-size:1.15rem; border-bottom: 2px solid var(--danger); padding-bottom:8px;">
                   [ ! ] ALERTA DETECTADO: ${alvo.display}
                </div>
                <div class="intel-box box-context">${alvo.expl}</div>
                <div class="intel-box box-fatal"><b>OCORRÊNCIA NO MUNDO:</b><br>${alvo.fato}</div>
                <div class="intel-box box-daily"><b>SIMULAÇÃO NO DIA A DIA:</b><br>${alvo.simu}</div>
            `;
        }

        function transmitir() {
            if(!document.getElementById("feedback-caixa").value) { 
                alert("Atenção: É obrigatório registrar o compromisso do DDS no Rádio Trecho antes da transmissão."); 
                return; 
            }
            window.open('https://forms.gle/ut3jDiKRPWSGVXw37');
        }

        init();
    </script>
</body>
</html>
