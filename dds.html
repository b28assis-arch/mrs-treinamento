<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRS - Dashboard de Boas Práticas Operacionais</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* SISTEMA DE DESIGN OPERACIONAL MRS - VERSÃO PROFISSIONAL 4.2
           Desenvolvido para: Segurança Ferroviária Integrada.
           Foco: Mitigação de erro humano através de conceitos Neurocomportamentais.
        */
        :root {
            --mrs-blue: #0b3a6f; 
            --accent: #ffffff; 
            --selected: #3b82f6; 
            --danger: #ff2a2a; 
            --warning: #ffcc00; 
            --info: #00ffaa; 
            --neon-blue: #00d2ff;
            --glass-bg: rgba(10, 15, 30, 0.98); 
            --glass-border: rgba(0, 210, 255, 0.3);
            --font-main: 'Inter', sans-serif;
        }
        
        body { 
            margin: 0; 
            font-family: var(--font-main); 
            background: #020617; 
            color: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 15px; 
            box-sizing: border-box; 
            overflow-x: hidden;
        }

        /* --- ESTILIZAÇÃO DO CABEÇALHO --- */
        .banner-topo { 
            width: 100%; 
            max-width: 1200px; 
            margin-bottom: 25px; 
            border-radius: 12px; 
            overflow: hidden; 
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .banner-topo img { width: 100%; display: block; }

        /* --- ARQUITETURA DO DASHBOARD --- */
        .dashboard-container { 
            display: grid; 
            grid-template-columns: 1fr 1.5fr 1fr; 
            gap: 20px; 
            width: 100%; 
            max-width: 1200px; 
            margin-bottom: 25px; 
        }

        .panel { 
            background: var(--glass-bg); 
            backdrop-filter: blur(30px); 
            border: 1px solid var(--glass-border); 
            border-radius: 20px; 
            padding: 25px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.8); 
            display: flex; 
            flex-direction: column; 
        }

        /* --- STATUS E CONTADORES --- */
        .status-panel { text-align: center; justify-content: center; }
        .mrs-titulo { 
            margin: 0; 
            font-size: 1.8rem; 
            font-weight: 800; 
            text-transform: uppercase; 
            color: var(--accent); 
            letter-spacing: 2px;
        }
        .status-badge { 
            margin: 15px 0; 
            font-weight: 700; 
            color: var(--neon-blue); 
            font-size: 1.1rem;
            text-transform: uppercase;
        }
        .contador-display {
            background: #000; 
            padding: 12px 20px; 
            border-radius: 10px; 
            color: var(--neon-blue); 
            border: 1px solid var(--neon-blue); 
            font-family: monospace; 
            font-size: 2.2rem;
            text-shadow: 0 0 15px var(--neon-blue); 
            margin-bottom: 20px;
        }

        /* --- INTERFACE DO CAÇA-PALAVRAS --- */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 8px; 
            width: 100%; 
            max-width: 360px; 
            margin: 0 auto; 
            padding: 15px; 
            background: rgba(0,0,0,0.4); 
            border-radius: 16px; 
        }
        .cell { 
            aspect-ratio: 1; 
            background: #ffffff; 
            color: #0b1120; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 6px; 
            font-weight: 600; 
            font-size: 1.4rem; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            user-select: none;
        }
        .cell:hover { filter: brightness(1.1); transform: scale(1.05); }
        .selected { background: var(--selected) !important; color: #fff !important; }
        .found-word { background: var(--danger) !important; color: #fff !important; box-shadow: 0 0 15px var(--danger); }

        /* --- TERMINAL DE INTELIGÊNCIA OPERACIONAL --- */
        .intel-panel { border-left: 8px solid var(--neon-blue); min-height: 750px; }
        .intel-title { 
            font-size: 1.3rem; 
            font-weight: 800; 
            color: var(--neon-blue); 
            text-transform: uppercase; 
            border-bottom: 2px solid rgba(255,255,255,0.1); 
            padding-bottom: 12px; 
            margin-bottom: 20px; 
        }
        
        .intel-box { 
            margin-bottom: 22px; 
            padding: 22px; 
            border-radius: 15px; 
            font-size: 1.05rem; 
            line-height: 1.6; 
            animation: slideIn 0.5s ease-out forwards; 
        }
        .box-neuro { background: rgba(255,255,255,0.05); border-left: 6px solid var(--info); color: #e2e8f0; }
        .box-fatal { background: rgba(255,42,42,0.15); border-left: 6px solid var(--danger); color: #ffa0a0; }
        .box-pratica { background: rgba(0,210,255,0.15); border-left: 6px solid var(--neon-blue); color: #e2e8f0; }
        
        .label-box {
            display: block;
            font-weight: 800;
            font-size: 0.85rem;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.6);
            letter-spacing: 1px;
        }

        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        /* --- RODAPÉ OPERACIONAL (REDUZIDO) --- */
        .footer-panel { width: 100%; max-width: 1200px; border-bottom: 6px solid var(--selected); margin-top: 20px; }
        .input-mrs { 
            background: rgba(0,0,0,0.7); 
            border: 2px solid var(--glass-border); 
            padding: 15px; 
            border-radius: 12px; 
            color: #fff; 
            width: 100%; 
            box-sizing: border-box; 
            font-family: inherit; 
            font-size: 1.2rem; 
            min-height: 130px; 
            resize: none; 
            margin-bottom: 15px;
        }
        .input-mrs:focus { border-color: var(--neon-blue); outline: none; }

        .btn-main { 
            background: linear-gradient(90deg, #1e40af, #3b82f6); 
            color: #fff; 
            border: none; 
            padding: 25px; 
            border-radius: 12px; 
            font-weight: 800; 
            font-size: 1.5rem; 
            cursor: pointer; 
            text-transform: uppercase; 
            width: 100%; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .btn-main:active { transform: translateY(2px); }

        @media (max-width: 1024px) { 
            .dashboard-container { grid-template-columns: 1fr; } 
            .grid { max-width: 330px; }
            .intel-panel { min-height: auto; } 
            .panel { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="banner-topo"><img src="1000121485.png" alt="MRS LOGÍSTICA"></div>

    <div class="dashboard-container">
        <div class="panel status-panel">
            <h1 class="mrs-titulo">Boas Práticas!</h1>
            <div class="status-badge">Segurança Operacional</div>
            <div class="contador-display" id="contador-txt">0/5</div>
            <button class="btn-main" style="padding:12px; font-size:0.8rem; background:#1e293b;" onclick="location.reload()">REINICIAR SISTEMA</button>
        </div>

        <div class="panel">
            <div class="grid" id="grid-box"></div>
        </div>

        <div class="panel intel-panel">
            <div class="intel-title">Relatório de Inteligência</div>
            <div id="intel-content">
                <div style="font-style: italic; color: #94a3b8; text-align: center; margin-top: 50px;">
                    "Terminal em prontidão operacional. Identifique os 5 fatores críticos de risco no grid para processar as análises e boas práticas correspondentes."
                </div>
            </div>
        </div>
    </div>

    <div class="panel footer-panel">
        <div style="margin-bottom: 12px; text-align: center;">
            <h3 style="margin:0; text-transform: uppercase; font-size:1.1rem; letter-spacing: 1px;">📡 Rádio Operacional: Relatório de DDS</h3>
        </div>
        <textarea class="input-mrs" id="feedback-caixa" placeholder="Registre aqui a síntese do compromisso da equipe com as boas práticas discutidas..."></textarea>
        <button class="btn-main" onclick="transmitir()">TRANSMITIR RELATÓRIO</button>
    </div>

    <script>
        /* MOTOR LÓGICO MRS - SEGURANÇA E NEUROCIÊNCIA
           Responsável pelo processamento de palavras e carga de protocolos técnicos.
        */
        const SIZE = 10;
        let selecionadas = [], encontradas = [], gridData = [];
        
        // BANCO DE DADOS DE SEGURANÇA INTEGRAL
        const bancoDados = [
            {
                txt: "SONO", display: "BOAS PRÁTICAS: GESTÃO DA FADIGA",
                neuro: "A adenosina acumulada gera o 'Microsleep' (microsso). O cérebro entra em modo de repouso por 1 a 3 segundos. O colaborador permanece de olhos abertos, mas o córtex pré-frontal para de processar qualquer sinal de perigo ou movimento na via.",
                fatal: "OCORRÊNCIA MUNDIAL: Hinton (Canadá, 1986). A tripulação em estado de exaustão extrema não registrou o sinal de parada absoluta. Resultado: Colisão frontal violenta entre dois trens, 23 fatalidades e destruição total da carga e locomotivas.",
                pratica: "Monitore sinais como fixação ocular e bocejos cíclicos. Se sentir a pálpebra pesada, a única barreira de segurança é interromper a tarefa imediatamente e reportar. Não tente 'vencer' o sono; ele é uma falha mecânica humana."
            },
            {
                txt: "CELULAR", display: "BOAS PRÁTICAS: FOCO ABSOLUTO",
                neuro: "O processamento de mensagens causa o 'Attentional Blink'. O cérebro sequestra toda a rede de saliência para o mundo digital, tornando o condutor neurologicamente cego ao que está à sua frente na via física.",
                fatal: "OCORRÊNCIA MUNDIAL: Chatsworth (EUA, 2008). 25 mortos e 135 feridos. O maquinista estava enviando SMS minutos antes de ignorar o sinal vermelho e colidir com um trem de carga. O dispositivo eletrônico foi o gatilho da tragédia.",
                pratica: "O cérebro não executa multitarefa real na condução ou manobra; ele alterna focos. Mantenha o dispositivo desligado e fora do alcance visual. O foco deve ser 100% na operação e na sinalização."
            },
            {
                txt: "ATENCAO", display: "BOAS PRÁTICAS: VIGILÂNCIA ATIVA",
                neuro: "Em ambientes conhecidos, o cérebro entra em 'Modo Econômico' (Habituação). Ele para de processar dados reais e projeta memórias de 'via livre' sobre obstáculos novos, anulando a capacidade de detectar anomalias.",
                fatal: "OCORRÊNCIA MUNDIAL: Santiago de Compostela (Espanha, 2013). 79 fatalidades. Por excesso de familiaridade com o trecho, o condutor relaxou a vigilância, perdeu a noção espacial exata e entrou em curva a 179km/h.",
                pratica: "Quebre o ciclo automático do cérebro. Utilize o protocolo 'Anotar e Cantar' (Shisa Kanko) para cada sinalização ou marco. Ouvir a própria voz força o sistema nervoso a validar a realidade externa sobre a expectativa interna."
            },
            {
                txt: "SINAL", display: "BOAS PRÁTICAS: DISCIPLINA OPERACIONAL",
                neuro: "O 'Viés de Expectativa' faz o cérebro projetar o verde habitual por antecipação. O sistema visual pode literalmente 'apagar' uma luz vermelha ou um aspecto inoperante para confirmar o que o condutor espera ver.",
                fatal: "OCORRÊNCIA MUNDIAL: Bad Aibling (Alemanha, 2016). 12 mortos. O descumprimento de protocolos de segurança baseado em pressuposições manuais erradas resultou em colisão frontal em via singela entre dois trens de passageiros.",
                pratica: "Nunca presuma o aspecto de um sinal ou a posição de uma agulha/AMV. Em caso de sinal apagado ou dúvida interpretativa, a regra ferroviária é absoluta: O aspecto deve ser considerado PARADA."
            },
            {
                txt: "PRESSA", display: "BOAS PRÁTICAS: CONSCIÊNCIA TEMPORAL",
                neuro: "A urgência dispara o 'Sequestro da Amígdala'. O sistema límbico assume o comando neural, priorizando a meta (horário) e desligando o raciocínio crítico, a percepção lateral e a avaliação de riscos colaterais.",
                fatal: "OCORRÊNCIA MUNDIAL: Amagasaki (Japão, 2005). 107 mortos. O condutor acelerou excessivamente em uma curva perigosa para tentar recuperar um atraso de apenas 90 segundos. A pressa química bloqueou o senso de perigo físico.",
                pratica: "Monitore sua fisiologia (respiração curta e visão de túnel). Se a pressão por tempo surgir, respire fundo para modular o sistema parassimpático e recuperar o julgamento. A segurança sempre precede o relógio."
            }
        ];

        // INICIALIZAÇÃO E GERAÇÃO DO GRID
        function init() {
            let pronto = false;
            while (!pronto) { 
                gridData = Array(SIZE).fill(null).map(() => Array(SIZE).fill('')); 
                pronto = distribuirPalavras(); 
            }
            preencherLixo(); 
            renderizarGrid();
        }

        function distribuirPalavras() {
            const lista = [...bancoDados].sort((a,b) => b.txt.length - a.txt.length);
            for (let p of lista) {
                let colocada = false, tentativas = 0;
                while (!colocada && tentativas < 6000) {
                    let h = Math.random() > 0.5, r = Math.floor(Math.random() * (h ? SIZE : SIZE - p.txt.length)), c = Math.floor(Math.random() * (h ? SIZE - p.txt.length : SIZE));
                    let ok = true;
                    for (let i = 0; i < p.txt.length; i++) if (gridData[h?r:r+i][h?c+i:c] !== '') ok = false;
                    if (ok) { for (let i = 0; i < p.txt.length; i++) gridData[h?r:r+i][h?c+i:c] = p.txt[i]; colocada = true; }
                    tentativas++;
                }
                if (!colocada) return false;
            } return true;
        }

        function preencherLixo() {
            const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) 
                if (gridData[r][c] === '') gridData[r][c] = abc[Math.floor(Math.random() * abc.length)];
        }

        function renderizarGrid() {
            const container = document.getElementById("grid-box"); container.innerHTML = '';
            gridData.forEach((row, r) => row.forEach((letra, c) => {
                const div = document.createElement("div"); div.className = "cell"; div.innerText = letra;
                div.onclick = () => gerenciarClique(div, letra, r, c); 
                container.appendChild(div);
            }));
        }

        // LÓGICA DE INTERAÇÃO (SUPORTE PARA PALAVRAS INVERTIDAS E REBOBINAR)
        function gerenciarClique(el, letra, r, c) {
            if (el.classList.contains('found-word')) return;
            if (el.classList.contains('selected')) {
                const index = selecionadas.findIndex(s => s.el === el);
                if (index === selecionadas.length - 1) { el.classList.remove('selected'); selecionadas.pop(); }
                return;
            }
            if (selecionadas.length > 0) {
                const last = selecionadas[selecionadas.length - 1];
                if (Math.abs(r - last.r) > 1 || Math.abs(c - last.c) > 1 || (r !== last.r && c !== last.c)) return;
                if (selecionadas.length >= 2) {
                    const first = selecionadas[0], second = selecionadas[1];
                    if (first.r === second.r && r !== last.r) return;
                    if (first.c === second.c && c !== last.c) return;
                }
            }
            el.classList.add('selected'); selecionadas.push({el, letra, r, c}); verificarMatch();
        }

        function verificarMatch() {
            const formada = selecionadas.map(s => s.letra).join('');
            const invertida = [...formada].reverse().join('');
            const alvo = bancoDados.find(p => (p.txt === formada || p.txt === invertida) && !encontradas.includes(p.txt));
            if (alvo) {
                selecionadas.forEach(s => { s.el.classList.remove('selected'); s.el.classList.add('found-word'); });
                encontradas.push(alvo.txt); selecionadas = [];
                document.getElementById("contador-txt").innerText = `${encontradas.length}/5`;
                apresentarAnalise(alvo);
            }
        }

        // APRESENTAÇÃO DOS DADOS NO TERMINAL DE INTELIGÊNCIA
        function apresentarAnalise(alvo) {
            const painel = document.getElementById("intel-content");
            painel.innerHTML = `
                <div style="color:var(--danger); font-weight:800; margin-bottom:15px; font-size:1.15rem; border-bottom: 2px solid var(--danger); padding-bottom:10px; text-shadow: 0 0 10px rgba(255,42,42,0.3);">
                   [ ! ] DETECTADO: ${alvo.display}
                </div>
                <div class="intel-box box-neuro"><span class="label-box">ANÁLISE NEURAL (POR QUE ACONTECE?)</span>${alvo.neuro}</div>
                <div class="intel-box box-fatal"><span class="label-box">IMPACTO MUNDIAL (HISTÓRICO)</span>${alvo.fatal}</div>
                <div class="intel-box box-pratica"><span class="label-box">BOAS PRÁTICAS (AÇÃO IMEDIATA)</span>${alvo.pratica}</div>
            `;
        }

        function transmitir() {
            const feedback = document.getElementById("feedback-caixa").value;
            if(!feedback) { alert("Atenção: Registre o relatório das Boas Práticas antes de transmitir."); return; }
            window.open('https://forms.gle/ut3jDiKRPWSGVXw37');
        }

        init();
    </script>
</body>
</html>
