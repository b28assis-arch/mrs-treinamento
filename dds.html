<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRS - Dashboard Operacional</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           SISTEMA DE CORES E VARIÁVEIS DE DESIGN 
           ============================================================
        */
        :root {
            --mrs-blue: #0b3a6f; 
            --accent: #ffffff; 
            --selected: #3b82f6; 
            --danger: #ff2a2a; 
            --warning: #ffcc00; 
            --info: #00ffaa; 
            --neon-blue: #00d2ff;
            --glass-bg: rgba(10, 15, 30, 0.95); 
            --glass-border: rgba(0, 210, 255, 0.3);
        }
        
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: #020617 url('fundo-mrs.png') no-repeat center center fixed; 
            background-size: cover; 
            color: #f8fafc; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 15px; 
            box-sizing: border-box; 
            overflow-x: hidden;
        }

        /* --- BANNER SUPERIOR --- */
        .banner-topo { 
            width: 100%; 
            max-width: 1200px; 
            margin-bottom: 20px; 
            border-radius: 16px; 
            overflow: hidden; 
            border: 1px solid var(--glass-border); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
        }
        .banner-topo img { width: 100%; display: block; }

        /* --- CONTAINER PRINCIPAL --- */
        .dashboard-container { 
            display: grid; 
            grid-template-columns: 1fr 1.5fr 1fr; 
            gap: 20px; 
            width: 100%; 
            max-width: 1200px; 
            margin-bottom: 20px; 
        }

        .panel { 
            background: var(--glass-bg); 
            backdrop-filter: blur(25px); 
            border: 1px solid var(--glass-border); 
            border-radius: 20px; 
            padding: 25px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.7); 
            display: flex; 
            flex-direction: column; 
        }

        /* --- PAINEL DE STATUS --- */
        .status-panel { text-align: center; justify-content: center; }
        .mrs-titulo { margin: 0; font-size: 1.8rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
        .contador-container { margin: 20px 0; font-size: 1rem; font-weight: 700; }
        .contador { 
            background: #000; 
            padding: 5px 15px; 
            border-radius: 8px; 
            color: var(--neon-blue); 
            border: 1px solid var(--neon-blue); 
            text-shadow: 0 0 10px var(--neon-blue); 
            font-family: monospace; 
        }

        /* --- CONFIGURAÇÃO DO CAÇA-PALAVRAS (GRID) --- */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(10, 1fr); 
            gap: 5px; 
            width: 100%; 
            max-width: 350px; 
            margin: 0 auto; 
            padding: 12px; 
            background: rgba(0,0,0,0.5); 
            border-radius: 15px; 
        }
        .cell { 
            aspect-ratio: 1; 
            background: #ffffff; 
            color: #0b1120; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-radius: 5px; 
            font-weight: 700; /* Reduzido de 900 para 700 para evitar o borrão */
            font-size: 1.4rem; 
            cursor: pointer; 
            transition: 0.2s; 
            user-select: none; 
        }
        .selected { background: var(--selected) !important; color: #fff !important; box-shadow: 0 0 15px var(--selected); }
        .found-grave { background: var(--danger) !important; color: #fff !important; box-shadow: 0 0 10px var(--danger); }
        .found-medio { background: var(--warning) !important; color: #000 !important; box-shadow: 0 0 10px var(--warning); }
        .found-leve { background: var(--info) !important; color: #000 !important; box-shadow: 0 0 10px var(--info); }

        /* --- PAINEL DE INTELIGÊNCIA OPERACIONAL (CAIXA AUMENTADA) --- */
        .intel-panel { 
            border-left: 5px solid var(--neon-blue); 
            min-height: 350px; /* Aumentado para comportar os textos e o "Fato" */
        }
        .intel-title { 
            font-size: 1.2rem; 
            font-weight: 800; 
            margin-bottom: 15px; 
            text-transform: uppercase; 
            color: var(--neon-blue); 
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }
        .intel-text { font-size: 1.1rem; line-height: 1.6; color: #f1f5f9; }
        .fato-box { 
            margin-top: 20px; 
            padding: 15px; 
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            font-style: italic; 
            color: #cbd5e1; 
            font-size: 1rem; 
            border-left: 3px solid var(--warning);
        }

        /* --- RODAPÉ E CAIXA DE FEEDBACK (FORMS/TEAMS) --- */
        .footer-panel { 
            width: 100%; 
            max-width: 1200px; 
            border-bottom: 5px solid var(--selected); 
            gap: 15px; 
            margin-top: 20px; 
        }
        .input-mrs { 
            background: rgba(0,0,0,0.7); 
            border: 2px solid var(--glass-border); 
            padding: 20px; /* Aumentado para melhor toque no celular */
            border-radius: 12px; 
            color: #fff; 
            width: 100%; 
            box-sizing: border-box; 
            margin-bottom: 15px; 
            font-family: inherit; 
            font-size: 1.1rem; 
            transition: 0.3s;
        }
        .input-mrs:focus { border-color: var(--neon-blue); outline: none; background: rgba(0,0,0,0.9); }
        
        .btn-main { 
            background: linear-gradient(90deg, #2563eb, #3b82f6); 
            color: #fff; 
            border: none; 
            padding: 22px; 
            border-radius: 12px; 
            font-weight: 900; 
            font-size: 1.2rem; 
            cursor: pointer; 
            text-transform: uppercase; 
            width: 100%; 
            box-shadow: 0 5px 25px rgba(59, 130, 246, 0.6); 
            transition: 0.3s; 
        }
        .btn-main:hover { filter: brightness(1.2); transform: translateY(-2px); }

        /* --- RESPONSIVIDADE PARA CELULAR --- */
        @media (max-width: 1024px) {
            .dashboard-container { grid-template-columns: 1fr; gap: 15px; }
            .grid { max-width: 320px; }
            .cell { font-size: 1.2rem; }
            .panel { padding: 20px; }
            .input-mrs { font-size: 1rem; padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="banner-topo"><img src="1000121485.png" alt="MRS LOGÍSTICA"></div>

    <div class="dashboard-container">
        <div class="panel status-panel">
            <h1 class="mrs-titulo">MRS LOGÍSTICA</h1>
            <div class="contador-container">PROGRESSO DA VARREDURA: <span class="contador" id="contador-txt">0/5</span></div>
            <button class="btn-main" style="padding: 12px; font-size: 0.8rem; background: #1e293b;" onclick="location.reload()">REINICIAR SISTEMA</button>
        </div>

        <div class="panel">
            <div class="grid" id="grid-box"></div>
        </div>

        <div class="panel intel-panel">
            <div id="intel-content" class="intel-text">
                <div class="intel-title">INTELIGÊNCIA OPERACIONAL</div>
                "Terminal aguardando análise. Identifique os comportamentos de risco no grid central para processar os dados de segurança."
            </div>
        </div>
    </div>

    <div class="panel footer-panel">
        <input type="text" class="input-mrs" id="feedback-caixa" placeholder="Digite aqui sua percepção de risco, pegadinha ou sugestão para o trecho...">
        <button class="btn-main" onclick="transmitirRelatorio()">TRANSMITIR RELATÓRIO AO FORMS</button>
    </div>

    <script>
        /* ============================================================
           LÓGICA DO MOTOR DE BUSCA E VOZ
           ============================================================
        */
        const SIZE = 10;
        let selecionadas = [], encontradas = [], gridData = [];
        
        const bancoDados = [
            {txt: "PRESSA", nivel: "grave", dica: "A pressa é a principal causa de incidentes em manobras.", fato: "FATO REAL: 46% das amputações ferroviárias registradas em pátios no Brasil ocorrem devido à pressa durante o engate de vagões."},
            {txt: "CELULAR", nivel: "grave", dica: "O uso do celular durante a jornada anula sua percepção de risco.", fato: "PEGADINHA: O desastre ferroviário de Chatsworth ocorreu porque o maquinista estava enviando SMS e ignorou um sinal vermelho de parada."},
            {txt: "FADIGA", nivel: "medio", dica: "O cansaço físico e mental reduz reflexos de forma crítica.", fato: "FATO TÉCNICO: Micro-sonos de apenas 2 segundos a 40km/h são suficientes para que um trem percorra 22 metros sem comando."},
            {txt: "ATENCAO", nivel: "medio", dica: "A rotina gera excesso de confiança e cegueira operacional.", fato: "PEGADINHA: Estatísticas provam que a maioria dos acidentes ocorre em trechos conhecidos, onde o colaborador 'baixa a guarda'."},
            {txt: "TEMPO", nivel: "leve", dica: "O planejamento do tempo de jornada é uma ferramenta de segurança.", fato: "FATO: Maquinistas que iniciam a jornada com planejamento de tempo reduzem em 70% o estresse cognitivo em manobras complexas."}
        ];

        function init() {
            let pronto = false;
            while (!pronto) { 
                gridData = Array(SIZE).fill(null).map(() => Array(SIZE).fill('')); 
                pronto = distribuirPalavras(); 
            }
            preencherLixo(); 
            renderizarGrid();
        }

        function distribuirPalavras() {
            const lista = [...bancoDados].sort((a,b) => b.txt.length - a.txt.length);
            for (let p of lista) {
                let colocada = false, tentativas = 0;
                while (!colocada && tentativas < 3000) {
                    let h = Math.random() > 0.5;
                    let r = Math.floor(Math.random() * (h ? SIZE : SIZE - p.txt.length));
                    let c = Math.floor(Math.random() * (h ? SIZE - p.txt.length : SIZE));
                    let ok = true;
                    for (let i = 0; i < p.txt.length; i++) {
                        if (gridData[h ? r : r + i][h ? c + i : c] !== '') { ok = false; break; }
                    }
                    if (ok) {
                        for (let i = 0; i < p.txt.length; i++) gridData[h ? r : r + i][h ? c + i : c] = p.txt[i];
                        colocada = true;
                    }
                    tentativas++;
                }
                if (!colocada) return false;
            } return true;
        }

        function preencherLixo() {
            const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < SIZE; r++) 
                for (let c = 0; c < SIZE; c++) 
                    if (gridData[r][c] === '') gridData[r][c] = abc[Math.floor(Math.random() * abc.length)];
        }

        function renderizarGrid() {
            const container = document.getElementById("grid-box"); container.innerHTML = '';
            gridData.forEach((row, r) => row.forEach((letra, c) => {
                const div = document.createElement("div"); 
                div.className = "cell"; 
                div.innerText = letra;
                div.onclick = () => gerenciarClique(div, letra, r, c); 
                container.appendChild(div);
            }));
        }

        function gerenciarClique(el, letra, r, c) {
            if (el.classList.contains('found-grave') || el.classList.contains('found-medio') || el.classList.contains('found-leve')) return;
            
            // Rebobinar seleção se clicar na última letra
            if (el.classList.contains('selected')) {
                const index = selecionadas.findIndex(s => s.el === el);
                if (index === selecionadas.length - 1) { el.classList.remove('selected'); selecionadas.pop(); }
                return;
            }

            // Validação de adjacência e linha reta
            if (selecionadas.length > 0) {
                const last = selecionadas[selecionadas.length - 1];
                const dr = Math.abs(r - last.r), dc = Math.abs(c - last.c);
                if ((dr > 1 || dc > 1) || (dr === 1 && dc === 1)) return;
                if (selecionadas.length >= 2) {
                    const first = selecionadas[0], second = selecionadas[1];
                    if (first.r === second.r && r !== last.r) return;
                    if (first.c === second.c && c !== last.c) return;
                }
            }

            el.classList.add('selected'); 
            selecionadas.push({el, letra, r, c}); 
            verificarMatch();
        }

        function verificarMatch() {
            const formada = selecionadas.map(s => s.letra).join('');
            const invertida = [...formada].reverse().join('');
            const alvo = bancoDados.find(p => (p.txt === formada || p.txt === invertida) && !encontradas.includes(p.txt));
            
            if (alvo) {
                const corClas = `found-${alvo.nivel}`;
                selecionadas.forEach(s => { s.el.classList.remove('selected'); s.el.classList.add(corClas); });
                encontradas.push(alvo.txt); 
                selecionadas = [];
                document.getElementById("contador-txt").innerText = `${encontradas.length}/5`;
                processarAudioVisual(alvo);
            }
        }

        function processarAudioVisual(alvo) {
            const painel = document.getElementById("intel-content");
            const corHex = alvo.nivel === 'grave' ? '#ff2a2a' : alvo.nivel === 'medio' ? '#ffcc00' : '#00ffaa';
            
            painel.innerHTML = `
                <div class="intel-title" style="color:${corHex}">[!] ALERTA: ${alvo.txt}</div>
                <div id="typing" style="margin-bottom:15px"></div>
                <div class="fato-box" id="fato"></div>
            `;
            
            let i = 0;
            function digitar() {
                if (i < alvo.dica.length) {
                    document.getElementById("typing").innerHTML += alvo.dica.charAt(i);
                    i++; setTimeout(digitar, 15);
                } else {
                    document.getElementById("fato").innerHTML = alvo.fato;
                }
            }

            // VOZ MASCULINA RÁPIDA
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const voz = new SpeechSynthesisUtterance(alvo.dica + ". " + alvo.fato);
                voz.lang = 'pt-BR'; voz.pitch = 0.5; voz.rate = 1.2;
                window.speechSynthesis.speak(voz);
            }
            digitar();
        }

        function transmitirRelatorio() {
            const feedback = document.getElementById("feedback-caixa").value;
            if(!feedback) { alert("Atenção: Registre sua percepção de segurança antes de transmitir."); return; }
            window.open('https://forms.gle/ut3jDiKRPWSGVXw37');
        }

        init();
    </script>
</body>
</html>
