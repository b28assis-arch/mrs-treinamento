<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRS - Dashboard Trem Bão</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mrs-blue: #0b3a6f; 
            --accent: #ffffff;
            --selected: #3b82f6; 
            --danger: #ff2a2a;   
            --warning: #ffcc00;  
            --info: #00ffaa;     
            --neon-blue: #00d2ff;
            --glass-bg: rgba(10, 15, 30, 0.9); 
            --glass-border: rgba(0, 210, 255, 0.3);
        }
        
        body { 
            margin: 0; font-family: 'Inter', sans-serif; 
            background: #020617 url('fundo-mrs.png') no-repeat center center fixed; 
            background-size: cover; color: #f8fafc; min-height: 100vh; 
            display: flex; flex-direction: column; align-items: center; 
            padding: 15px; box-sizing: border-box; overflow-x: hidden;
        }

        /* --- LAYOUT STRUCTURE --- */
        .banner-topo { 
            width: 100%; max-width: 1200px; margin-bottom: 15px; 
            border-radius: 12px; overflow: hidden; border: 1px solid var(--glass-border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .banner-topo img { width: 100%; display: block; }

        .dashboard-container { 
            display: grid; grid-template-columns: 1fr 1.5fr 1fr; 
            gap: 15px; width: 100%; max-width: 1200px; margin-bottom: 15px; 
        }

        .panel { 
            background: var(--glass-bg); backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); border-radius: 20px; 
            padding: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.7); 
            display: flex; flex-direction: column; position: relative;
        }

        /* --- STATUS PANEL --- */
        .status-panel { text-align: center; justify-content: center; }
        .mrs-titulo { margin: 0; font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .fase-badge { 
            background: linear-gradient(90deg, #1e3a8a, #3b82f6); padding: 6px 12px; 
            border-radius: 6px; font-weight: 900; font-size: 0.75rem; margin: 10px 0; 
            display: inline-block; border: 1px solid var(--neon-blue);
        }
        .contador-container { margin-bottom: 15px; font-size: 0.9rem; font-weight: 800; }
        .contador { 
            background: #000; padding: 4px 12px; border-radius: 6px; 
            color: var(--neon-blue); border: 1px solid var(--neon-blue);
            text-shadow: 0 0 8px var(--neon-blue); font-family: monospace;
        }

        /* --- GRID DESIGN --- */
        .grid { 
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; 
            width: 100%; max-width: 320px; margin: 0 auto; padding: 10px; 
            background: rgba(0,0,0,0.4); border-radius: 12px; border: 1px solid rgba(255,255,255,0.1);
        }
        .cell { 
            aspect-ratio: 1; background: #ffffff; color: #0b1120; 
            display: flex; align-items: center; justify-content: center; 
            border-radius: 4px; font-weight: 900; font-size: 1.3rem; 
            cursor: pointer; transition: 0.2s; user-select: none;
        }
        .selected { background: var(--selected) !important; color: #fff !important; box-shadow: 0 0 15px var(--selected); }
        .found-grave { background: var(--danger) !important; color: #fff !important; box-shadow: 0 0 10px var(--danger); }
        .found-medio { background: var(--warning) !important; color: #000 !important; box-shadow: 0 0 10px var(--warning); }
        .found-leve { background: var(--info) !important; color: #000 !important; box-shadow: 0 0 10px var(--info); }

        /* --- TREM BÃO (MASCOTE) --- */
        .mascote-wrapper { 
            position: relative; width: 140px; height: 140px; margin: 0 auto 15px; 
            display: flex; align-items: center; justify-content: center;
        }
        .trem-bao { 
            width: 130px; height: 130px; object-fit: cover; border-radius: 50%;
            border: 3px solid var(--neon-blue); animation: flutuar 3s ease-in-out infinite; 
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.5); z-index: 2;
        }
        .hologram-base { 
            position: absolute; bottom: -5px; width: 80px; height: 12px; 
            background: rgba(0, 210, 255, 0.3); border-radius: 50%; 
            filter: blur(5px); animation: pulsarBase 3s ease-in-out infinite; 
        }

        @keyframes flutuar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes pulsarBase { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.3); opacity: 0.6; } }

        /* --- INTEL CONTENT --- */
        .intel-panel { border-left: 4px solid var(--neon-blue); min-height: 250px; }
        .intel-title { font-size: 1.1rem; font-weight: 900; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .intel-text { font-size: 1rem; line-height: 1.5; color: #e2e8f0; }

        /* --- FOOTER --- */
        .footer-panel { width: 100%; max-width: 1200px; border-bottom: 4px solid var(--selected); }
        .btn-main { 
            background: linear-gradient(90deg, #2563eb, #3b82f6); color: #fff; 
            border: none; padding: 16px; border-radius: 10px; font-weight: 900; 
            font-size: 1rem; cursor: pointer; text-transform: uppercase; width: 100%;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        /* --- MOBILE OPTIMIZATION --- */
        @media (max-width: 1024px) {
            .dashboard-container { grid-template-columns: 1fr; }
            .grid { max-width: 290px; gap: 3px; }
            .cell { font-size: 1.1rem; }
            .panel { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="banner-topo"><img src="1000121485.png" alt="MRS"></div>

    <div class="dashboard-container">
        <div class="panel status-panel">
            <h1 class="mrs-titulo">MRS LOGÍSTICA</h1>
            <div class="fase-badge">DDS: SEGURANÇA NO TRAJETO</div>
            <div class="contador-container">STATUS: <span class="contador" id="contador-txt">0/5</span></div>
            <button class="btn-main" style="padding: 10px; font-size: 0.7rem; background: #334155;" onclick="location.reload()">REINICIAR VARREDURA</button>
        </div>

        <div class="panel"><div class="grid" id="grid-box"></div></div>

        <div class="panel intel-panel">
            <div class="mascote-wrapper">
                <img src="1000123476.png" alt="Trem Bão" class="trem-bao">
                <div class="hologram-base"></div>
            </div>
            <div id="intel-content" class="intel-text">
                <b>Trem Bão:</b> "Aguardando detecção de riscos... Use o grid para sinalizar anomalias no trajeto."
            </div>
        </div>
    </div>

    <div class="panel footer-panel">
        <button class="btn-main" onclick="window.open('https://forms.gle/ut3jDiKRPWSGVXw37')">TRANSMITIR RELATÓRIO AO FORMS</button>
    </div>

    <script>
        // CONFIGURAÇÕES GERAIS
        const SIZE = 10;
        let selecionadas = [], encontradas = [], gridData = [];
        
        const fasesPalavras = [
            {txt: "PRESSA", nivel: "grave", dica: "A pressa é a maior inimiga. <b>Trem Bão</b> alerta: A segurança vem antes do relógio!"},
            {txt: "CELULAR", nivel: "grave", dica: "Foco total na via! <b>Trem Bão</b> diz: Celular e trilho não combinam."},
            {txt: "FADIGA", nivel: "medio", dica: "Cansaço reduz reflexos. <b>Trem Bão</b> avisa: Se sentir fadiga, pare com segurança."},
            {txt: "ATENCAO", nivel: "medio", dica: "A rotina pode cegar. <b>Trem Bão</b> orienta: Mantenha a atenção plena."},
            {txt: "TEMPO", nivel: "leve", dica: "Planejamento evita urgência. <b>Trem Bão</b> sugere: Saia com tempo de sobra."}
        ];

        // INICIALIZAÇÃO DO SISTEMA
        function init() {
            let pronto = false;
            while (!pronto) { 
                gridData = Array(SIZE).fill(null).map(() => Array(SIZE).fill('')); 
                pronto = distribuirPalavras(); 
            }
            preencherLixo(); 
            renderizarGrid();
        }

        // LÓGICA DE DISTRIBUIÇÃO
        function distribuirPalavras() {
            for (let p of fasesPalavras) {
                let colocada = false, tentativas = 0;
                while (!colocada && tentativas < 2500) {
                    let h = Math.random() > 0.5;
                    let r = Math.floor(Math.random() * (h ? SIZE : SIZE - p.txt.length));
                    let c = Math.floor(Math.random() * (h ? SIZE - p.txt.length : SIZE));
                    let ok = true;
                    for (let i = 0; i < p.txt.length; i++) {
                        if (gridData[h ? r : r + i][h ? c + i : c] !== '') ok = false;
                    }
                    if (ok) {
                        for (let i = 0; i < p.txt.length; i++) gridData[h ? r : r + i][h ? c + i : c] = p.txt[i];
                        colocada = true;
                    }
                    tentativas++;
                }
                if (!colocada) return false;
            }
            return true;
        }

        function preencherLixo() {
            const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < SIZE; r++) 
                for (let c = 0; c < SIZE; c++) 
                    if (gridData[r][c] === '') gridData[r][c] = abc[Math.floor(Math.random() * abc.length)];
        }

        // RENDERIZAÇÃO E INTERAÇÃO
        function renderizarGrid() {
            const container = document.getElementById("grid-box");
            container.innerHTML = '';
            gridData.forEach((row, r) => row.forEach((letra, c) => {
                const div = document.createElement("div");
                div.className = "cell";
                div.innerText = letra;
                div.dataset.r = r;
                div.dataset.c = c;
                div.onclick = () => gerenciarClique(div, letra, r, c);
                container.appendChild(div);
            }));
        }

        function gerenciarClique(el, letra, r, c) {
            // Se já foi encontrada, ignora
            if (el.classList.contains('found-grave') || el.classList.contains('found-medio') || el.classList.contains('found-leve')) return;

            // Se clicar na última selecionada, desmarca (Rebobinar)
            if (el.classList.contains('selected')) {
                const index = selecionadas.findIndex(s => s.el === el);
                if (index === selecionadas.length - 1) {
                    el.classList.remove('selected');
                    selecionadas.pop();
                }
                return;
            }

            // Validação de Direção (Trava Linha Reta)
            if (selecionadas.length > 0) {
                const last = selecionadas[selecionadas.length - 1];
                const dr = Math.abs(r - last.r);
                const dc = Math.abs(c - last.c);
                
                // Apenas adjacentes (sem diagonal)
                if ((dr > 1 || dc > 1) || (dr === 1 && dc === 1)) return;

                // Trava de Eixo (Horizontal ou Vertical)
                if (selecionadas.length >= 2) {
                    const first = selecionadas[0];
                    const second = selecionadas[1];
                    if (first.r === second.r && r !== last.r) return;
                    if (first.c === second.c && c !== last.c) return;
                }
            }

            el.classList.add('selected');
            selecionadas.push({el, letra, r, c});
            verificarPalavra();
        }

        function verificarPalavra() {
            const formada = selecionadas.map(s => s.letra).join('');
            const invertida = [...formada].reverse().join('');
            const alvo = fasesPalavras.find(p => (p.txt === formada || p.txt === invertida) && !encontradas.includes(p.txt));

            if (alvo) {
                const corClas = `found-${alvo.nivel}`;
                selecionadas.forEach(s => {
                    s.el.classList.remove('selected');
                    s.el.classList.add(corClas);
                });
                encontradas.push(alvo.txt);
                selecionadas = [];
                document.getElementById("contador-txt").innerText = `${encontradas.length}/5`;
                animarTremBao(alvo);
            }
        }

        // INTELIGÊNCIA ARTIFICIAL DO TREM BÃO
        function animarTremBao(alvo) {
            const painel = document.getElementById("intel-content");
            const corHex = alvo.nivel === 'grave' ? '#ff2a2a' : alvo.nivel === 'medio' ? '#ffcc00' : '#00ffaa';
            
            // Limpa e prepara título
            painel.innerHTML = `<div class="intel-title" style="color:${corHex}">[!] ALERTA: ${alvo.txt}</div><div id="typewriter"></div>`;
            
            // Efeito Digitação
            let i = 0;
            const texto = alvo.dica.replace(/<[^>]*>/g, '');
            const target = document.getElementById("typewriter");

            function digitar() {
                if (i < texto.length) {
                    target.innerHTML += texto.charAt(i);
                    i++;
                    setTimeout(digitar, 35);
                }
            }

            // Ativa Voz (TTS)
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const voz = new SpeechSynthesisUtterance("Alerta do Trem Bão: " + texto);
                voz.lang = 'pt-BR';
                voz.pitch = 0.8;
                voz.rate = 1.1;
                window.speechSynthesis.speak(voz);
            }

            digitar();
        }

        init();
    </script>
</body>
</html>
