<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRS - Trilha de Conhecimento: DDS Trajeto</title>
    <style>
        :root {
            --primary: #0b3a6f; --accent: #ffffff; --cell-bg: #ffffff;
            --selected: #5dade2; --danger: #e74c3c; --warning: #f1c40f;
            --info: #2ecc71; --dark: #082a50;
        }
        body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, var(--primary) 0%, var(--dark) 100%); color: #fff; text-align: center; padding: 10px; min-height: 100vh; overflow-x: hidden; }
        .header-game { background: rgba(255, 255, 255, 0.15); padding: 20px 10px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .mrs-titulo { margin: 0; font-size: 1.2rem; font-weight: 900; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
        .slogan { font-size: 0.85rem; color: #ffffff; margin: 12px 0; font-weight: 700; font-style: italic; text-shadow: 1px 1px 3px rgba(0,0,0,0.6); line-height: 1.4; }
        .fase-badge { background: var(--accent); color: var(--primary); display: inline-block; padding: 6px 14px; border-radius: 6px; font-weight: 900; font-size: 0.85rem; margin: 5px 0; text-transform: uppercase; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
        .progresso-container { margin-top: 10px; font-weight: bold; font-size: 0.9rem; }
        .contador-bolinha { background: var(--primary); padding: 3px 12px; border-radius: 20px; border: 2px solid var(--accent); color: var(--accent); }
        .legenda-container { max-width: 100%; margin: 10px auto; }
        .legenda-item { padding: 8px; border-radius: 6px; margin-bottom: 5px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }
        .leg-verde { background: var(--info); color: #000; }
        .leg-amarelo { background: var(--warning); color: #000; }
        .leg-vermelho { background: var(--danger); color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; width: 100%; max-width: 440px; margin: 10px auto; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .cell { aspect-ratio: 1; background: var(--cell-bg); color: var(--primary); display: flex; align-items: center; justify-content: center; border-radius: 3px; font-weight: 900; font-size: 0.75rem; cursor: pointer; transition: all 0.1s ease; user-select: none; }
        .cell:active { transform: scale(0.9); opacity: 0.8; }
        .selected { background: var(--selected) !important; color: #fff !important; }
        .found-grave { background: var(--danger) !important; color: #fff !important; }
        .found-medio { background: var(--warning) !important; color: #000 !important; }
        .found-leve { background: var(--info) !important; color: #000 !important; }
        .controles { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .btn-aux { border: none; padding: 10px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 0.7rem; text-transform: uppercase; flex: 1; max-width: 215px; }
        
        /* CAIXA DO FORMS MANTIDA */
        .analise-section { width: 100%; max-width: 440px; margin: 20px auto; background: #ffffff; padding: 15px; border-radius: 12px; text-align: left; border: 3px solid var(--primary); box-sizing: border-box; color: #333; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .analise-section h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: var(--primary); text-transform: uppercase; font-weight: 900; border-bottom: 2px solid var(--primary); padding-bottom: 5px; }
        textarea { width: 100%; height: 80px; border-radius: 8px; border: 1px solid #ccc; padding: 10px; box-sizing: border-box; font-family: inherit; margin-bottom: 10px; font-size: 0.9rem; background: #fdfdfd; }
        .btn-box { display: flex; gap: 8px; }
        .btn-acao { background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 800; font-size: 0.75rem; flex: 1; }
        .btn-forms { background: #27ae60; color: #fff; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 800; font-size: 0.75rem; flex: 1; }
        
        #resultado { width: 100%; max-width: 440px; margin: 15px auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 40px;}
        .insight { padding: 12px; border-radius: 8px; text-align: left; font-size: 0.85rem; font-weight: 600; line-height: 1.4; border-left: 8px solid rgba(0,0,0,0.2); }
        .grave { background: var(--danger); color: #fff; } .medio { background: var(--warning); color: #000; } .leve { background: var(--info); color: #000; }
    </style>
</head>
<body>
    <div class="header-game">
        <h1 class="mrs-titulo">MRS - TRILHA DE CONHECIMENTO</h1>
        <p class="slogan">"Sua segurança começa ao sair de casa. <br> O percurso também faz parte da operação."</p>
        <div id="fase-badge" class="fase-badge">DDS: Segurança no Trajeto</div>
        <div class="progresso-container">Palavras: <span class="contador-bolinha" id="contador-txt">0 / 5</span></div>
    </div>
    
    <div class="legenda-container" id="painel-legenda"></div>
    
    <div class="controles">
        <button class="btn-aux" style="background:#fff; color:var(--primary)" id="btn-reset">Limpar Seleção</button>
        <button class="btn-aux" style="background:var(--danger); color:#fff" id="btn-master">Reiniciar Jogo</button>
    </div>
    
    <div class="grid" id="grid-box"></div>
    
    <div class="analise-section">
        <h3>📊 BANCO DE DADOS OPERACIONAL</h3>
        <p style="font-size: 0.7rem; margin-bottom: 8px; font-weight: bold; color: #555;">Registre aqui observações técnicas ou desvios sobre o fator humano:</p>
        <textarea id="input-comentario" placeholder="Descreva um compromisso ou desvio observado..."></textarea>
        <div class="btn-box">
            <button class="btn-acao" onclick="salvarComentario()">Registrar Fator</button>
            <button class="btn-forms" onclick="abrirForms()">Enviar ao Forms</button>
        </div>
        <div id="lista-comentarios" style="margin-top:10px; font-size:0.8rem; font-weight: bold; color: var(--primary);"></div>
    </div>

    <div id="resultado"></div>

    <script>
        const SIZE = 13;
        let selecionadas = [], encontradas = [], gridData = [], faseAtual = 1;
        
        // Jogo configurado com 5 palavras sobre o DDS de trajeto
        const fasesPalavras = {
            1: [
                {txt: "PRESSA", nome: "PRESSA", nivel: "grave", dica: "A pressa é a maior inimiga da segurança. O tempo ganho na rua correndo nunca compensa o risco de um acidente."},
                {txt: "CELULAR", nome: "CELULAR", nivel: "grave", dica: "O uso do celular destrói a atenção periférica. Pare de caminhar ou estacione se precisar olhar a tela."},
                {txt: "FADIGA", nome: "FADIGA", nivel: "medio", dica: "O cansaço reduz drasticamente os seus reflexos. Redobre o cuidado no trajeto de volta para casa após o turno."},
                {txt: "ATENCAO", nome: "ATENÇÃO", nivel: "medio", dica: "O cérebro relaxa na rotina do trajeto diário. Force a atenção e redobre o cuidado com chuva ou à noite."},
                {txt: "TEMPO", nome: "TEMPO", nivel: "leve", dica: "Programe seu tempo e saia com antecedência. O planejamento elimina a urgência e garante uma viagem mais calma."}
            ]
        };

        function init() {
            let pronto = false;
            while (!pronto) { gridData = Array(SIZE).fill(null).map(() => Array(SIZE).fill('')); pronto = distribuirPalavras(); }
            preencherLixo(); desenhar(); atualizarUI();
        }

        function distribuirPalavras() {
            const lista = [...fasesPalavras[faseAtual]].sort((a,b) => b.txt.length - a.txt.length);
            for (let p of lista) {
                let colocada = false, tentativas = 0;
                while (!colocada && tentativas < 5000) {
                    let h = Math.random() > 0.5, r = Math.floor(Math.random() * (h ? SIZE : SIZE - p.txt.length)), c = Math.floor(Math.random() * (h ? SIZE - p.txt.length : SIZE));
                    if (podeColocar(p.txt, r, c, h)) {
                        for (let i = 0; i < p.txt.length; i++) gridData[h ? r : r + i][h ? c + i : c] = p.txt[i];
                        colocada = true;
                    }
                    tentativas++;
                }
                if (!colocada) return false;
            }
            return true;
        }

        function podeColocar(p, r, c, h) {
            for (let i = -1; i <= p.length; i++) {
                for (let j = -1; j <= 1; j++) {
                    let currR = h ? r + j : r + i, currC = h ? c + i : c + j;
                    if (currR >= 0 && currR < SIZE && currC >= 0 && currC < SIZE) {
                        if (i >= 0 && i < p.length && j === 0) { if (gridData[currR][currC] !== '' && gridData[currR][currC] !== p[i]) return false; }
                        else if (i >= 0 && i < p.length && gridData[currR][currC] !== '') return false;
                    }
                }
            }
            return true;
        }

        function preencherLixo() { const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"; for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (gridData[r][c] === '') gridData[r][c] = abc[Math.floor(Math.random() * abc.length)]; }

        function desenhar() {
            const container = document.getElementById("grid-box"); container.innerHTML = '';
            gridData.forEach((row, r) => row.forEach((letra, c) => {
                const div = document.createElement("div"); div.className = "cell"; div.innerText = letra;
                div.onclick = () => clicarCelula(div, letra, r, c); container.appendChild(div);
            }));
        }

        function clicarCelula(el, letra, r, c) {
            if (el.classList.contains('found-grave') || el.classList.contains('found-medio') || el.classList.contains('found-leve')) return;
            if (el.classList.contains('selected')) { if (selecionadas.length > 0 && selecionadas[selecionadas.length - 1].el === el) { el.classList.remove('selected'); selecionadas.pop(); } return; }
            if (selecionadas.length > 0) {
                const last = selecionadas[selecionadas.length - 1];
                if (Math.abs(r - last.r) > 1 || Math.abs(c - last.c) > 1 || (Math.abs(r - last.r) === 1 && Math.abs(c - last.c) === 1)) return;
                if (selecionadas.length >= 2) {
                    const first = selecionadas[0], second = selecionadas[1];
                    if (first.r === second.r && r !== last.r) return; if (first.r !== second.r && c !== last.c) return;
                }
            }
            el.classList.add('selected'); selecionadas.push({el, letra, r, c}); verificarJogo();
        }

        function verificarJogo() {
            const palavraFormada = selecionadas.map(s => s.letra).join('');
            const alvo = fasesPalavras[faseAtual].find(p => p.txt === palavraFormada && !encontradas.includes(p.txt));
            if (alvo) {
                selecionadas.forEach(s => { s.el.classList.remove('selected'); s.el.classList.add(alvo.nivel === 'grave' ? 'found-grave' : alvo.nivel === 'medio' ? 'found-medio' : 'found-leve'); });
                encontradas.push(alvo.txt); exibirInsight(alvo); selecionadas = []; atualizarUI(); checarFimFase();
            }
        }

        function exibirInsight(p) {
            const res = document.getElementById("resultado");
            const card = document.createElement("div"); card.className = `insight ${p.nivel}`;
            card.innerHTML = `<strong>✔ ${p.nome}</strong>: ${p.dica}`; res.prepend(card);
        }

        function atualizarUI() {
            const total = fasesPalavras[faseAtual].length;
            document.getElementById("contador-txt").innerText = `${encontradas.length} / ${total}`;
            const painel = document.getElementById("painel-legenda");
            const graves = fasesPalavras[faseAtual].filter(p => p.nivel === 'grave').map(p => p.nome).join(' • ');
            const medios = fasesPalavras[faseAtual].filter(p => p.nivel === 'medio').map(p => p.nome).join(' • ');
            const leves = fasesPalavras[faseAtual].filter(p => p.nivel === 'leve').map(p => p.nome).join(' • ');
            painel.innerHTML = `<div class="legenda-item leg-verde">${leves}</div><div class="legenda-item leg-amarelo">${medios}</div><div class="legenda-item leg-vermelho">${graves}</div>`;
        }

        function checarFimFase() { 
            if (encontradas.length === fasesPalavras[faseAtual].length) { 
                setTimeout(() => {
                    alert("🎯 Parabéns! Você concluiu as palavras do DDS. Lembre-se de registrar sua observação no Forms!");
                }, 400);
            } 
        }

        function salvarComentario() {
            const texto = document.getElementById("input-comentario").value;
            if (!texto) return;
            document.getElementById("lista-comentarios").innerHTML = `✅ Fator registrado no sistema piloto da MRS.`;
            alert("Observação guardada.");
        }

        function abrirForms() { window.open("https://forms.gle/ut3jDiKRPWSGVXw37", '_blank'); }

        document.getElementById("btn-reset").onclick = function() { document.querySelectorAll(".cell.selected").forEach(el => el.classList.remove("selected")); selecionadas = []; };
        document.getElementById("btn-master").onclick = function() { if(confirm("Reiniciar jogo?")) { encontradas = []; selecionadas = []; document.getElementById("resultado").innerHTML = ""; init(); } };

        init();
    </script>
</body>
</html>
