<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRS - Dashboard de Boas Práticas Operacionais</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* SISTEMA DE DESIGN OPERACIONAL MRS - VERSÃO 6.0
           Foco: Segurança Cognitiva e Ergonomia para Dispositivos Móveis.
        */
        :root {
            --mrs-blue: #0b3a6f;
            --accent: #ffffff;
            --selected: #3b82f6;
            --danger: #ff2a2a;
            --warning: #ffcc00;
            --success: #00ffaa;
            --neon-blue: #00d2ff;
            --glass-bg: rgba(10, 15, 30, 0.98);
            --glass-border: rgba(0, 210, 255, 0.3);
            --font-main: 'Inter', sans-serif;
        }

        body {
            margin: 0;
            font-family: var(--font-main);
            background: #020617;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* --- COMPONENTES VISUAIS --- */
        .banner-topo {
            width: 100%;
            max-width: 1100px;
            margin-bottom: 12px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .banner-topo img { width: 100%; display: block; }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 1100px;
            margin-bottom: 10px;
        }

        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 20px;
            box-shadow: 0 15px 45px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
        }

        /* --- STATUS E CABEÇALHO --- */
        .status-panel { text-align: center; justify-content: center; }
        .mrs-titulo {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--accent);
            letter-spacing: 1.5px;
        }
        .contador-frame {
            background: #000;
            padding: 15px;
            border-radius: 10px;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            font-family: monospace;
            font-size: 2.2rem;
            text-shadow: 0 0 15px var(--neon-blue);
            margin: 15px 0;
        }

        /* --- GRID DE BUSCA PROCEDURAL --- */
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 5px;
            width: 100%;
            max-width: 340px;
            margin: 0 auto;
            padding: 12px;
            background: rgba(0,0,0,0.5);
            border-radius: 14px;
        }
        .cell {
            aspect-ratio: 1;
            background: #ffffff;
            color: #0b1120;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            font-weight: 600;
            font-size: 1.4rem;
            cursor: pointer;
            transition: 0.1s ease;
            user-select: none;
        }
        .selected { background: var(--selected) !important; color: #fff !important; }
        
        /* CORES DE GRAVIDADE */
        .found-grave { background: var(--danger) !important; color: #fff !important; box-shadow: 0 0 12px var(--danger); }
        .found-medio { background: var(--warning) !important; color: #000 !important; box-shadow: 0 0 12px var(--warning); }
        .found-leve { background: var(--success) !important; color: #000 !important; box-shadow: 0 0 12px var(--success); }

        /* --- TERMINAL DE INTELIGÊNCIA OPERACIONAL --- */
        .intel-panel { border-left: 8px solid var(--neon-blue); min-height: 600px; }
        .intel-title {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--neon-blue);
            text-transform: uppercase;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        
        .intel-box {
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.02rem;
            line-height: 1.6;
            animation: slideIn 0.5s ease-out forwards;
        }
        .box-neuro { background: rgba(255,255,255,0.05); border-left: 5px solid var(--neon-blue); color: #e2e8f0; }
        .box-fatal { background: rgba(255,42,42,0.15); border-left: 5px solid var(--danger); color: #ffa0a0; }
        .box-pratica { background: rgba(0,255,170,0.15); border-left: 5px solid var(--success); color: #e2e8f0; }
        
        .label-intel {
            display: block;
            font-weight: 800;
            font-size: 0.8rem;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.6);
            letter-spacing: 1px;
        }

        .role-tag {
            font-size: 0.7rem;
            font-weight: 900;
            background: var(--mrs-blue);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 5px;
            text-transform: uppercase;
            border: 1px solid rgba(255,255,255,0.1);
        }

        @keyframes slideIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

        /* --- RODAPÉ OPERACIONAL COMPACTO --- */
        .footer-panel { width: 100%; max-width: 1100px; border-bottom: 6px solid var(--selected); margin-top: 5px; }
        .input-mrs {
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 12px;
            color: #fff;
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1.2rem;
            min-height: 90px;
            resize: none;
            margin-bottom: 12px;
        }
        .btn-main {
            background: linear-gradient(90deg, #1e40af, #3b82f6);
            color: #fff;
            border: none;
            padding: 22px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 1.4rem;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }

        /* --- MEDIA QUERIES --- */
        @media (max-width: 1024px) {
            .dashboard-container { grid-template-columns: 1fr; gap: 10px; }
            .intel-panel { min-height: auto; }
            .panel { padding: 15px; }
            .mrs-titulo { font-size: 1.3rem; }
            .input-mrs { min-height: 80px; font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="banner-topo"><img src="1000121485.png" alt="MRS LOGÍSTICA"></div>

    <div class="dashboard-container">
        <div class="panel status-panel">
            <h1 class="mrs-titulo">Boas Práticas!</h1>
            <div class="contador-frame" id="contador-txt">0/5</div>
            <button class="btn-main" style="padding:10px; font-size:0.75rem; background:#1e293b;" onclick="location.reload()">REINICIAR SISTEMA</button>
        </div>

        <div class="panel"><div class="grid" id="grid-box"></div></div>

        <div class="panel intel-panel">
            <div class="intel-title">Relatório de Inteligência</div>
            <div id="intel-content">
                <div style="font-style: italic; color: #94a3b8; text-align: center; margin-top: 50px;">
                    "Terminal em prontidão operacional. Localize os 5 fatores críticos de risco no grid para carregar os protocolos de Boas Práticas."
                </div>
            </div>
        </div>
    </div>

    <div class="panel footer-panel">
        <textarea class="input-mrs" id="feedback-caixa" placeholder="Maquinista, Manobrador e Controlador: registrem aqui os compromissos técnicos do DDS..."></textarea>
        <button class="btn-main" onclick="transmitir()">TRANSMITIR RELATÓRIO AO FORMS</button>
    </div>

    <script>
        /* MOTOR LÓGICO DE SEGURANÇA INTEGRADA MRS
           Desenvolvido para garantir a robustez na detecção de desvios operacionais.
        */
        const SIZE = 10;
        let selecionadas = [], encontradas = [], gridData = [];
        
        // BANCO DE DADOS INTEGRAL DE BOAS PRÁTICAS
        const bancoDados = [
            {
                txt: "SONO", nivel: "grave", display: "BOAS PRÁTICAS: GESTÃO DA FADIGA",
                neuro: "O acúmulo de adenosina no cérebro induz o microssono involuntário. O córtex pré-frontal 'desliga' por até 3s; o indivíduo mantém os olhos abertos, mas a consciência situacional e o processamento de riscos são nulos.",
                fatal: "FATO MUNDIAL: Hinton (Canadá, 1986). A tripulação em exaustão extrema não registrou visualmente o sinal de parada absoluta na via. Resultado: Colisão frontal violenta entre dois trens e 23 fatalidades.",
                simu: "Imagine sentir a visão turva faltando 1 hora para o fim do turno. <span class='role-tag'>AÇÃO</span> Pare o trem em local seguro; o sono é uma falha mecânica humana. Não tente vencer a fisiologia."
            },
            {
                txt: "CELULAR", nivel: "grave", display: "BOAS PRÁTICAS: FOCO OPERACIONAL",
                neuro: "O processamento de dados eletrônicos causa a 'Cegueira Inatencional'. O cérebro sequestra a Rede de Saliência para o mundo digital, tornando o colaborador cego a obstáculos físicos reais à sua frente.",
                fatal: "FATO MUNDIAL: Chatsworth (EUA, 2008). 25 mortos. O maquinista estava enviando um SMS segundos antes de ignorar o sinal vermelho. A atenção estava no dispositivo enquanto o físico colidia frontalmente.",
                simu: "Imagine uma notificação vibrar durante a formação de trens ou condução. <span class='role-tag'>AÇÃO</span> Aparelho desligado e guardado. A atenção parcial é uma ilusão fatal em ambiente ferroviário."
            },
            {
                txt: "ATENCAO", nivel: "medio", display: "BOAS PRÁTICAS: VIGILÂNCIA ATIVA",
                neuro: "A 'Habituação Sensorial' ocorre pela repetição em locais conhecidos. O cérebro economiza energia e projeta memórias de 'via livre' sobre a realidade de perigos inéditos, anulando a capacidade de detecção.",
                fatal: "FATO MUNDIAL: Santiago de Compostela (Espanha, 2013). 79 mortos. Por excesso de familiaridade, o condutor relaxou a vigilância, perdeu a noção espacial exata e entrou em uma curva a 179km/h.",
                simu: "Imagine operar em pátio familiar no automático mental. <span class='role-tag'>AÇÃO</span> Use o 'Anotar e Cantar' (Shisa Kanko) para cada sinalização. A voz força o cérebro a validar a realidade externa."
            },
            {
                txt: "SINAL", nivel: "grave", display: "BOAS PRÁTICAS: DISCIPLINA OPERACIONAL",
                neuro: "O 'Viés de Expectativa' faz o cérebro projetar o que espera ver. Se um sinal ou agulha está habitualmente em uma posição, o sistema visual camufla a realidade contrária por frações de segundo fatais.",
                fatal: "FATO MUNDIAL: Bad Aibling (Alemanha, 2016). 12 mortos. O controlador forçou um comando de sinal verde em via singela por estar convencido de que o sistema estava errado, ignorando o perigo real.",
                simu: "Imagine um sinal apagado ou agulha em aspecto duvidoso. <span class='role-tag'>AÇÃO</span> Na dúvida interpretativa, o protocolo ferroviário é PARADA ABSOLUTA. Nunca presuma o caminho livre."
            },
            {
                txt: "PRESSA", nivel: "leve", display: "BOAS PRÁTICAS: CONSCIÊNCIA TEMPORAL",
                neuro: "O estresse por tempo dispara o 'Sequestro da Amígdala'. O sistema límbico assume o comando neural, priorizando a meta (horário) e desligando o raciocínio crítico e a percepção periférica de perigos.",
                fatal: "FATO MUNDIAL: Amagasaki (Japão, 2005). 107 mortos. O condutor acelerou em curva perigosa para compensar um atraso de apenas 90 segundos. A pressa química bloqueou o senso de perigo da velocidade.",
                simu: "Imagine a urgência para liberar um pátio ou recuperar atraso. <span class='role-tag'>AÇÃO</span> Respire fundo para modular o sistema nervoso. A segurança sempre precede o relógio."
            }
        ];

        /* --- FUNÇÕES DE INICIALIZAÇÃO --- */
        function init() {
            let pronto = false;
            while (!pronto) { 
                gridData = Array(SIZE).fill(null).map(() => Array(SIZE).fill('')); 
                pronto = distribuirPalavras(); 
            }
            preencherLixo(); 
            renderizarGrid();
        }

        function distribuirPalavras() {
            const lista = [...bancoDados].sort((a,b) => b.txt.length - a.txt.length);
            for (let p of lista) {
                let colocada = false, tentativas = 0;
                while (!colocada && tentativas < 6000) {
                    let h = Math.random() > 0.5, 
                        r = Math.floor(Math.random() * (h ? SIZE : SIZE - p.txt.length)), 
                        c = Math.floor(Math.random() * (h ? SIZE - p.txt.length : SIZE));
                    let ok = true;
                    for (let i = 0; i < p.txt.length; i++) if (gridData[h?r:r+i][h?c+i:c] !== '') ok = false;
                    if (ok) { for (let i = 0; i < p.txt.length; i++) gridData[h?r:r+i][h?c+i:c] = p.txt[i]; colocada = true; }
                    tentativas++;
                }
                if (!colocada) return false;
            } return true;
        }

        function preencherLixo() {
            const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) 
                if (gridData[r][c] === '') gridData[r][c] = abc[Math.floor(Math.random() * abc.length)];
        }

        function renderizarGrid() {
            const container = document.getElementById("grid-box"); container.innerHTML = '';
            gridData.forEach((row, r) => row.forEach((letra, c) => {
                const div = document.createElement("div"); div.className = "cell"; div.innerText = letra;
                div.onclick = () => gerenciarClique(div, letra, r, c); container.appendChild(div);
            }));
        }

        /* --- LÓGICA DE INTERAÇÃO --- */
        function gerenciarClique(el, letra, r, c) {
            if (el.classList.contains('found-grave') || el.classList.contains('found-medio') || el.classList.contains('found-leve')) return;
            if (el.classList.contains('selected')) {
                const index = selecionadas.findIndex(s => s.el === el);
                if (index === selecionadas.length - 1) { el.classList.remove('selected'); selecionadas.pop(); }
                return;
            }
            if (selecionadas.length > 0) {
                const last = selecionadas[selecionadas.length - 1];
                if (Math.abs(r - last.r) > 1 || Math.abs(c - last.c) > 1 || (r !== last.r && c !== last.c)) return;
                if (selecionadas.length >= 2) {
                    const first = selecionadas[0], second = selecionadas[1];
                    if (first.r === second.r && r !== last.r) return;
                    if (first.c === second.c && c !== last.c) return;
                }
            }
            el.classList.add('selected'); selecionadas.push({el, letra, r, c}); verificarMatch();
        }

        function verificarMatch() {
            const formada = selecionadas.map(s => s.letra).join('');
            const invertida = [...formada].reverse().join('');
            const alvo = bancoDados.find(p => (p.txt === formada || p.txt === invertida) && !encontradas.includes(p.txt));
            if (alvo) {
                const corClas = `found-${alvo.nivel}`;
                selecionadas.forEach(s => { s.el.classList.remove('selected'); s.el.classList.add(corClas); });
                encontradas.push(alvo.txt); selecionadas = [];
                document.getElementById("contador-txt").innerText = `${encontradas.length}/5`;
                apresentarAnalise(alvo);
            }
        }

        function apresentarAnalise(alvo) {
            const painel = document.getElementById("intel-content");
            const corH = alvo.nivel === 'grave' ? 'var(--danger)' : alvo.nivel === 'medio' ? 'var(--warning)' : 'var(--success)';
            
            painel.innerHTML = `
                <div style="color:${corH}; font-weight:800; margin-bottom:15px; font-size:1.15rem; border-bottom: 2px solid ${corH}; padding-bottom:10px;">
                   [ ! ] DETECTADO: ${alvo.display}
                </div>
                <div class="intel-box box-neuro"><span class="label-intel">Análise Neural (Origem do Erro)</span>${alvo.neuro}</div>
                <div class="intel-box box-fatal"><span class="label-intel">Fato Histórico de Alto Impacto</span>${alvo.fatal}</div>
                <div class="intel-box box-pratica"><span class="label-intel">Simulação e Boas Práticas</span>${alvo.simu}</div>
            `;
        }

        function transmitir() {
            if(!document.getElementById("feedback-caixa").value) { alert("Atenção: Registre o relatório do DDS antes de transmitir."); return; }
            window.open('https://forms.gle/ut3jDiKRPWSGVXw37');
        }

        init();
    </script>
</body>
</html>
