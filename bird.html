<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRS - Pirâmide Digital Blindada</title>
    <style>
        :root {
            --mrs-yellow: #facc15;
            --bg-dark: #050505;
            --off: #1f2937;
            --green: #22c55e;
            --yellow: #eab308;
            --orange: #f97316;
            --red: #ef4444;
        }

        body {
            background-color: var(--bg-dark);
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/d/d2/Logo_MRS_Log%C3%ADstica.png');
            background-repeat: no-repeat;
            background-position: center 30%;
            background-attachment: fixed;
            background-size: 80%;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
        }

        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); z-index: -1; }

        .header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; border-bottom: 3px solid var(--mrs-yellow); margin-bottom: 20px; padding-bottom: 8px; }
        .logo-box { background: var(--mrs-yellow); color: black; padding: 2px 12px; font-weight: 900; font-style: italic; }

        /* Pirâmide */
        .pyramid { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .row { display: flex; gap: 4px; }
        .block { width: 35px; height: 30px; background: var(--off); border: 1px solid #444; border-radius: 3px; cursor: pointer; transition: 0.4s; }
        
        /* Bloqueio visual */
        .locked { opacity: 0.2; cursor: not-allowed !important; filter: grayscale(1); }

        /* Cores Ativas */
        .active-1 { background: var(--green) !important; box-shadow: 0 0 15px var(--green); }
        .active-2 { background: var(--yellow) !important; box-shadow: 0 0 15px var(--yellow); }
        .active-3 { background: var(--orange) !important; box-shadow: 0 0 15px var(--orange); }
        .active-4 { background: var(--red) !important; box-shadow: 0 0 30px var(--red); border-color: white; }

        /* Controles */
        .controls { width: 100%; max-width: 500px; margin-top: 25px; display: flex; flex-direction: column; gap: 10px; }
        
        .btn-voice { 
            background: #222; border: 2px solid var(--mrs-yellow); color: var(--mrs-yellow); 
            padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; 
            display: flex; flex-direction: column; align-items: center; gap: 5px;
        }
        .listening { background: var(--red) !important; color: white !important; border-color: white !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        .btn-safe { background: #065f46; color: #34d399; border: 1px solid #059669; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        .card-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; width: 100%; max-width: 500px; }
        .card { background: rgba(30,41,59,0.7); padding: 12px; border-radius: 10px; text-align: center; border: 1px solid #333; }

        #alert { width: 90%; max-width: 480px; background: rgba(0,0,0,0.9); border-left: 5px solid var(--mrs-yellow); padding: 15px; margin-top: 15px; color: var(--mrs-yellow); font-size: 13px; display: none; }
        #voice-debug { font-size: 10px; color: #666; font-style: italic; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-box">MRS</div>
        <div id="clock" style="font-weight: bold; font-family: monospace;">00:00:00</div>
    </div>

    <div class="pyramid">
        <div class="row" id="l4" style="width: 80px; height: 50px;"></div>
        <div class="row" id="l3"></div>
        <div class="row" id="l2"></div>
        <div class="row" id="l1"></div>
    </div>

    <div id="alert"></div>

    <div class="controls">
        <button id="mic" class="btn-voice" onclick="toggleVoice()">
            <span>🎤 ATIVAR COMANDO DE VOZ</span>
            <span id="voice-debug">Aguardando comando...</span>
        </button>
        <button class="btn-safe" onclick="handleSafe()">🛡️ REGISTRAR AÇÃO SEGURA</button>
    </div>

    <div class="card-row">
        <div class="card">
            <small>STATUS DA UNIDADE</small>
            <div id="status" style="font-size: 18px; font-weight: bold; color: var(--green); margin-top: 5px;">SEGURO</div>
        </div>
        <div class="card">
            <small>PONTOS DE RISCO</small>
            <div id="points" style="font-size: 22px; font-weight: bold; color: var(--mrs-yellow); margin-top: 5px;">0</div>
        </div>
    </div>

    <button onclick="resetAll()" style="margin-top:20px; background:none; border:none; color:#555; font-size:10px;">Reiniciar Painel</button>

    <script>
        let db = JSON.parse(localStorage.getItem('mrs_blind_db')) || { l1:0, l2:0, l3:0, l4:0, safe:0 };
        const config = { l1: 10, l2: 5, l3: 3, l4: 1 };
        
        function init() {
            Object.keys(config).forEach(id => {
                const row = document.getElementById(id);
                row.innerHTML = '';
                for(let i=0; i<config[id]; i++) {
                    let b = document.createElement('div');
                    b.className = 'block';
                    const lvl = parseInt(id[1]);
                    b.onclick = () => addRisk(lvl);
                    row.appendChild(b);
                }
            });
            render();
        }

        function addRisk(lvl) {
            // TRAVA DE SEGURANÇA: Só sobe se o nível de baixo estiver cheio
            if (lvl > 1 && db[`l${lvl-1}`] < config[`l${lvl-1}`]) {
                showMsg(`⚠️ BLOQUEADO: Preencha todos os blocos do nível ${lvl-1} antes de subir.`);
                return;
            }

            if (db[`l${lvl}`] < config[lvl]) {
                db[`l${lvl}`]++;
                save();
                showMsg(`Registro nível ${lvl} adicionado.`);
            }
        }

        function handleSafe() {
            if (db.safe < 5) db.safe++;
            if (db.l1 > 0 && db.safe >= 3) db.l1--; // Segurança reduz risco da base
            save();
            showMsg("🛡️ Ação Segura! Cultura de prevenção reforçada.");
        }

        function render() {
            for(let l=1; l<=4; l++) {
                const blocks = document.getElementById(`l${l}`).children;
                const isLocked = l > 1 && db[`l${l-1}`] < config[`l${l-1}`];
                for(let i=0; i<blocks.length; i++) {
                    blocks[i].className = 'block' + (i < db[`l${l}`] ? ` active-${l}` : '');
                    if (isLocked && i >= db[`l${l}`]) blocks[i].classList.add('locked');
                }
            }
            const total = (db.l1 * 2) + (db.l2 * 10) + (db.l3 * 30) + (db.l4 * 100);
            document.getElementById('points').innerText = total;
            const st = document.getElementById('status');
            if(db.l4 > 0) { st.innerText="CRÍTICO"; st.style.color="var(--red)"; }
            else if(total > 35) { st.innerText="ATENÇÃO"; st.style.color="var(--yellow)"; }
            else { st.innerText="SEGURO"; st.style.color="var(--green)"; }
        }

        // --- SISTEMA DE VOZ CORRIGIDO ---
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Speech) {
            const rec = new Speech();
            rec.lang = 'pt-BR';
            rec.continuous = false;
            rec.interimResults = false;

            rec.onstart = () => {
                document.getElementById('mic').classList.add('listening');
                document.getElementById('voice-debug').innerText = "Ouvindo agora...";
            };

            rec.onresult = (e) => {
                const cmd = e.results[0][0].transcript.toLowerCase();
                document.getElementById('voice-debug').innerText = `Ouvi: "${cmd}"`;
                
                // Reconhecimento mais flexível
                if (cmd.includes("ato") || cmd.includes("desvio")) addRisk(1);
                else if (cmd.includes("quase") || cmd.includes("acidente")) {
                    if (cmd.includes("grave")) addRisk(4);
                    else addRisk(2);
                }
                else if (cmd.includes("leve") || cmd.includes("incidente")) addRisk(3);
                else if (cmd.includes("segura") || cmd.includes("ação")) handleSafe();
            };

            rec.onend = () => {
                document.getElementById('mic').classList.remove('listening');
            };

            window.toggleVoice = () => { 
                try { rec.start(); } catch(e) { rec.stop(); }
            };
        }

        function showMsg(t) {
            const a = document.getElementById('alert');
            a.innerHTML = `<strong>MRS INFORMA:</strong><br>${t}`;
            a.style.display = 'block';
            setTimeout(() => { a.style.display = 'none'; }, 5000);
        }

        function save() { localStorage.setItem('mrs_blind_db', JSON.stringify(db)); render(); }
        function resetAll() { if(confirm("Zerar painel?")) { db={l1:0,l2:0,l3:0,l4:0,safe:0}; save(); location.reload(); }}
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        init();
    </script>
</body>
</html>
