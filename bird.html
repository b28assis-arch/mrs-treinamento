<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRS - Pirâmide de Bird Digital</title>
    <style>
        :root {
            --mrs-yellow: #facc15;
            --bg-dark: #050505;
            --off: #1f2937;
            --green: #22c55e;
            --yellow: #eab308;
            --orange: #f97316;
            --red: #ef4444;
        }

        body {
            background-color: var(--bg-dark);
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/d/d2/Logo_MRS_Log%C3%ADstica.png');
            background-repeat: no-repeat;
            background-position: center center;
            background-attachment: fixed;
            background-size: 60%;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
        }

        body::before {
            content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.88); z-index: -1;
        }

        .header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; border-bottom: 3px solid var(--mrs-yellow); margin-bottom: 20px; padding-bottom: 10px; }
        .mrs-logo-txt { background: var(--mrs-yellow); color: black; padding: 4px 15px; font-weight: 900; font-style: italic; font-size: 20px; }

        .pyramid { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .row { display: flex; gap: 4px; padding: 5px; border-radius: 5px; transition: 0.3s; cursor: pointer; }
        .row:hover { background: rgba(255,255,255,0.05); }

        .block { width: 35px; height: 30px; background: var(--off); border: 1px solid #444; border-radius: 3px; transition: 0.5s; }
        .locked { opacity: 0.2; filter: grayscale(1); }

        /* Cores Ativas */
        .active-1 { background: var(--green) !important; box-shadow: 0 0 12px var(--green); }
        .active-2 { background: var(--yellow) !important; box-shadow: 0 0 12px var(--yellow); }
        .active-3 { background: var(--orange) !important; box-shadow: 0 0 12px var(--orange); }
        .active-4 { background: var(--red) !important; box-shadow: 0 0 25px var(--red); border-color: white; }

        /* Painel de Controle */
        .controls { width: 100%; max-width: 500px; margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
        .btn-voice { background: #111; border: 2px solid var(--mrs-yellow); color: var(--mrs-yellow); padding: 15px; border-radius: 50px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .listening { background: var(--red) !important; color: white !important; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

        .btn-safe { background: #065f46; color: #34d399; border: 1px solid #059669; padding: 15px; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* Legenda / Histórico */
        .history-card { width: 100%; max-width: 500px; background: rgba(30,41,59,0.8); margin-top: 20px; border-radius: 12px; border: 1px solid #333; overflow: hidden; }
        .history-header { background: #1e293b; padding: 10px; font-size: 12px; font-weight: bold; color: var(--mrs-yellow); border-bottom: 1px solid #333; }
        .history-list { max-height: 150px; overflow-y: auto; padding: 10px; font-size: 13px; }
        .history-item { border-bottom: 1px solid #2d3748; padding: 5px 0; display: flex; justify-content: space-between; }
        .history-item:last-child { border: none; }

        .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 500px; margin-top: 15px; }
        .stat-card { background: rgba(15,23,42,0.9); padding: 12px; border-radius: 10px; text-align: center; border: 1px solid #333; }

        #debug-voice { font-size: 10px; color: #666; text-align: center; margin-top: 5px; font-family: monospace; }
    </style>
</head>
<body>

    <div class="header">
        <div class="mrs-logo-txt">MRS</div>
        <div id="clock" style="font-family: monospace; font-size: 18px;">00:00:00</div>
    </div>

    <div class="pyramid">
        <div class="row" id="row-4" onclick="addIncident(4)" title="Acidente Grave"></div>
        <div class="row" id="row-3" onclick="addIncident(3)" title="Incidente Leve"></div>
        <div class="row" id="row-2" onclick="addIncident(2)" title="Quase Acidente"></div>
        <div class="row" id="row-1" onclick="addIncident(1)" title="Ato Inseguro"></div>
    </div>

    <div class="controls">
        <button id="btn-mic" class="btn-voice" onclick="startRecognition()">
            <span id="mic-icon">🎤</span> ATIVAR COMANDO DE VOZ
        </button>
        <div id="debug-voice">Pronto para ouvir...</div>
        <button class="btn-safe" onclick="addSafeAction()">🛡️ REGISTRAR AÇÃO SEGURA</button>
    </div>

    <div class="stats">
        <div class="stat-card">
            <small style="color:#94a3b8">STATUS DDS</small>
            <div id="status-tag" style="font-weight:bold; color:var(--green); font-size:18px;">SEGURO</div>
        </div>
        <div class="stat-card">
            <small style="color:#94a3b8">TOTAL DESVIOS</small>
            <div id="count-tag" style="font-weight:bold; color:var(--mrs-yellow); font-size:22px;">0</div>
        </div>
    </div>

    <div class="history-card">
        <div class="history-header">LEGENDA DE REGISTROS EM TEMPO REAL</div>
        <div class="history-list" id="log-list">
            <div style="color:#444; text-align:center">Nenhum registro no turno atual.</div>
        </div>
    </div>

    <button onclick="resetApp()" style="margin-top:20px; background:none; border:none; color:#333; font-size:10px; cursor:pointer;">Reiniciar Sistema</button>

    <script>
        let db = JSON.parse(localStorage.getItem('mrs_bird_final')) || { l1:0, l2:0, l3:0, l4:0, logs: [] };
        const limits = { l1: 10, l2: 5, l3: 3, l4: 1 };
        const names = ["", "Ato Inseguro", "Quase Acidente", "Incidente Leve", "ACIDENTE GRAVE"];

        function build() {
            for(let l=1; l<=4; l++) {
                const row = document.getElementById(`row-${l}`);
                row.innerHTML = '';
                for(let i=0; i<limits[`l${l}`]; i++) {
                    const b = document.createElement('div');
                    b.className = 'block';
                    row.appendChild(b);
                }
            }
            render();
        }

        function addIncident(lvl) {
            // Trava de Segurança: Só sobe se o nível anterior estiver cheio
            if (lvl > 1 && db[`l${lvl-1}`] < limits[`l${lvl-1}`]) {
                alert(`⚠️ TRAVA DE SEGURANÇA: Complete o nível ${lvl-1} antes de registrar o nível ${lvl}.`);
                return;
            }

            if (db[`l${lvl}`] < limits[`l${lvl}`]) {
                db[`l${lvl}`]++;
                addLog(names[lvl]);
                save();
            }
        }

        function addSafeAction() {
            // Lógica Assis: Ação segura tenta reduzir a base
            if (db.l1 > 0) {
                db.l1--;
                addLog("🛡️ Ação Segura (Redução de Risco)");
                save();
            } else {
                addLog("🛡️ Ação Segura (Maturidade Operacional)");
            }
        }

        function addLog(type) {
            const time = new Date().toLocaleTimeString();
            db.logs.unshift({ type, time }); // Adiciona no topo
            if(db.logs.length > 20) db.logs.pop(); // Mantém os últimos 20
        }

        function render() {
            for(let l=1; l<=4; l++) {
                const row = document.getElementById(`row-${l}`);
                const blocks = row.children;
                const isLocked = l > 1 && db[`l${l-1}`] < limits[`l${l-1}`];
                
                for(let i=0; i<blocks.length; i++) {
                    blocks[i].className = 'block' + (i < db[`l${l}`] ? ` active-${l}` : '');
                    if (isLocked && i >= db[`l${l}`]) blocks[i].classList.add('locked');
                }
            }
            
            // Atualiza Legenda
            const logList = document.getElementById('log-list');
            if (db.logs.length > 0) {
                logList.innerHTML = db.logs.map(item => `
                    <div class="history-item">
                        <span>${item.type}</span>
                        <span style="color:#64748b">${item.time}</span>
                    </div>
                `).join('');
            }

            document.getElementById('count-tag').innerText = db.l1 + db.l2 + db.l3 + db.l4;
            const st = document.getElementById('status-tag');
            if(db.l4 > 0) { st.innerText = "CRÍTICO"; st.style.color = "var(--red)"; }
            else if(db.l3 > 0) { st.innerText = "ALERTA"; st.style.color = "var(--orange)"; }
            else { st.innerText = "SEGURO"; st.style.color = "var(--green)"; }
        }

        // --- VOZ CORRIGIDA ---
        const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (Speech) {
            const rec = new Speech();
            rec.lang = 'pt-BR';
            rec.interimResults = false;

            window.startRecognition = () => {
                try {
                    rec.start();
                    document.getElementById('btn-mic').classList.add('listening');
                    document.getElementById('debug-voice').innerText = "Ouvindo agora...";
                } catch(e) { rec.stop(); }
            };

            rec.onresult = (e) => {
                const talk = e.results[0][0].transcript.toLowerCase();
                document.getElementById('debug-voice').innerText = `Ouvi: "${talk}"`;
                
                if (talk.includes("ato") || talk.includes("desvio")) addIncident(1);
                else if (talk.includes("quase")) addIncident(2);
                else if (talk.includes("leve") || talk.includes("incidente") || talk.includes("dedo")) addIncident(3);
                else if (talk.includes("grave") || talk.includes("acidente") || talk.includes("morte")) addIncident(4);
                else if (talk.includes("segura") || talk.includes("proteção")) addSafeAction();
            };

            rec.onend = () => {
                document.getElementById('btn-mic').classList.remove('listening');
            };
        }

        function save() { localStorage.setItem('mrs_bird_final', JSON.stringify(db)); render(); }
        function resetApp() { if(confirm("Zerar painel?")) { db={l1:0,l2:0,l3:0,l4:0,logs:[]}; save(); location.reload(); } }
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        build();
    </script>
</body>
</html>
