<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard MRS - Pirâmide de Risco</title>
    <style>
        :root {
            --mrs-yellow: #facc15;
            --bg-dark: #050505;
            --panel-bg: #111827;
            --off: #1f2937;
            --green: #22c55e;
            --yellow: #eab308;
            --orange: #f97316;
            --red: #ef4444;
        }

        body {
            background-color: var(--bg-dark);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px solid var(--mrs-yellow);
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        .logo {
            background: var(--mrs-yellow);
            color: black;
            padding: 4px 12px;
            font-weight: 900;
            font-style: italic;
        }

        .pyramid-stage {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .layer {
            display: flex;
            justify-content: center;
            gap: 3px;
            width: 100%;
        }

        .block {
            background: var(--off);
            border: 1px solid #333;
            border-radius: 2px;
            transition: 0.4s;
            cursor: pointer;
        }

        .l4 .block { width: 60px; height: 40px; }
        .l3 .block { width: 45px; height: 35px; } 
        .l2 .block { width: 35px; height: 30px; }
        .l1 .block { width: 25px; height: 25px; }

        .active-green { background: var(--green); box-shadow: 0 0 15px var(--green); border-color: white; }
        .active-yellow { background: var(--yellow); box-shadow: 0 0 15px var(--yellow); border-color: white; }
        .active-orange { background: var(--orange); box-shadow: 0 0 15px var(--orange); border-color: white; }
        .active-red { background: var(--red); box-shadow: 0 0 20px var(--red); border-color: white; }

        .dashboard-ui {
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
            display: grid;
            grid-template-cols: 1fr 1fr;
            gap: 15px;
        }

        .card {
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            text-align: center;
        }

        .thermo-bg {
            height: 120px;
            width: 30px;
            background: #000;
            margin: 10px auto;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            border: 2px solid #444;
        }

        #fill {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 0%;
            background: var(--green);
            transition: 0.5s;
        }

        #modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1e293b;
            padding: 20px;
            border: 2px solid var(--mrs-yellow);
            border-radius: 10px;
            z-index: 100;
            width: 80%;
            max-width: 300px;
        }

        textarea {
            width: 100%;
            background: #000;
            color: white;
            border: 1px solid #444;
            padding: 5px;
            margin-top: 10px;
        }

        .btn {
            background: var(--mrs-yellow);
            color: black;
            border: none;
            padding: 8px;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 90;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">MRS</div>
        <div style="text-align: right">
            <small style="display:block; color: var(--mrs-yellow)">DDS DIGITAL</small>
            <span id="clock" style="font-family: monospace;">00:00</span>
        </div>
    </div>

    <div class="pyramid-stage">
        <div class="layer l4" onclick="openModal(4)"><div class="block" id="b4-0"></div></div>
        <div class="layer l3" onclick="openModal(3)">
            <div class="block" id="b3-0"></div><div class="block" id="b3-1"></div><div class="block" id="b3-2"></div>
        </div>
        <div class="layer l2" onclick="openModal(2)">
            <div class="block" id="b2-0"></div><div class="block" id="b2-1"></div><div class="block" id="b2-2"></div><div class="block" id="b2-3"></div><div class="block" id="b2-4"></div>
        </div>
        <div class="layer l1" onclick="openModal(1)">
            <div class="block" id="b1-0"></div><div class="block" id="b1-1"></div><div class="block" id="b1-2"></div><div class="block" id="b1-3"></div><div class="block" id="b1-4"></div><div class="block" id="b1-5"></div><div class="block" id="b1-6"></div><div class="block" id="b1-7"></div><div class="block" id="b1-8"></div><div class="block" id="b1-9"></div>
        </div>
    </div>

    <div class="dashboard-ui">
        <div class="card">
            <small>TERMÔMETRO</small>
            <div class="thermo-bg"><div id="fill"></div></div>
            <b id="status">BAIXO</b>
        </div>
        <div class="card">
            <small>REGISTROS HOJE</small>
            <div id="log-count" style="font-size: 24px; font-weight: bold; color: var(--mrs-yellow); margin: 10px 0;">0</div>
            <button onclick="clearAll()" style="background:none; border:none; color: #666; font-size: 10px;">Zerar Painel</button>
        </div>
    </div>

    <div class="overlay" id="overlay"></div>
    <div id="modal">
        <h3 id="m-title" style="margin:0; font-size: 14px; color: var(--mrs-yellow);">REGISTRAR</h3>
        <textarea id="m-desc" rows="3" placeholder="O que aconteceu?"></textarea>
        <button class="btn" onclick="saveIncident()">SALVAR</button>
        <button onclick="closeModal()" style="background:none; color:white; width:100%; border:none; margin-top:5px; font-size:10px;">CANCELAR</button>
    </div>

    <script>
        let currentLevel = 0;
        let db = JSON.parse(localStorage.getItem('mrs_db')) || { l1: 0, l2: 0, l3: 0, l4: 0, history: [] };

        function openModal(level) {
            currentLevel = level;
            document.getElementById('modal').style.display = 'block';
            document.getElementById('overlay').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('m-desc').value = '';
        }

        function saveIncident() {
            if (currentLevel === 1 && db.l1 < 10) db.l1++;
            if (currentLevel === 2 && db.l2 < 5) db.l2++;
            if (currentLevel === 3 && db.l3 < 3) db.l3++;
            if (currentLevel === 4 && db.l4 < 1) db.l4++;

            db.history.push({ level: currentLevel, time: new Date().toLocaleTimeString() });
            localStorage.setItem('mrs_db', JSON.stringify(db));
            render();
            closeModal();
        }

        function render() {
            updateRow('b1', db.l1, 'active-green', 10);
            updateRow('b2', db.l2, 'active-yellow', 5);
            updateRow('b3', db.l3, 'active-orange', 3);
            updateRow('b4', db.l4, 'active-red', 1);

            const fill = document.getElementById('fill');
            const total = (db.l1 * 4) + (db.l2 * 10) + (db.l3 * 20) + (db.l4 * 100);
            const percent = Math.min(total, 100);
            fill.style.height = percent + '%';
            document.getElementById('log-count').innerText = db.history.length;
        }

        function updateRow(prefix, count, className, total) {
            for (let i = 0; i < total; i++) {
                const el = document.getElementById(`${prefix}-${i}`);
                el.className = 'block';
                if (i < count) el.classList.add(className);
            }
        }

        function clearAll() {
            if(confirm("Zerar painel?")) {
                db = { l1: 0, l2: 0, l3: 0, l4: 0, history: [] };
                localStorage.setItem('mrs_db', JSON.stringify(db));
                render();
            }
        }

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        render();
    </script>
</body>
</html>
