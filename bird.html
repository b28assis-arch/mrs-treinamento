<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRS - Gestão de Risco Bird</title>
    <style>
        :root {
            --mrs-yellow: #facc15;
            --bg-dark: #050505;
            --off: #1f2937;
            --green: #22c55e;
            --yellow: #eab308;
            --orange: #f97316;
            --red: #ef4444;
        }

        body {
            background-color: var(--bg-dark);
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/d/d2/Logo_MRS_Log%C3%ADstica.png');
            background-repeat: no-repeat;
            background-position: center 30%;
            background-attachment: fixed;
            background-size: 60%;
            color: white;
            font-family: sans-serif;
            margin: 0; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
        }

        body::before { content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: -1; }

        .header { width: 100%; max-width: 500px; display: flex; justify-content: space-between; border-bottom: 2px solid var(--mrs-yellow); margin-bottom: 20px; padding-bottom: 5px; }

        /* Pirâmide Real */
        .pyramid { display: flex; flex-direction: column; align-items: center; gap: 5px; }
        .row { display: flex; gap: 4px; }
        .block { width: 30px; height: 25px; background: var(--off); border: 1px solid #444; border-radius: 2px; cursor: pointer; transition: 0.3s; }
        
        /* Tamanhos Egito */
        .l4 .block { width: 80px; height: 45px; }
        .l3 .block { width: 60px; height: 35px; }
        .l2 .block { width: 45px; height: 30px; }
        
        /* Cores Ativas */
        .active-1 { background: var(--green) !important; box-shadow: 0 0 10px var(--green); }
        .active-2 { background: var(--yellow) !important; box-shadow: 0 0 10px var(--yellow); }
        .active-3 { background: var(--orange) !important; box-shadow: 0 0 10px var(--orange); }
        .active-4 { background: var(--red) !important; box-shadow: 0 0 20px var(--red); }

        /* Painel Assis: Risco vs Segurança */
        .status-panel { width: 100%; max-width: 500px; margin-top: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card { background: rgba(30,41,59,0.7); padding: 10px; border-radius: 8px; text-align: center; border: 1px solid #333; }
        
        .alert-box { width: 100%; max-width: 480px; background: #000; color: var(--mrs-yellow); border-left: 4px solid var(--mrs-yellow); padding: 10px; margin-top: 15px; font-size: 13px; display: none; }

        .btn-safe { background: #065f46; color: #34d399; border: 1px solid #059669; padding: 10px; border-radius: 5px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div style="background:var(--mrs-yellow); color:black; font-weight:bold; padding:2px 10px;">MRS</div>
        <div id="clock">00:00</div>
    </div>

    <div class="pyramid">
        <div class="row l4" id="l4"></div>
        <div class="row l3" id="l3"></div>
        <div class="row l2" id="l2"></div>
        <div class="row l1" id="l1"></div>
    </div>

    <div id="msg" class="alert-box"></div>

    <button class="btn-safe" onclick="registrarSeguranca()">🛡️ REGISTRAR AÇÃO SEGURA</button>

    <div class="status-panel">
        <div class="card">
            <small>STATUS DO DIA</small>
            <div id="status-txt" style="font-weight:bold; font-size:20px; color:var(--green); margin-top:5px;">SEGURO</div>
        </div>
        <div class="card">
            <small>PONTOS DE RISCO</small>
            <div id="risco-val" style="font-weight:bold; font-size:24px; color:var(--yellow); margin-top:5px;">0</div>
        </div>
    </div>

    <script>
        let risco = 0;
        let seguranca = 0;
        let db = { l1:[], l2:[], l3:[], l4:[] };

        const msgs = [
            "",
            "Ato Inseguro: Corrija agora! Pequenos desvios causam grandes acidentes.",
            "Quase Acidente: Atenção! A sorte não é um procedimento de segurança.",
            "Incidente Leve: Pare e reflita. O próximo erro pode ser fatal.",
            "ACIDENTE GRAVE: RISCO CRÍTICO! Interrompa a operação imediatamente."
        ];

        // Criar blocos com precisão
        function createBlocks(id, count) {
            const container = document.getElementById(id);
            const level = id.replace('l','');
            for(let i=0; i<count; i++) {
                let b = document.createElement('div');
                b.className = 'block';
                b.onclick = () => registrarRisco(level, i, b);
                container.appendChild(b);
            }
        }

        createBlocks('l4', 1); createBlocks('l3', 3); createBlocks('l2', 5); createBlocks('l1', 10);

        function registrarRisco(lvl, idx, el) {
            if (el.classList.contains('active-' + lvl)) return;
            
            el.classList.add('active-' + lvl);
            risco += parseInt(lvl);
            if (seguranca > 0) seguranca--; // Efeito Espelho Assis
            
            showMsg(msgs[lvl]);
            updateUI();
        }

        function registrarSeguranca() {
            if (seguranca < 5) seguranca++;
            // Proteção Assis: Muita segurança diminui o risco visual (apaga um bloco da base)
            if (seguranca >= 4 && risco > 0) {
                risco--;
                showMsg("🛡️ Excelência operacional! Ação segura reduz o risco da unidade.");
            }
            updateUI();
        }

        function updateUI() {
            const statusTxt = document.getElementById('status-txt');
            document.getElementById('risco-val').innerText = risco;

            if (seguranca >= 4 && risco <= 2) {
                statusTxt.innerText = "SEGURO"; statusTxt.style.color = "var(--green)";
            } else if (risco >= 5) {
                statusTxt.innerText = "CRÍTICO"; statusTxt.style.color = "var(--red)";
            } else {
                statusTxt.innerText = "ATENÇÃO"; statusTxt.style.color = "var(--yellow)";
            }
        }

        function showMsg(txt) {
            const m = document.getElementById('msg');
            m.innerHTML = "<strong>ALERTA:</strong> " + txt;
            m.style.display = 'block';
        }

        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}); }, 1000);
    </script>
</body>
</html>
