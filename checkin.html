<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRS - Check-In 360</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --mrs-blue: #0b3a6f; --mrs-green: #00ffaa; --bg: #020617;
            --danger: #ff2a2a; --panel: rgba(15, 23, 42, 0.9);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; }
        
        .header { text-align: center; margin-bottom: 20px; }
        .logo { width: 150px; margin-bottom: 10px; border-radius: 5px; }
        .title { font-size: 0.9rem; font-weight: 900; color: var(--mrs-green); text-transform: uppercase; letter-spacing: 2px; }

        .game-card {
            width: 100%; max-width: 400px; background: var(--panel); border: 1px solid rgba(0,255,170,0.2);
            border-radius: 20px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align: center;
        }

        /* PUZZLE AREA */
        .puzzle-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
            margin: 20px 0; background: #1e293b; padding: 10px; border-radius: 12px;
        }
        .puzzle-piece {
            aspect-ratio: 1/1; background-size: 200% 300%; border: 2px solid transparent;
            border-radius: 8px; cursor: pointer; transition: 0.2s;
            background-image: url('https://i.imgur.com/8Qe8h3z.jpeg'); /* Imagem de Locomotiva MRS */
        }
        .puzzle-piece.selected { border-color: var(--mrs-green); transform: scale(0.95); box-shadow: 0 0 15px var(--mrs-green); }

        .btn {
            background: var(--mrs-green); color: #000; border: none; padding: 15px;
            width: 100%; border-radius: 10px; font-weight: 900; text-transform: uppercase;
            cursor: pointer; margin-top: 15px;
        }

        .instruction { font-size: 0.85rem; color: #94a3b8; margin-bottom: 10px; }
        .success-msg { color: var(--mrs-green); font-weight: 800; display: none; margin-top: 10px; animation: fadeIn 0.5s; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="header">
        <img src="1000147486.jpg" class="logo">
        <div class="title">Check-In 360: Prontidão</div>
    </div>

    <div class="game-card" id="game-container">
        <h2 style="font-size: 1.2rem;">Aptidão Neural</h2>
        <p class="instruction">Toque em duas peças para trocá-las e monte a locomotiva para ativar seu cérebro.</p>
        
        <div class="puzzle-grid" id="puzzle-grid"></div>
        
        <div id="success-msg" class="success-msg">✅ CÉREBRO ATIVADO! PRONTIDÃO 100%.</div>
        <div id="next-step" style="display:none;">
            <p style="font-size: 0.8rem; margin: 15px 0;">Sua mente saiu do automático. Agora, siga para o BAS-20.</p>
            <button class="btn" onclick="goToEtilometro()">Próxima Etapa</button>
        </div>
    </div>

    <script>
        // Configuração do Puzzle (2x3 = 6 peças)
        const gridContainer = document.getElementById('puzzle-grid');
        let pieces = [0, 1, 2, 3, 4, 5];
        let currentOrder = [...pieces].sort(() => Math.random() - 0.5);
        let selectedIndex = null;

        function createPuzzle() {
            gridContainer.innerHTML = '';
            currentOrder.forEach((pieceIdx, displayIdx) => {
                const piece = document.createElement('div');
                piece.className = 'puzzle-piece';
                
                // Cálculo da posição da imagem (Background Sprite)
                const row = Math.floor(pieceIdx / 2);
                const col = pieceIdx % 2;
                piece.style.backgroundPosition = `${col * 100}% ${row * 50}%`;
                
                piece.onclick = () => handlePieceClick(displayIdx);
                gridContainer.appendChild(piece);
            });
        }

        function handlePieceClick(idx) {
            if (selectedIndex === null) {
                selectedIndex = idx;
                gridContainer.children[idx].classList.add('selected');
            } else {
                // Trocar peças
                [currentOrder[selectedIndex], currentOrder[idx]] = [currentOrder[idx], currentOrder[selectedIndex]];
                gridContainer.children[selectedIndex].classList.remove('selected');
                selectedIndex = null;
                createPuzzle();
                checkWin();
            }
        }

        function checkWin() {
            if (JSON.stringify(currentOrder) === JSON.stringify(pieces)) {
                document.getElementById('success-msg').style.display = 'block';
                document.getElementById('next-step').style.display = 'block';
                const piecesElements = document.querySelectorAll('.puzzle-piece');
                piecesElements.forEach(p => {
                    p.style.pointerEvents = 'none';
                    p.style.borderColor = 'var(--mrs-green)';
                });
            }
        }

        function goToEtilometro() {
            document.getElementById('game-container').innerHTML = `
                <h2 style="margin-bottom:10px;">Procedimento BAS-20</h2>
                <p style="font-size:0.85rem; color:#94a3b8; margin-bottom:20px;">Lembre-se do fluxo correto para evitar falhas de similaridade facial:</p>
                <div style="text-align:left; background:rgba(255,255,255,0.05); padding:15px; border-radius:10px; font-size:0.9rem;">
                    1. Aproxime o Crachá<br>
                    2. Aguarde a Identificação Facial<br>
                    3. Posicione o canudo e sopre<br>
                    4. Verifique o resultado no painel
                </div>
                <button class="btn" onclick="goToSentinela()">Entendido</button>
            `;
        }

        function goToSentinela() {
            document.getElementById('game-container').innerHTML = `
                <h2 style="margin-bottom:10px;">Cuidado Mútuo</h2>
                <p style="font-size:0.9rem; margin-bottom:15px;">Seu colega deu "Fora da Tolerância" no teste. Ele pede para você omitir ao gestor. O que você faz?</p>
                <button class="btn" style="background:#ef4444; color:#fff;" onclick="finish(false)">Omitir (Risco Fatal)</button>
                <button class="btn" onclick="finish(true)">Intervir (Protocolo Sentinela)</button>
            `;
        }

        function finish(saved) {
            const container = document.getElementById('game-container');
            if (saved) {
                container.innerHTML = `
                    <h2 style="color:var(--mrs-green);">SENTINELA ATIVO</h2>
                    <p style="margin-top:15px; font-size:0.9rem;">Você praticou o cuidado mútuo. Os 10 acidentes do trimestre param aqui. Bom turno!</p>
                    <button class="btn" onclick="location.reload()">Reiniciar</button>
                `;
            } else {
                container.innerHTML = `
                    <h2 style="color:var(--danger);">ALERTA CRÍTICO</h2>
                    <p style="margin-top:15px; font-size:0.9rem;">A omissão causou a fatalidade deste ano. Sem segurança, não há operação.</p>
                    <button class="btn" style="background:var(--danger); color:#fff;" onclick="location.reload()">Tentar Novamente</button>
                `;
            }
        }

        createPuzzle();
    </script>
</body>
</html>
