<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Confirmar Passagem</title>

<style>
body {
  font-family: Arial;
  padding: 20px;
  text-align: center;
}

.box {
  background: #f2f2f2;
  padding: 15px;
  border-radius: 10px;
}

canvas {
  border: 2px solid black;
  width: 100%;
  height: 150px;
}

button {
  margin-top: 10px;
  padding: 15px;
  width: 100%;
  background: green;
  color: white;
  border: none;
  border-radius: 8px;
}
</style>
</head>

<body>

<h2>Confirmar Passagem</h2>

<div class="box">
<p id="info">Carregando...</p>
</div>

<h3>Assinatura</h3>
<canvas id="canvas"></canvas>

<button onclick="confirmar()">✅ Confirmar</button>

<p id="status"></p>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "SUA_API_KEY",
  authDomain: "SEU_DOMINIO",
  projectId: "SEU_PROJECT_ID",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const ref = doc(db, "passagens", id);

const snap = await getDoc(ref);

if (snap.exists()) {
  let d = snap.data();
  document.getElementById("info").innerHTML =
    "Trem: " + d.prefixo + "<br>" +
    "Local: " + d.local + "<br>" +
    "Status: " + d.status;
}

window.confirmar = async function () {

  await updateDoc(ref, {
    status: "confirmado",
    confirmadoEm: new Date().toLocaleString()
  });

  document.getElementById("status").innerHTML =
    "✅ PASSAGEM CONFIRMADA COM SUCESSO";
};

</script>

</body>
</html>
