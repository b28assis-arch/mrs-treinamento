<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Assinatura - Passagem</title>

<style>
body {
  background: #0f1b2d;
  color: white;
  font-family: Arial;
  padding: 15px;
}

h2 {
  text-align: center;
}

.card {
  background: #1e2d44;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

p {
  margin: 5px 0;
}

canvas {
  background: white;
  border-radius: 10px;
  width: 100%;
  height: 200px;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  margin-top: 10px;
}

.assinar {
  background: #22c55e;
  color: white;
}

.limpar {
  background: #ef4444;
  color: white;
}
</style>
</head>

<body>

<h2>✍️ Confirmar Passagem</h2>

<div class="card" id="dados"></div>

<div class="card">
<h3>Assinatura do Maquinista</h3>
<canvas id="assinatura"></canvas>

<button class="limpar" onclick="limpar()">🧹 Limpar</button>
<button class="assinar" onclick="confirmar()">✅ Confirmar</button>
</div>

<script>
// pegar dados da URL
const params = new URLSearchParams(window.location.search);

const dadosDiv = document.getElementById("dados");

dadosDiv.innerHTML = `
<p><b>Prefixo:</b> ${params.get("prefixo")}</p>
<p><b>Local:</b> ${params.get("local")}</p>
<p><b>Maquinista Sai:</b> ${params.get("sai")}</p>
<p><b>Maquinista Entra:</b> ${params.get("entra")}</p>
<p><b>Freio:</b> ${params.get("freio")}</p>
<p><b>Origem:</b> ${params.get("origem")}</p>
<p><b>Destino:</b> ${params.get("destino")}</p>
`;

// assinatura
const canvas = document.getElementById("assinatura");
const ctx = canvas.getContext("2d");

let desenhando = false;

canvas.addEventListener("mousedown", () => desenhando = true);
canvas.addEventListener("mouseup", () => {
  desenhando = false;
  ctx.beginPath();
});
canvas.addEventListener("mousemove", desenhar);

canvas.addEventListener("touchstart", () => desenhando = true);
canvas.addEventListener("touchend", () => {
  desenhando = false;
  ctx.beginPath();
});
canvas.addEventListener("touchmove", desenharTouch);

function desenhar(e) {
  if (!desenhando) return;
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.strokeStyle = "black";

  ctx.lineTo(e.offsetX, e.offsetY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(e.offsetX, e.offsetY);
}

function desenharTouch(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const x = e.touches[0].clientX - rect.left;
  const y = e.touches[0].clientY - rect.top;

  if (!desenhando) return;

  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.strokeStyle = "black";

  ctx.lineTo(x, y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y);
}

function limpar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function confirmar() {

  const assinatura = canvas.toDataURL();

  alert("✅ Passagem confirmada com sucesso!");

  console.log({
    dados: Object.fromEntries(params),
    assinatura: assinatura
  });

}
</script>

</body>
</html>
