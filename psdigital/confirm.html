<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Confirmar Passagem</title>

<style>
body {
  background: #0f1b2d;
  color: white;
  font-family: Arial;
  padding: 15px;
}

.card {
  background: #1e2d44;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

canvas {
  background: white;
  border-radius: 10px;
  width: 100%;
  height: 200px;
}

button {
  width: 100%;
  padding: 15px;
  border-radius: 10px;
  border: none;
  margin-top: 10px;
}

.ok { background: #22c55e; }
.limpar { background: #ef4444; }
</style>
</head>

<body>

<h2>✍️ Assinatura</h2>

<div class="card" id="dados"></div>

<div class="card">
<canvas id="assinatura"></canvas>

<button class="limpar" onclick="limpar()">Limpar</button>
<button class="ok" onclick="confirmar()">Confirmar</button>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// 🔥 COLE SEU FIREBASE AQUI
const firebaseConfig = {
  apiKey: "COLE_AQUI",
  authDomain: "COLE_AQUI",
  projectId: "COLE_AQUI",
  storageBucket: "COLE_AQUI",
  messagingSenderId: "COLE_AQUI",
  appId: "COLE_AQUI"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 📥 pegar dados da URL
const params = new URLSearchParams(window.location.search);

document.getElementById("dados").innerHTML = `
<b>🚆 ${params.get("prefixo")}</b><br>
${params.get("local")}<br>
${params.get("sai")} ➜ ${params.get("entra")}<br>
Freio: ${params.get("freio")}
`;

// ✍️ assinatura
const canvas = document.getElementById("assinatura");
const ctx = canvas.getContext("2d");

let desenhando = false;

canvas.addEventListener("mousedown", () => desenhando = true);
canvas.addEventListener("mouseup", () => { desenhando = false; ctx.beginPath(); });
canvas.addEventListener("mousemove", desenhar);

canvas.addEventListener("touchstart", () => desenhando = true);
canvas.addEventListener("touchend", () => { desenhando = false; ctx.beginPath(); });
canvas.addEventListener("touchmove", desenharTouch);

function desenhar(e) {
  if (!desenhando) return;
  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.strokeStyle = "black";

  ctx.lineTo(e.offsetX, e.offsetY);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(e.offsetX, e.offsetY);
}

function desenharTouch(e) {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const x = e.touches[0].clientX - rect.left;
  const y = e.touches[0].clientY - rect.top;

  if (!desenhando) return;

  ctx.lineWidth = 2;
  ctx.lineCap = "round";
  ctx.strokeStyle = "black";

  ctx.lineTo(x, y);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x, y);
}

window.limpar = function() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// 💾 SALVAR
window.confirmar = async function () {

  const assinatura = canvas.toDataURL();
  const dados = Object.fromEntries(params);

  try {

    await addDoc(collection(db, "passagens"), {
      ...dados,
      assinatura: assinatura,
      data: new Date().toISOString()
    });

    alert("✅ Salvo com sucesso!");

  } catch (e) {
    alert("Erro: " + e);
  }
};

</script>

</body>
</html>
