<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Passagem de Serviço</title>

<style>
body {
  font-family: 'Segoe UI', Arial;
  background: #0f172a;
  color: #fff;
  padding: 15px;
}

h2 {
  text-align: center;
}

input, select, textarea {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  border-radius: 10px;
  border: none;
  margin-bottom: 10px;
}

button {
  width: 100%;
  padding: 18px;
  font-size: 18px;
  font-weight: bold;
  background: #22c55e;
  border: none;
  border-radius: 12px;
  margin-top: 10px;
}

canvas {
  width: 100%;
  height: 150px;
  background: #fff;
  border-radius: 10px;
  margin-top: 10px;
}

.label {
  margin-top: 10px;
  font-weight: bold;
}
</style>
</head>

<body>

<h2>🚂 Passagem de Serviço</h2>

<input placeholder="Prefixo do Trem" id="prefixo">
<input placeholder="Data" id="data">
<input placeholder="Hora" id="hora">
<input placeholder="Local" id="local">
<input placeholder="Maquinista que sai" id="sai">
<input placeholder="Maquinista que entra" id="entra">

<div class="label">Último sinal</div>
<select id="sinal">
  <option>Verde</option>
  <option>Amarelo</option>
  <option>Vermelho</option>
</select>

<textarea placeholder="Observações"></textarea>

<div class="label">✍️ Assinatura - Quem sai</div>
<canvas id="ass1"></canvas>
<button onclick="limparAssinatura()">🧹 Limpar assinatura</button>

<button onclick="gerar()">📲 Gerar QR + Link</button>

<canvas id="qr"></canvas>

<!-- QR CODE LIB -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
window.onload = function() {

const canvas = document.getElementById("ass1");
const ctx = canvas.getContext("2d");

// ajusta tamanho real
canvas.width = canvas.offsetWidth;
canvas.height = canvas.offsetHeight;

ctx.lineWidth = 2;
ctx.lineCap = "round";

let desenhando = false;

// posição correta
function pos(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.touches ? e.touches[0].clientX : e.clientX) - rect.left,
    y: (e.touches ? e.touches[0].clientY : e.clientY) - rect.top
  };
}

// =================
// MOUSE
// =================
canvas.addEventListener("mousedown", () => {
  desenhando = true;
  ctx.beginPath();
});

canvas.addEventListener("mouseup", () => desenhando = false);

canvas.addEventListener("mousemove", (e) => {
  if (!desenhando) return;
  const p = pos(e);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
});

// =================
// TOUCH (CELULAR)
// =================
canvas.addEventListener("touchstart", (e) => {
  desenhando = true;
  ctx.beginPath();
});

canvas.addEventListener("touchend", () => desenhando = false);

canvas.addEventListener("touchmove", (e) => {
  e.preventDefault();
  if (!desenhando) return;

  const p = pos(e);
  ctx.lineTo(p.x, p.y);
  ctx.stroke();
});

// limpar assinatura
window.limparAssinatura = function() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
};

};

// gerar QR
function gerar() {
  let link = window.location.href + "?ok=true";

  QRCode.toCanvas(document.getElementById("qr"), link, function (error) {
    if (error) {
      alert("Erro ao gerar QR");
    } else {
      alert("✅ QR gerado com sucesso!");
    }
  });
}
</script>

</body>
</html>
