<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Passagem de Serviço - MRS</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
    :root {
        --mrs-azul: #002b5c;
        --mrs-amarelo: #FFC600;
        --mrs-bg: #f4f6f8;
    }

    body {
        margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: var(--mrs-bg);
        color: #333;
    }

    .header-mrs {
        background: var(--mrs-azul);
        color: var(--mrs-amarelo);
        padding: 15px;
        text-align: center;
        border-bottom: 4px solid var(--mrs-amarelo);
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .header-mrs h2 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 1px;
    }

    .container {
        max-width: 800px;
        margin: auto;
        padding: 15px;
    }

    .card {
        background: #fff;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    label {
        font-weight: bold;
        font-size: 13px;
        color: var(--mrs-azul);
        display: block;
        margin-top: 10px;
    }

    input, select, textarea {
        width: 100%;
        padding: 12px;
        margin-top: 5px;
        border-radius: 6px;
        border: 1px solid #ccc;
        box-sizing: border-box;
        font-size: 16px; /* Evita zoom automático no iPhone */
    }

    input:focus, select:focus, textarea:focus {
        border-color: var(--mrs-azul);
        outline: none;
        box-shadow: 0 0 5px rgba(0, 43, 92, 0.3);
    }

    .section-title {
        background: var(--mrs-azul);
        color: #fff;
        padding: 8px 12px;
        margin: 15px -15px 10px -15px;
        font-weight: bold;
        text-transform: uppercase;
        font-size: 14px;
    }

    .canvas-container {
        border: 2px dashed #aaa;
        border-radius: 6px;
        background: #fafafa;
        margin-top: 5px;
        touch-action: none; /* Evita que a tela role ao assinar */
    }

    canvas {
        width: 100%;
        height: 100px;
        display: block;
    }

    button {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        font-size: 16px;
        cursor: pointer;
        transition: 0.2s;
    }

    .btn-gerar {
        background: var(--mrs-amarelo);
        color: var(--mrs-azul);
    }

    .btn-gerar:hover { background: #e6b300; }

    .btn-limpar {
        background: #e0e0e0;
        color: #333;
    }

    .qrBox {
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 20px;
    }

    /* Oculta inicialmente */
    #licencaBox, #qrContainer { display: none; }
</style>
</head>

<body>

<div class="header-mrs">
    <h2>🚂 PASSAGEM DE SERVIÇO</h2>
</div>

<div class="container">
    <form id="formPassagem">
        <div class="card">
            <div class="section-title">Dados Gerais</div>
            
            <label>Prefixo do Trem</label>
            <input id="prefixo" list="trens" placeholder="Ex: NGM0101">
            <datalist id="trens">
                <option value="NGM0101">
                <option value="MGU0202">
                <option value="TMO0303">
            </datalist>

            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label>Data</label>
                    <input id="data" type="date">
                </div>
                <div style="flex: 1;">
                    <label>Hora</label>
                    <input id="hora" type="time">
                </div>
            </div>

            <label>Local (Pátio/Km)</label>
            <input id="local" list="locais" placeholder="Selecione ou digite">
            <datalist id="locais">
                <option value="Pátio Arará">
                <option value="Barra do Piraí">
                <option value="Brisamar">
                <option value="Conselheiro Lafaiete">
            </datalist>

            <label>Maquinista - Quem Sai (Nome/Matrícula)</label>
            <input id="sai" placeholder="Ex: João Silva (12345)">

            <label>Maquinista - Quem Entra (Nome/Matrícula)</label>
            <input id="entra" placeholder="Ex: Carlos Souza (54321)">
        </div>

        <div class="card">
            <div class="section-title">Circulação</div>
            
            <label>Licença Especial (LE)</label>
            <select id="licencaSel" onchange="toggleLicenca()">
                <option value="NAO">NÃO</option>
                <option value="SIM">SIM</option>
            </select>

            <div id="licencaBox">
                <label>Origem da LE</label>
                <input id="origem" placeholder="Km / Pátio">
                
                <label>Destino da LE</label>
                <input id="destino" placeholder="Km / Pátio">
            </div>
        </div>

        <div class="card">
            <div class="section-title">Observações (Avarias, RESTRIÇÕES, etc.)</div>
            <textarea id="obs" rows="4" placeholder="Detalhe aqui as condições da locomotiva e da via..."></textarea>
        </div>

        <div class="card">
            <div class="section-title">Assinaturas</div>

            <label>Assinatura - Quem Sai</label>
            <div class="canvas-container">
                <canvas id="ass1"></canvas>
            </div>

            <label>Assinatura - Quem Entra</label>
            <div class="canvas-container">
                <canvas id="ass2"></canvas>
            </div>

            <button type="button" class="btn-limpar" onclick="limparAssinaturas()">Limpar Assinaturas</button>
            <button type="button" class="btn-gerar" onclick="gerarDocumento()">Gerar PDF e QR Code</button>

            <div class="qrBox" id="qrContainer">
                <canvas id="qr"></canvas>
                <p style="font-weight: bold; color: var(--mrs-azul);">Escaneie o QR Code</p>
            </div>
        </div>
    </form>
</div>

<script>
    const { jsPDF } = window.jspdf;

    // --- 1. FUNÇÕES DE INICIALIZAÇÃO E AUTO-SAVE ---
    window.onload = function() {
        // Preenche Data e Hora atuais se estiverem vazios
        const now = new Date();
        document.getElementById('data').value = now.toISOString().split('T')[0];
        document.getElementById('hora').value = now.toTimeString().slice(0,5);

        // Carrega rascunho salvo no modo Offline (LocalStorage)
        carregarRascunho();

        // Configura salvamento automático a cada digitação
        document.getElementById('formPassagem').addEventListener('input', salvarRascunho);
        
        // Ajustar Canvas para o tamanho real na tela
        ajustarResolucaoCanvas('ass1');
        ajustarResolucaoCanvas('ass2');
        ativarCanvas("ass1");
        ativarCanvas("ass2");
    };

    function toggleLicenca() {
        const v = document.getElementById("licencaSel").value;
        document.getElementById("licencaBox").style.display = (v === "SIM") ? "block" : "none";
    }

    function salvarRascunho() {
        const dados = {
            prefixo: document.getElementById('prefixo').value,
            local: document.getElementById('local').value,
            sai: document.getElementById('sai').value,
            entra: document.getElementById('entra').value,
            obs: document.getElementById('obs').value,
            licencaSel: document.getElementById('licencaSel').value,
            origem: document.getElementById('origem').value,
            destino: document.getElementById('destino').value
        };
        localStorage.setItem('rascunho_mrs', JSON.stringify(dados));
    }

    function carregarRascunho() {
        const salvo = localStorage.getItem('rascunho_mrs');
        if(salvo) {
            const dados = JSON.parse(salvo);
            document.getElementById('prefixo').value = dados.prefixo || "";
            document.getElementById('local').value = dados.local || "";
            document.getElementById('sai').value = dados.sai || "";
            document.getElementById('entra').value = dados.entra || "";
            document.getElementById('obs').value = dados.obs || "";
            document.getElementById('licencaSel').value = dados.licencaSel || "NAO";
            document.getElementById('origem').value = dados.origem || "";
            document.getElementById('destino').value = dados.destino || "";
            toggleLicenca();
        }
    }

    // --- 2. LÓGICA DO CANVAS (MOUSE E TOUCH CORRIGIDO) ---
    function ajustarResolucaoCanvas(id) {
        let c = document.getElementById(id);
        let rect = c.getBoundingClientRect();
        c.width = rect.width;
        c.height = rect.height;
    }

    function ativarCanvas(id) {
        let c = document.getElementById(id);
        let ctx = c.getContext("2d");
        ctx.lineWidth = 2;
        ctx.lineCap = "round";
        ctx.strokeStyle = "#002b5c"; // Cor da caneta

        let desenhando = false;

        const iniciar = (e) => {
            e.preventDefault();
            desenhando = true;
            ctx.beginPath();
            let rect = c.getBoundingClientRect();
            let x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            let y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            ctx.moveTo(x, y);
        };

        const desenhar = (e) => {
            e.preventDefault();
            if (!desenhando) return;
            let rect = c.getBoundingClientRect();
            let x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            let y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            ctx.lineTo(x, y);
            ctx.stroke();
        };

        const parar = () => {
            desenhando = false;
        };

        // Eventos Mobile (Touch)
        c.addEventListener("touchstart", iniciar, {passive: false});
        c.addEventListener("touchmove", desenhar, {passive: false});
        c.addEventListener("touchend", parar);

        // Eventos PC (Mouse)
        c.addEventListener("mousedown", iniciar);
        c.addEventListener("mousemove", desenhar);
        c.addEventListener("mouseup", parar);
        c.addEventListener("mouseout", parar);
    }

    function limparAssinaturas() {
        ["ass1", "ass2"].forEach(id => {
            let c = document.getElementById(id);
            let ctx = c.getContext("2d");
            ctx.clearRect(0, 0, c.width, c.height);
        });
    }

    // --- 3. GERAÇÃO DE PDF E QR CODE ---
    function gerarDocumento() {
        const dados = {
            prefixo: document.getElementById("prefixo").value,
            data: document.getElementById("data").value,
            hora: document.getElementById("hora").value,
            local: document.getElementById("local").value,
            sai: document.getElementById("sai").value,
            entra: document.getElementById("entra").value,
            licenca: document.getElementById("licencaSel").value,
            origem: document.getElementById("origem").value,
            destino: document.getElementById("destino").value,
            obs: document.getElementById("obs").value
        };

        if (dados.licenca === "SIM" && (!dados.origem || !dados.destino)) {
            alert("Atenção: Preencha a ORIGEM e DESTINO da Licença Especial!");
            return;
        }

        // Criando PDF Profissional
        let pdf = new jsPDF();
        
        // Cabeçalho
        pdf.setFillColor(0, 43, 92); // Azul MRS
        pdf.rect(0, 0, 210, 20, 'F');
        pdf.setTextColor(255, 198, 0); // Amarelo MRS
        pdf.setFontSize(16);
        pdf.setFont("helvetica", "bold");
        pdf.text("PASSAGEM DE SERVIÇO - MRS", 105, 13, null, null, "center");

        // Corpo
        pdf.setTextColor(0, 0, 0);
        pdf.setFontSize(11);
        pdf.setFont("helvetica", "normal");
        
        let y = 30;
        pdf.text(`Prefixo do Trem: ${dados.prefixo}`, 10, y);
        pdf.text(`Data e Hora: ${dados.data.split('-').reverse().join('/')} às ${dados.hora}`, 110, y); y += 10;
        pdf.text(`Local: ${dados.local}`, 10, y); y += 15;

        pdf.setFont("helvetica", "bold");
        pdf.text("Equipe:", 10, y); y += 8;
        pdf.setFont("helvetica", "normal");
        pdf.text(`Maquinista (Sai): ${dados.sai}`, 10, y); y += 8;
        pdf.text(`Maquinista (Entra): ${dados.entra}`, 10, y); y += 15;

        pdf.setFont("helvetica", "bold");
        pdf.text("Circulação:", 10, y); y += 8;
        pdf.setFont("helvetica", "normal");
        pdf.text(`Licença Especial (LE): ${dados.licenca}`, 10, y);
        if (dados.licenca === "SIM") {
            y += 8;
            pdf.text(`Trecho da LE: De ${dados.origem} até ${dados.destino}`, 10, y);
        }
        y += 15;

        // Quebra automática de linhas para a Observação não vazar da página
        pdf.setFont("helvetica", "bold");
        pdf.text("Observações:", 10, y); y += 8;
        pdf.setFont("helvetica", "normal");
        let linhasObs = pdf.splitTextToSize(dados.obs || "Nenhuma observação registrada.", 190);
        pdf.text(linhasObs, 10, y);
        y += (linhasObs.length * 6) + 15;

        // Inserir imagens das assinaturas capturadas
        pdf.line(10, y, 200, y); y += 10;
        pdf.setFont("helvetica", "bold");
        pdf.text("Assinaturas:", 10, y); y += 10;

        let imgSai = document.getElementById("ass1").toDataURL("image/png");
        let imgEntra = document.getElementById("ass2").toDataURL("image/png");

        pdf.setFont("helvetica", "normal");
        pdf.text("Quem Sai:", 10, y);
        pdf.addImage(imgSai, 'PNG', 10, y + 2, 70, 20); // Posiciona a img do canvas
        
        pdf.text("Quem Entra:", 110, y);
        pdf.addImage(imgEntra, 'PNG', 110, y + 2, 70, 20);

        // Salvar Arquivo
        let nomeArquivo = `Passagem_${dados.prefixo}_${dados.data}.pdf`;
        pdf.save(nomeArquivo);

        // Limpa o rascunho após gerar o PDF com sucesso
        localStorage.removeItem('rascunho_mrs');

        // Gera QR Code
        document.getElementById("qrContainer").style.display = "flex";
        QRCode.toCanvas(document.getElementById("qr"), JSON.stringify(dados), {
            width: 200,
            color: { dark: '#002b5c', light: '#ffffff' }
        });
    }
</script>

<script>
    // Registra o Service Worker para funcionar Offline
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then((registration) => {
                    console.log('Service Worker registrado com sucesso!', registration.scope);
                })
                .catch((error) => {
                    console.log('Falha ao registrar o Service Worker:', error);
                });
        });
    }
</script>
</body>
</html>
