<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passagem de Serviço</title>

<style>
body {
  font-family: Arial;
  background: #0f172a;
  color: white;
  padding: 15px;
}
h2 { text-align: center; }
input, select, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  border: none;
}
button {
  background: #22c55e;
  color: white;
  font-weight: bold;
}
.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}
canvas {
  background: white;
  border-radius: 8px;
}
</style>
</head>

<body>

<h2>🚆 Passagem de Serviço</h2>

<div id="formTela">

<div class="card">
<input id="prefixo" placeholder="Prefixo do trem">
<input id="local" placeholder="Local">
<input id="sai" placeholder="Maquinista que sai">
<input id="entra" placeholder="Maquinista que entra">
</div>

<div class="card">
<h3>Freio</h3>
<select id="freio">
<option>BOM</option>
<option>REGULAR</option>
<option>RUIM</option>
</select>
</div>

<button onclick="gerarLink()">📤 Gerar Link para Assinatura</button>

</div>

<div id="assinaturaTela" style="display:none;">

<div class="card">
<h3>Confirmação de Passagem</h3>
<p id="resumo"></p>
</div>

<div class="card">
<h3>Assinatura do Recebedor</h3>
<canvas id="canvas" width="300" height="150"></canvas>
<button onclick="limpar()">Limpar</button>
</div>

<button onclick="confirmar()">✅ Confirmar Assinatura</button>

</div>

<div id="confirmado" style="display:none;">
<h2>✅ Serviço transferido com sucesso</h2>
<p>Ambos possuem o registro digital.</p>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const dadosURL = urlParams.get("dados");

if (dadosURL) {
  document.getElementById("formTela").style.display = "none";
  document.getElementById("assinaturaTela").style.display = "block";

  const dados = JSON.parse(decodeURIComponent(dadosURL));

  document.getElementById("resumo").innerText =
    "Trem: " + dados.prefixo +
    "\nLocal: " + dados.local +
    "\nSai: " + dados.sai +
    "\nEntra: " + dados.entra;
}

function gerarLink() {
  const dados = {
    prefixo: document.getElementById("prefixo").value,
    local: document.getElementById("local").value,
    sai: document.getElementById("sai").value,
    entra: document.getElementById("entra").value,
    freio: document.getElementById("freio").value
  };

  const link = window.location.origin + window.location.pathname +
    "?dados=" + encodeURIComponent(JSON.stringify(dados));

  alert("Envie este link ao companheiro:\n\n" + link);
}

// assinatura
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let desenhando = false;

canvas.addEventListener("mousedown", () => desenhando = true);
canvas.addEventListener("mouseup", () => desenhando = false);
canvas.addEventListener("mousemove", desenhar);

canvas.addEventListener("touchstart", () => desenhando = true);
canvas.addEventListener("touchend", () => desenhando = false);
canvas.addEventListener("touchmove", function(e){
  desenharTouch(e);
});

function desenhar(e) {
  if (!desenhando) return;
  ctx.lineWidth = 2;
  ctx.lineTo(e.offsetX, e.offsetY);
  ctx.stroke();
}

function desenharTouch(e) {
  if (!desenhando) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.touches[0].clientX - rect.left;
  const y = e.touches[0].clientY - rect.top;
  ctx.lineTo(x, y);
  ctx.stroke();
}

function limpar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

function confirmar() {
  document.getElementById("assinaturaTela").style.display = "none";
  document.getElementById("confirmado").style.display = "block";
}
</script>

</body>
</html>
