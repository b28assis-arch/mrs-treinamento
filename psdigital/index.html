<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passagem de Serviço</title>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<style>
body {
  background: #0f1b2d;
  color: white;
  font-family: Arial;
  padding: 15px;
}

h2 {
  text-align: center;
}

.card {
  background: #1e2d44;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 5px 0;
  border-radius: 8px;
  border: none;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  margin-top: 10px;
}

.btn {
  background: #22c55e;
  color: white;
}

.whats {
  background: #25D366;
}

canvas {
  margin-top: 10px;
}
</style>
</head>

<body>

<h2>🚆 Passagem de Serviço</h2>

<div class="card">
<input id="prefixo" placeholder="Prefixo do trem">
<input id="local" placeholder="Local">
<input id="maquinistaSai" placeholder="Maquinista que sai">
<input id="maquinistaEntra" placeholder="Maquinista que entra">
</div>

<div class="card">
<h3>Freio</h3>
<select id="freio">
<option>BOM</option>
<option>REGULAR</option>
<option>RUIM</option>
</select>
</div>

<div class="card">
<h3>Condições</h3>
<select id="restricao"><option>Sem restrição</option><option>Com restrição</option></select>
<select id="camera"><option>Câmera OK</option><option>Sem câmera</option></select>
<select id="cabos"><option>Cabos OK</option><option>Cabos desconectados</option></select>
</div>

<div class="card">
<h3>Circulação</h3>
<input id="origem" placeholder="Origem">
<input id="destino" placeholder="Destino">
<select id="velocidade">
<option>Normal</option>
<option>Restrita</option>
</select>
</div>

<button class="btn" onclick="gerar()">📲 Gerar Link + QR</button>
<button class="whats" onclick="enviarWhats()">📤 Enviar no WhatsApp</button>

<canvas id="qrcode"></canvas>

<script>
let linkFinal = "";

function gerar() {

  const dados = {
    prefixo: document.getElementById("prefixo").value,
    local: document.getElementById("local").value,
    sai: document.getElementById("maquinistaSai").value,
    entra: document.getElementById("maquinistaEntra").value,
    freio: document.getElementById("freio").value,
    origem: document.getElementById("origem").value,
    destino: document.getElementById("destino").value
  };

  linkFinal = window.location.origin + "/mrs-treinamento/confirm.html?" + new URLSearchParams(dados);

  QRCode.toCanvas(document.getElementById("qrcode"), linkFinal);

  alert("Link gerado!");
}

function enviarWhats(){
  if(!linkFinal){
    alert("Gera o link primeiro!");
    return;
  }

  window.open("https://wa.me/?text=" + encodeURIComponent(linkFinal));
}
</script>

</body>
</html>
