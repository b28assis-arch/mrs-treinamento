<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passagem de Serviço</title>

<style>
:root{
  --bg:#0f172a;
  --card:#111827;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --primary:#22c55e;
  --border:#1f2937;
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:'Segoe UI', Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  padding:16px;
}

/* Cabeçalho */
h2{
  text-align:center;
  font-size:22px;
  margin-bottom:16px;
}

/* Card */
.card{
  background:var(--card);
  padding:14px;
  border-radius:14px;
  margin-bottom:14px;
  box-shadow:0 4px 12px rgba(0,0,0,.4);
}

/* Inputs */
input, select, textarea{
  width:100%;
  padding:14px;
  font-size:17px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#020617;
  color:#fff;
  margin-bottom:10px;
}

/* Labels */
.label{
  font-size:15px;
  font-weight:bold;
  margin:10px 0 4px;
}

/* Botões */
button{
  width:100%;
  padding:16px;
  font-size:18px;
  font-weight:bold;
  border:none;
  border-radius:12px;
  margin-top:10px;
}

.btn-primary{
  background:var(--primary);
  color:#000;
}

.btn-secondary{
  background:#374151;
  color:#fff;
}

/* Canvas */
canvas{
  width:100%;
  height:150px;
  background:#fff;
  border-radius:10px;
  margin-top:8px;
}

/* Sinal com cor */
select#sinal{
  font-weight:bold;
}

.sinal-verde{ color:#22c55e; }
.sinal-amarelo{ color:#facc15; }
.sinal-vermelho{ color:#ef4444; }

</style>
</head>

<body>

<h2>🚂 Passagem de Serviço</h2>

<div class="card">
  <input placeholder="Prefixo do Trem" id="prefixo">
  <input placeholder="Data" id="data">
  <input placeholder="Hora" id="hora">
  <input placeholder="Local" id="local">
  <input placeholder="Maquinista que sai" id="sai">
  <input placeholder="Maquinista que entra" id="entra">

  <div class="label">🚦 Último sinal</div>
  <select id="sinal" onchange="corSinal(this)">
    <option value="verde">🟢 Verde</option>
    <option value="amarelo">🟡 Amarelo</option>
    <option value="vermelho">🔴 Vermelho</option>
  </select>

  <textarea placeholder="Observações"></textarea>
</div>

<div class="card">
  <div class="label">✍️ Assinatura</div>
  <canvas id="ass1"></canvas>
  <button class="btn-secondary" onclick="limparAssinatura()">🧹 Limpar assinatura</button>
</div>

<div class="card">
  <button class="btn-primary" onclick="gerar()">📲 Gerar QR + Link</button>
  <canvas id="qr"></canvas>
</div>

<!-- QR CODE -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<script>
window.onload = function(){

const canvas = document.getElementById("ass1");
const ctx = canvas.getContext("2d");

canvas.width = canvas.offsetWidth;
canvas.height = canvas.offsetHeight;

ctx.lineWidth = 2;
ctx.lineCap = "round";

let desenhando = false;

function pos(e){
  const rect = canvas.getBoundingClientRect();
  return {
    x:(e.touches ? e.touches[0].clientX : e.clientX) - rect.left,
    y:(e.touches ? e.touches[0].clientY : e.clientY) - rect.top
  };
}

// MOUSE
canvas.addEventListener("mousedown",()=>{ desenhando=true; ctx.beginPath(); });
canvas.addEventListener("mouseup",()=>desenhando=false);
canvas.addEventListener("mousemove",(e)=>{
  if(!desenhando) return;
  const p=pos(e);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
});

// TOUCH
canvas.addEventListener("touchstart",(e)=>{ desenhando=true; ctx.beginPath(); });
canvas.addEventListener("touchend",()=>desenhando=false);
canvas.addEventListener("touchmove",(e)=>{
  e.preventDefault();
  if(!desenhando) return;
  const p=pos(e);
  ctx.lineTo(p.x,p.y);
  ctx.stroke();
});

// limpar
window.limparAssinatura = function(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
};

};

// QR
function gerar(){
  let link = window.location.href + "?ok=true";

  QRCode.toCanvas(document.getElementById("qr"), link, function(error){
    if(error){
      alert("Erro ao gerar QR");
    }else{
      alert("✅ QR gerado com sucesso!");
    }
  });
}

// cor do sinal
function corSinal(el){
  el.classList.remove("sinal-verde","sinal-amarelo","sinal-vermelho");
  el.classList.add("sinal-" + el.value);
}
</script>

</body>
</html>
