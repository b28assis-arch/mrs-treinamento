<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRS - Protocolo Sentinela: Blindagem Neural</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --mrs-blue: #0b3a6f; --mrs-green: #00ffaa; --danger: #ff2a2a;
            --warning: #ffcc00; --bg-dark: #020617; --neon-blue: #00d2ff;
            --panel-bg: rgba(10, 15, 30, 0.98); --border-ui: rgba(0, 255, 170, 0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif; background-color: var(--bg-dark);
            color: #f8fafc; min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 10px; overflow-x: hidden; position: relative;
        }
        body::before {
            content: ""; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 85%; height: 85%; background: url('1000121485.png') no-repeat center center;
            background-size: contain; opacity: 0.04; z-index: -1; pointer-events: none;
        }
        .header-game { width: 100%; max-width: 800px; text-align: center; margin-bottom: 15px; }
        .mrs-logo-top { width: 100%; max-width: 800px; border-radius: 8px; border: 1px solid var(--border-ui); margin-bottom: 5px; }
        .sim-container {
            width: 100%; max-width: 800px; background: var(--panel-bg);
            border: 2px solid var(--mrs-green); border-radius: 15px; padding: 20px;
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.15); min-height: 580px; display: flex; flex-direction: column;
        }
        .stage-title {
            color: var(--mrs-green); font-weight: 800; text-transform: uppercase; font-size: 1.1rem;
            margin-bottom: 15px; border-bottom: 1px solid var(--border-ui); padding-bottom: 10px;
            display: flex; justify-content: space-between;
        }
        .scenario-box {
            font-size: 1rem; line-height: 1.5; margin-bottom: 20px;
            background: rgba(0, 255, 170, 0.05); padding: 15px; border-radius: 8px; border-left: 5px solid var(--mrs-green);
        }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; }
        .option-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--border-ui); color: #fff;
            padding: 14px; border-radius: 8px; cursor: pointer; text-align: left;
            font-size: 0.95rem; transition: 0.2s; line-height: 1.3;
        }
        .option-btn:hover { background: var(--mrs-blue); border-color: var(--mrs-green); }
        .feedback-panel { display: none; animation: fadeIn 0.4s ease-out; }
        .success-box { background: rgba(0,255,170,0.15); border-left: 4px solid var(--mrs-green); padding: 15px; margin: 15px 0; border-radius: 8px; }
        .fact-box { background: rgba(255,42,42,0.15); border-left: 4px solid var(--danger); padding: 15px; margin: 15px 0; border-radius: 8px; }
        
        /* ESTILOS DO MÓDULO NEURAL */
        .neuro-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .neuro-card {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border-ui);
            padding: 12px; border-radius: 10px; cursor: pointer; transition: 0.3s;
        }
        .neuro-card:hover { border-color: var(--neon-blue); background: rgba(0, 210, 255, 0.05); }
        .neuro-icon { font-size: 1.5rem; margin-bottom: 8px; display: block; }
        .neuro-label { font-size: 0.75rem; font-weight: 800; color: var(--neon-blue); text-transform: uppercase; }
        
        .btn-action {
            background: var(--mrs-green); color: #000; border: none; padding: 12px 25px;
            border-radius: 6px; font-weight: 800; text-transform: uppercase; cursor: pointer; margin-top: 10px; width: 100%;
        }
        .textarea-mrs {
            width: 100%; background: #000; border: 1px solid var(--border-ui); color: #fff;
            padding: 12px; border-radius: 8px; height: 75px; resize: none; margin-top: 10px; font-family: inherit;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="header-game">
        <img src="1000121485.png" class="mrs-logo-top">
        <div style="color: var(--mrs-green); font-weight: 800; font-size: 1rem; letter-spacing: 1px;">PROTOCOLO SENTINELA: MÓDULO NEURAL</div>
    </div>
    <div class="sim-container" id="game-core"></div>
    <div style="width: 100%; max-width: 800px; margin-top: 15px; text-align: center;">
        <div style="font-size: 0.75rem; font-weight: 800; color: var(--neon-blue);">📡 RELATÓRIO DE SENTINELA</div>
        <textarea class="textarea-mrs" id="user-input" placeholder="O que você aprendeu sobre as armadilhas do seu cérebro hoje?"></textarea>
        <button class="btn-action" style="padding: 8px; font-size: 0.7rem; width: auto;" onclick="transmitir()">Transmitir ao Forms</button>
    </div>    <script>
        const levels = [
            {
                id: 1, title: "Dilema 1: Fadiga Oculta",
                scenario: "Seu colega está bocejando e com olhar fixo. Ele insiste que 'o café já vai fazer efeito'.",
                options: [
                    { type: 'correct', text: "Intervir e reportar a fadiga à supervisão para substituição imediata.", fato: "CLARION (2011): O cansaço ignorado causou colisão frontal. Cuidado Mútuo é ser a razão quando o colega falha." },
                    { type: 'trap', text: "Assumir as tarefas dele para deixá-lo descansando na cabine.", fato: "SOBRECARGA: Tentar cobrir o colega dobra o risco. Se você falhar, ele não estará alerta para te salvar." },
                    { type: 'more-less', text: "Sugestionar café e monitorá-lo de perto.", fato: "FALSA SEGURANÇA: Estimulantes não recuperam reflexos. No acidente de Chattanooga, o café não impediu o sono." },
                    { type: 'nothing', text: "Respeitar a decisão dele, confiando na experiência.", fato: "OMISSÃO: A fatalidade de 2026 prova que experiência não protege do sono. O silêncio diante do risco é fatal." }
                ]
            },
            {
                id: 2, title: "Dilema 2: Ponto Cego",
                scenario: "O rádio silencia no recuo. O Manobrador entrou atrás de um vagão e você não o vê mais.",
                options: [
                    { type: 'correct', text: "Parar o movimento imediatamente até restabelecer contato total.", fato: "ZERO TOLERÂNCIA: Sem rádio, movimento zero. Esta regra impede atropelamentos de colegas no pátio." },
                    { type: 'trap', text: "Recuar devagar confiando na posição que ele estava.", fato: "HABITUAÇÃO: Muitos acidentes em 2026 foram em manobras lentas. Sem rádio, a lentidão não salva vidas." },
                    { type: 'more-less', text: "Buzinar para avisar que o trem está recuando.", fato: "COMUNICAÇÃO FALHA: Buzinas não são autorização. Em Praga (2024), sinais improvisados causaram colisões." },
                    { type: 'nothing', text: "Continuar, pois ele sabe se proteger.", fato: "LAC-MÉGANTIC: Presunções mataram 47 pessoas. No Cuidado Mútuo, nunca presuma; confirme sempre." }
                ]
            },
            {
                id: 3, title: "Dilema 3: Pressão Técnica",
                scenario: "O CCO pede agilidade. O colega sugere exceder levemente a Velocidade Restrita.",
                options: [
                    { type: 'correct', text: "Manter o rigor e alertar o colega sobre o risco de descarrilar.", fato: "AMAGASAKI (2005): Tentar ganhar 90 segundos matou 107 pessoas. O cronograma não vale uma vida." },
                    { type: 'trap', text: "Concordar apenas nos trechos de reta.", fato: "SANTIAGO: Pequenos excessos viciam o desvio. O trem entrou na curva a 179km/h, resultando em 79 mortes." },
                    { type: 'more-less', text: "Deixar ele operar como quiser para evitar conflito.", fato: "CONIVÊNCIA: O Cuidado Mútuo exige coragem para discordar. Se você se cala, aceita o risco de morrer junto." },
                    { type: 'nothing', text: "Pedir autorização ao CCO para correr mais.", fato: "QUEBRA DE REGRA: CCO não autoriza riscos. Isso demonstra falta de compromisso com o Máximo Rigor." }
                ]
            },
            {
                id: 4, title: "Dilema 4: Atalho com o Pé",
                scenario: "Você vê um colega forçando uma agulha com o pé em vez de usar a alavanca.",
                options: [
                    { type: 'correct', text: "Abordar o colega, parar o ato e orientar sobre a postura correta.", fato: "ACIDENTES PESSOAIS: Lesões em pés e mãos dominam os 10 acidentes deste trimestre. O pé não é ferramenta." },
                    { type: 'trap', text: "Observar e, se ele se machucar, prestar socorro.", fato: "REATIVIDADE: Segurança é impedir o ferimento, não apenas socorrer. Intervenha antes da dor acontecer." },
                    { type: 'more-less', text: "Comentar 'cuidado' sem parar a tarefa insegura.", fato: "EFICÁCIA NULA: Orientações superficiais não mudam hábitos. O Protocolo exige a interrupção do ato." },
                    { type: 'nothing', text: "Ignorar para não criar desconforto entre equipes.", fato: "CULTURA FATAL: O medo de 'parecer chato' matou mais que falhas mecânicas. Quebre o silêncio." }
                ]
            },
            {
                id: 5, title: "Dilema 5: Distração Digital",
                scenario: "Seu colega saca o celular para ver uma mensagem rápida na cabine.",
                options: [
                    { type: 'correct', text: "Exigir que ele guarde o aparelho, reforçando o foco na via.", fato: "CHATSWORTH: Um SMS causou 25 mortes. 2 segundos no celular são 22 metros de cegueira total." },
                    { type: 'trap', text: "Deixar ele ver enquanto você assume a vigilância por ele.", fato: "DIVISÃO DE RISCO: Quando um se distrai, a dupla checagem morre. Se você falhar, ninguém te corrige." },
                    { type: 'more-less', text: "Pedir para ele ler em voz alta para você saber também.", fato: "DISTRAÇÃO COGNITIVA: Falar sobre assuntos externos tira o cérebro da via. Exija isolamento total." },
                    { type: 'nothing', text: "Ficar em silêncio para evitar atritos.", fato: "OMISSÃO: Se ocorrer um acidente e você se calou, a culpa será dividida. Proteja a vida da dupla." }
                ]
            }
        ];        let currentLevel = 0;
        const neuroTraps = [
            { icon: "🧠", title: "Habituação", text: "O cérebro ignora o que é repetitivo. Você 'vê' a via livre porque ela estava livre ontem.", combat: "Comando: Pratique o Point-and-Call (Anotar e Cantar) para cada sinal." },
            { icon: "🙈", title: "Cegueira Inatencional", text: "Focar em um monitor de falhas faz você ficar cego para um obstáculo físico na via.", combat: "Comando: Técnica Scan-and-Pan. Olhe para o longe, para os lados e para o painel ciclicamente." },
            { icon: "🚥", title: "Viés de Expectativa", text: "Você espera o verde e seu cérebro 'projeta' a luz antes dela aparecer. É a camuflagem visual.", combat: "Comando: Validação Zero. Trate cada sinal como se fosse o primeiro da sua vida." },
            { icon: "📉", title: "Fadiga de Decisão", text: "No fim do turno, sua capacidade de julgar riscos cai 50%. Você aceita atalhos que não aceitaria no início.", combat: "Comando: Check-list Cruzado. Sempre peça para o colega validar sua decisão no fim do turno." }
        ];

        function renderLevel() {
            const level = levels[currentLevel];
            const container = document.getElementById("game-core");
            const shuffledOptions = [...level.options].sort(() => Math.random() - 0.5);
            container.innerHTML = `<div class="stage-title"><span>${level.title}</span><span>${currentLevel+1}/5</span></div>
                <div class="scenario-box"><strong>SITUAÇÃO:</strong><br>${level.scenario}</div>
                <div class="options-grid">${shuffledOptions.map(opt => `<button class="option-btn" onclick="checkAnswer('${opt.type}', '${opt.fato}')">${opt.text}</button>`).join('')}</div>
                <div id="feedback" class="feedback-panel"></div>`;
        }

        function checkAnswer(type, fato) {
            const feedback = document.getElementById("feedback");
            document.querySelector(".options-grid").style.display = "none";
            feedback.style.display = "block";
            if (type === 'correct') {
                feedback.innerHTML = `<div class="success-box"><strong>✅ SENTINELA ATIVO!</strong></div>
                    <div style="font-size:0.85rem; color:#94a3b8; padding:10px; background:rgba(0,0,0,0.3); border-radius:5px;">${fato}</div>
                    <button class="btn-action" onclick="nextLevel()">Avançar</button>`;
            } else {
                feedback.innerHTML = `<div class="fact-box"><strong>❌ RISCO DETECTADO</strong><br>${fato}</div>
                    <button class="btn-action" style="background:var(--danger); color:#fff;" onclick="renderLevel()">Tentar Novamente</button>`;
            }
        }

        function nextLevel() { currentLevel++; if (currentLevel < levels.length) renderLevel(); else showNeuroModule(); }

        function showNeuroModule() {
            const container = document.getElementById("game-core");
            container.innerHTML = `
                <div class="stage-title">🧠 BLINDAGEM NEURAL</div>
                <div class="scenario-box">O erro não é falta de caráter, é a biologia pregando peças. <strong>Explore as armadilhas abaixo para blindar sua mente:</strong></div>
                <div class="neuro-grid">${neuroTraps.map((trap, i) => `
                    <div class="neuro-card" onclick="revealNeuro(${i})">
                        <span class="neuro-icon">${trap.icon}</span>
                        <span class="neuro-label">${trap.title}</span>
                    </div>`).join('')}</div>
                <div id="neuro-detail" style="margin-top:15px; min-height:100px; animation: fadeIn 0.3s;"></div>
                <button id="final-btn" class="btn-action" style="display:none;" onclick="showConclusion()">Concluir Protocolo</button>`;
        }

        function revealNeuro(i) {
            const detail = document.getElementById("neuro-detail");
            const trap = neuroTraps[i];
            detail.innerHTML = `<div style="background:rgba(0,210,255,0.1); border:1px solid var(--neon-blue); padding:12px; border-radius:8px;">
                <strong style="color:var(--neon-blue);">${trap.title}:</strong> ${trap.text}<br><br>
                <strong style="color:var(--mrs-green);">🛡️ COMBATE:</strong> ${trap.combat}</div>`;
            document.getElementById("final-btn").style.display = "block";
        }

        function showConclusion() {
            document.getElementById("game-core").innerHTML = `<div class="stage-title">✅ PROTOCOLO CONCLUÍDO</div>
                <div class="scenario-box" style="text-align: center;"><h2 style="color:var(--mrs-green); margin-bottom:10px;">SENTINELA BLINDADO</h2>
                <p>Neste Abril Verde, você aprendeu que cuidar do colega e entender sua mente salva vidas. <strong>Volte para casa todos os dias.</strong></p></div>
                <button class="btn-action" onclick="location.reload()">REINICIAR</button>`;
        }
        function transmitir() { if(!document.getElementById("user-input").value) { alert("Registre seu compromisso!"); return; } window.open('https://forms.gle/ut3jDiKRPWSGVXw37'); }
        renderLevel();
    </script>
</body>
</html>
