<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRS - Segurança Operacional e Boas Práticas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* SISTEMA DE DESIGN CORPORATIVO MRS LOGÍSTICA v9.0
           Foco: Marca d'água estrutural e Segurança Cognitiva.
        */
        :root {
            --mrs-blue: #0b3a6f;
            --accent: #ffffff;
            --selected: #3b82f6;
            --danger: #ff2a2a;   /* GRAVE */
            --warning: #ffcc00;  /* MÉDIO */
            --success: #00ffaa;  /* LEVE */
            --neon-blue: #00d2ff;
            --bg-dark: #020617;
            --panel-bg: rgba(10, 15, 30, 0.95);
            --border-ui: rgba(0, 210, 255, 0.2);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
            position: relative;
        }

        /* --- EFEITO MARCA D'ÁGUA (LOGO MRS NO FUNDO) --- */
        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            height: 90%;
            background: url('1000121485.png') no-repeat center center;
            background-size: contain;
            opacity: 0.04; /* Ajuste aqui para mais ou menos visibilidade */
            z-index: -1;
            pointer-events: none;
            filter: drop-shadow(0 0 20px rgba(0,0,0,1)); /* Efeito de sombra no logo */
        }

        /* --- COMPONENTES DE INTERFACE --- */
        .banner-topo {
            width: 100%;
            max-width: 950px;
            margin-bottom: 15px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-ui);
            box-shadow: 0 5px 20px rgba(0,0,0,0.8);
        }
        .banner-topo img { width: 100%; display: block; }

        .dashboard-container {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 12px;
            width: 100%;
            max-width: 950px;
            margin-bottom: 15px;
            z-index: 1;
        }

        .panel {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-ui);
            border-radius: 12px;
            padding: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }

        /* --- PAINEL DE STATUS --- */
        .status-header { text-align: center; justify-content: center; }
        .mrs-title { font-size: 1.2rem; font-weight: 800; color: var(--accent); text-transform: uppercase; }
        .sub-tag { font-size: 0.75rem; color: var(--neon-blue); font-weight: 700; margin-bottom: 10px; text-transform: uppercase; }
        
        .contador-ui {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            color: var(--neon-blue);
            border: 1px solid var(--neon-blue);
            font-family: monospace;
            font-size: 2rem;
            text-shadow: 0 0 10px var(--neon-blue);
            margin-bottom: 15px;
        }

        /* --- GRID DE BUSCA (CAÇA-PALAVRAS) --- */
        .grid-box {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
        }
        .cell {
            aspect-ratio: 1;
            background: #ffffff;
            color: #0b1120;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            font-weight: 700;
            font-size: 1.25rem;
            cursor: pointer;
            transition: 0.1s;
            user-select: none;
        }
        .selected { background: var(--selected) !important; color: #fff !important; }
        
        /* ESTADOS DE GRAVIDADE NO GRID */
        .found-grave { background: var(--danger) !important; color: #fff !important; box-shadow: 0 0 10px var(--danger); }
        .found-medio { background: var(--warning) !important; color: #000 !important; box-shadow: 0 0 10px var(--warning); }
        .found-leve { background: var(--success) !important; color: #000 !important; box-shadow: 0 0 10px var(--success); }

        /* --- TERMINAL DE INTELIGÊNCIA --- */
        .intel-panel { border-left: 6px solid var(--neon-blue); min-height: 520px; }
        .intel-header { font-size: 0.95rem; font-weight: 800; color: var(--neon-blue); text-transform: uppercase; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 8px; margin-bottom: 15px; }
        
        .intel-card {
            margin-bottom: 12px;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.92rem;
            line-height: 1.5;
            animation: fadeIn 0.4s ease-out;
        }
        .box-neuro { background: rgba(255,255,255,0.05); border-left: 4px solid var(--neon-blue); }
        .box-fatal { background: rgba(255,42,42,0.15); border-left: 4px solid var(--danger); color: #ffa0a0; }
        .box-action { background: rgba(0,255,170,0.15); border-left: 4px solid var(--success); }
        
        .card-label { display: block; font-weight: 800; font-size: 0.7rem; text-transform: uppercase; margin-bottom: 5px; opacity: 0.6; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- RODAPÉ E REGISTRO --- */
        .footer-ui { width: 100%; max-width: 950px; margin-top: 5px; border-bottom: 5px solid var(--selected); align-items: center; z-index: 1;}
        
        .textarea-mrs {
            background: rgba(0,0,0,0.7);
            border: 1px solid var(--border-ui);
            padding: 12px;
            border-radius: 10px;
            color: #fff;
            width: 100%;
            font-family: inherit;
            font-size: 1.05rem;
            min-height: 90px;
            resize: none;
            margin-bottom: 15px;
        }
        
        .btn-mrs {
            background: linear-gradient(180deg, #1e40af, #1e3a8a);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px 28px;
            border-radius: 6px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            text-transform: uppercase;
            width: auto;
            align-self: center;
            transition: 0.2s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .btn-mrs:hover { filter: brightness(1.2); transform: translateY(-1px); }
        .btn-mrs:active { transform: translateY(1px); }

        @media (max-width: 1024px) {
            .dashboard-container { grid-template-columns: 1fr; gap: 10px; }
            .intel-panel { min-height: auto; }
            .panel { padding: 15px; }
            .mrs-title { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <div class="banner-topo">
        <img src="1000121485.png" alt="MRS LOGÍSTICA">
    </div>

    <div class="dashboard-container">
        <div class="panel status-header">
            <h1 class="mrs-title">Boas Práticas!</h1>
            <div class="sub-tag">Prevenção Operacional</div>
            <div class="contador-ui" id="main-count">0/5</div>
            <button class="btn-mrs" style="padding: 6px 15px; font-size: 0.7rem; background: #334155;" onclick="location.reload()">REINICIAR</button>
        </div>

        <div class="panel">
            <div class="grid-box" id="grid-element"></div>
        </div>

        <div class="panel intel-panel">
            <div class="intel-header">Inteligência Operacional</div>
            <div id="intel-output">
                <div style="font-style: italic; color: #94a3b8; text-align: center; margin-top: 50px; font-size: 0.85rem;">
                    "Identifique os fatores críticos no grid para processar os protocolos de segurança."
                </div>
            </div>
        </div>
    </div>

    <div class="panel footer-ui">
        <div style="text-align: center; margin-bottom: 10px;">
            <h3 style="text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; color: var(--neon-blue);">📡 Registro de Compromisso</h3>
        </div>
        <textarea class="textarea-mrs" id="radio-input" placeholder=""></textarea>
        <button class="btn-mrs" onclick="transmitir()">Transmitir Relatório</button>
    </div>

    <script>
        /* MOTOR LÓGICO MRS v9.0
           Gerenciamento de Detecção Procedural e Análise Neurocomportamental.
        */
        const GRID_SIZE = 10;
        let activeSelection = [], foundWords = [], gridMap = [];
        
        const safetyDB = [
            {
                word: "SONO", gravity: "grave", title: "BOAS PRÁTICAS: GESTÃO DA FADIGA",
                neuro: "O acúmulo de adenosina induz o 'Microsleep'. O cérebro desliga o córtex pré-frontal por até 3s; olhos abertos, mas consciência nula.",
                fatal: "FATO REAL: Hinton (Canadá, 1986). Tripulação sob exaustão não registrou sinal de parada. Resultado: Colisão frontal e 23 fatalidades.",
                action: "Imagine sentir visão turva faltando pouco para o fim do turno. AÇÃO: Pare em local seguro imediatamente. Não tente vencer a fisiologia."
            },
            {
                word: "CELULAR", gravity: "grave", title: "BOAS PRÁTICAS: FOCO OPERACIONAL",
                neuro: "O processamento digital causa 'Cegueira Inatencional'. O cérebro sequestra a atenção periférica para a tela, tornando o colaborador cego a riscos físicos.",
                fatal: "FATO REAL: Chatsworth (EUA, 2008). 25 mortos. Maquinista enviou SMS segundos antes de ignorar sinal vermelho. Foco na tela, não na via.",
                action: "Imagine uma notificação vibrar durante a condução. AÇÃO: Dispositivo desligado e guardado. Atenção parcial é uma ilusão fatal."
            },
            {
                word: "ATENCAO", gravity: "medio", title: "BOAS PRÁTICAS: VIGILÂNCIA ATIVA",
                neuro: "Em locais familiares, o cérebro entra em 'Modo Econômico' (Habituação). Ele projeta memórias de 'via livre' sobre a realidade de perigos inéditos.",
                fatal: "FATO REAL: Santiago de Compostela (Espanha, 2013). 79 mortos. Por excesso de confiança no trecho familiar, o condutor entrou em curva a 179km/h.",
                action: "Imagine operar em zona familiar no automático mental. AÇÃO: Use o 'Anotar e Cantar' (Shisa Kanko). A voz força o cérebro a validar a realidade."
            },
            {
                word: "SINAL", gravity: "grave", title: "BOAS PRÁTICAS: DISCIPLINA OPERACIONAL",
                neuro: "O 'Viés de Expectativa' faz o cérebro projetar o verde habitual por antecipação. O sistema visual camufla o vermelho por frações de segundo fatais.",
                fatal: "FATO REAL: Bad Aibling (Alemanha, 2016). 12 mortos. O descumprimento de protocolos por pressuposição resultou em colisão frontal.",
                action: "Imagine um sinal apagado ou aspecto duvidoso. AÇÃO: Na dúvida interpretativa, o protocolo é PARADA ABSOLUTA. Nunca presuma o caminho."
            },
            {
                word: "PRESSA", gravity: "leve", title: "BOAS PRÁTICAS: CONSCIÊNCIA TEMPORAL",
                neuro: "A urgência dispara o 'Sequestro da Amígdala'. O estresse por tempo libera cortisol, causando visão de túnel e desligando o raciocínio crítico.",
                fatal: "FATO REAL: Amagasaki (Japão, 2005). 107 mortos. O condutor acelerou em curva para compensar atraso de 90s. A pressa química bloqueou o senso de perigo.",
                action: "Imagine a urgência para liberar uma zona ou recuperar atraso. AÇÃO: Respire fundo e module o sistema nervoso. A segurança precede o relógio."
            }
        ];

        function boot() {
            let ok = false;
            while (!ok) {
                gridMap = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(''));
                ok = buildGrid();
            }
            junk();
            draw();
        }

        function buildGrid() {
            const list = [...safetyDB].sort((a,b) => b.word.length - a.word.length);
            for (let item of list) {
                let set = false, t = 0;
                while (!set && t < 5000) {
                    let hor = Math.random() > 0.5;
                    let r = Math.floor(Math.random() * (hor ? GRID_SIZE : GRID_SIZE - item.word.length));
                    let c = Math.floor(Math.random() * (hor ? GRID_SIZE - item.word.length : GRID_SIZE));
                    let free = true;
                    for (let i = 0; i < item.word.length; i++) {
                        if (gridMap[hor ? r : r + i][hor ? c + i : c] !== '') free = false;
                    }
                    if (free) {
                        for (let i = 0; i < item.word.length; i++) gridMap[hor ? r : r + i][hor ? c + i : c] = item.word[i];
                        set = true;
                    }
                    t++;
                }
                if (!set) return false;
            }
            return true;
        }

        function junk() {
            const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (gridMap[r][c] === '') gridMap[r][c] = abc[Math.floor(Math.random() * abc.length)];
                }
            }
        }

        function draw() {
            const container = document.getElementById("grid-element");
            container.innerHTML = '';
            gridMap.forEach((row, r) => row.forEach((l, c) => {
                const b = document.createElement("div");
                b.className = "cell"; b.innerText = l;
                b.onclick = () => handle(b, l, r, c);
                container.appendChild(b);
            }));
        }

        function handle(el, l, r, c) {
            if (el.classList.contains('found-grave') || el.classList.contains('found-medio') || el.classList.contains('found-leve')) return;
            if (el.classList.contains('selected')) {
                const i = activeSelection.findIndex(s => s.el === el);
                if (i === activeSelection.length - 1) { el.classList.remove('selected'); activeSelection.pop(); }
                return;
            }
            if (activeSelection.length > 0) {
                const last = activeSelection[activeSelection.length - 1];
                const dr = Math.abs(r - last.r), dc = Math.abs(c - last.c);
                if ((dr > 1 || dc > 1) || (dr === 1 && dc === 1)) return;
                if (activeSelection.length >= 2) {
                    const s1 = activeSelection[0], s2 = activeSelection[1];
                    if (s1.r === s2.r && r !== last.r) return;
                    if (s1.c === s2.c && c !== last.c) return;
                }
            }
            el.classList.add('selected');
            activeSelection.push({el, l, r, c});
            validate();
        }

        function validate() {
            const str = activeSelection.map(s => s.l).join('');
            const rev = [...str].reverse().join('');
            const match = safetyDB.find(p => (p.word === str || p.word === rev) && !foundWords.includes(p.word));
            if (match) {
                const cls = `found-${match.gravity}`;
                activeSelection.forEach(s => { s.el.classList.remove('selected'); s.el.classList.add(cls); });
                foundWords.push(match.word); activeSelection = [];
                document.getElementById("main-count").innerText = `${foundWords.length}/5`;
                updateIntel(match);
            }
        }

        function updateIntel(data) {
            const out = document.getElementById("intel-output");
            const hex = data.gravity === 'grave' ? 'var(--danger)' : data.gravity === 'medio' ? 'var(--warning)' : 'var(--success)';
            out.innerHTML = `
                <div style="color:${hex}; font-weight:800; margin-bottom:12px; font-size:1rem; border-bottom: 2px solid ${hex}; padding-bottom:5px;">
                   [ ! ] DETECTADO: ${data.title}
                </div>
                <div class="intel-card box-neuro"><span class="tag-label">Análise Neural</span>${data.neuro}</div>
                <div class="intel-card box-fatal"><span class="card-label">Fato Histórico</span>${data.fatal}</div>
                <div class="intel-card box-action"><span class="tag-label">Ação Técnica</span>${data.action}</div>
            `;
        }

        function transmitir() {
            if(!document.getElementById("radio-input").value) { alert("Atenção: Registre o relatório operacional antes de transmitir."); return; }
            window.open('https://forms.gle/ut3jDiKRPWSGVXw37');
        }

        boot();
    </script>
</body>
</html>
