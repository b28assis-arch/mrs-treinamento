<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CAÇA-PALAVRAS SEGURANÇA - Sr Assis</title>
    <style>
        :root {
            --mrs-blue: #003399;
            --mrs-yellow: #FFCC00;
            --mrs-green: #28a745;
            --bg-gray: #f4f4f4;
            --cell-size: clamp(25px, 7vw, 35px);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            overflow-x: hidden;
        }

        header {
            background-color: var(--mrs-blue);
            color: white;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        header h1 { margin: 0; font-size: 1.4rem; text-transform: uppercase; }
        header p { margin: 5px 0 0; font-size: 0.8rem; opacity: 0.8; }

        .stats-container {
            width: 90%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
        }

        .stat-box {
            background: white;
            padding: 5px 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-weight: bold;
            color: var(--mrs-blue);
            font-size: 0.8rem;
        }

        /* GRID DO JOGO */
        #grid-board {
            background: white;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 4px;
            touch-action: none; /* Bloqueia scroll para o arraste funcionar */
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background: #fff;
            border: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 1rem;
            border-radius: 4px;
            transition: background 0.1s;
        }

        .cell.selecting { background-color: var(--mrs-yellow); transform: scale(1.1); }
        .cell.found { background-color: var(--mrs-green); color: white; border: none; }

        /* LISTA DE PALAVRAS (ESTILO BOTÃO) */
        #word-tags {
            width: 90%;
            max-width: 500px;
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .tag {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid var(--mrs-blue);
            color: var(--mrs-blue);
            font-weight: bold;
            font-size: 0.75rem;
            background: white;
            transition: 0.3s;
        }

        .tag.done {
            background: var(--mrs-green);
            color: white;
            border-color: var(--mrs-green);
            text-decoration: line-through;
        }

        /* MODAL DE INSIGHTS */
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        #modal {
            background: white;
            width: 85%;
            max-width: 400px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }

        #modal h2 { color: var(--mrs-blue); margin: 0 0 15px; }
        #modal p { font-size: 1rem; line-height: 1.5; color: #444; }
        #modal button {
            background: var(--mrs-blue);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            margin-top: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

<header>
    <h1>Caça-Palavras Segurança</h1>
    <p>Fase Operacional - Maquinista Sr Assis</p>
</header>

<div class="stats-container">
    <div class="stat-box" id="fase-label">Fase: 1/6</div>
    <div class="stat-box" id="progresso-label">Progresso: 0/4</div>
</div>

<div id="grid-board"></div>

<div id="word-tags"></div>

<div id="overlay">
    <div id="modal">
        <h2 id="m-title">INSIGHT</h2>
        <p id="m-body"></p>
        <button onclick="closeModal()">PROSSEGUIR</button>
    </div>
</div>

<script>
    const App = {
        fase: 1,
        encontradas: [],
        selecionadas: [],
        arrastando: false,

        // CONTEÚDO TÉCNICO COMPLETO (6 FASES)
        dados: {
            1: [
                {p: "TRECHO", i: "CONHECIMENTO DO TRECHO: Saiba exatamente onde você está. Antecipar o perfil da via evita frenagens bruscas."},
                {p: "GABARITO", i: "GABARITO: Cuidado com obstruções laterais. O gabarito livre é a garantia de que o trem passa sem impactos."},
                {p: "BRITA", i: "BRITA: Atenção ao caminhar no pátio. Terrenos irregulares são os maiores causadores de entorses."},
                {p: "DORMER", i: "DORMENTES: A base da via. Verifique o estado dos dormentes para garantir a estabilidade do rodeiro."}
            ],
            2: [
                {p: "AGULHA", i: "AGULHA: Regra da Fresta! 3mm de abertura já causam arrombamento. Verifique sempre antes de operar o AMV."},
                {p: "JACARE", i: "JACARÉ: Visualize a rota. O choque de ponta no jacaré ocorre quando a agulha não está totalmente firme."},
                {p: "CONTRATRILHO", i: "CONTRATRILHO: O guia da roda. Verifique fixações soltas que podem comprometer o gabarito na transposição."},
                {p: "MAQUINA", i: "SHISA KANKO: Aponte e fale! Confirme visualmente a posição da chave antes de autorizar o movimento."}
            ],
            3: [
                {p: "ASPECTO", i: "VISÃO PERIFÉRICA: Não confie no hábito. Reconfirme o dado real do sinal antes de agir. O verde de 'ontem' não vale hoje."},
                {p: "DISTANCIA", i: "TEMPO DE CICLO: Planeje a parada mental muito antes do dado numérico ficar crítico no visor do computador de bordo."},
                {p: "COMUNICA", i: "ESCUTA EMPÁTICA: Não absorva a pressa do rádio. Processe a informação e repita. A autoridade final é sua."},
                {p: "EXPECTATIVA", i: "MENTE DE PRINCIPIANTE: Trate cada autorização de movimento como se fosse a primeira. O excesso de confiança mata."}
            ],
            4: [
                {p: "CONFIANCA", i: "AUTOCONFIANÇA: O perigo mora na experiência. Profissionais antigos tendem a ignorar riscos que novatos respeitam."},
                {p: "PRESSA", i: "A PRESSA É UMA EMOÇÃO: Se sentir urgência, pare e vocalize seu estado. A pressa causa a 'visão de túnel'."},
                {p: "PERCEPCAO", i: "OLHAR DE TURISTA: Veja o pátio como se fosse a primeira vez. Busque o que mudou no cenário desde a última viagem."},
                {p: "LINHA", i: "LINHA DE FOGO: Antecipação! Visualize onde a energia será liberada (engates, mangueiras) antes de se posicionar."}
            ],
            5: [
                {p: "ALIVIO", i: "ALÍVIO BRUSCO (6.3.3): Reduza o esforço gradualmente (>10s). Evita o choque entre engates que o SIC monitora."},
                {p: "CICLAGEM", i: "CICLAGEM (6.3.11): Aguarde min. 30s após o alívio para nova aplicação. Garante a recarga vital do encanamento geral."},
                {p: "DINAMICO", i: "DINÂMICO (6.3.6): Use o Freio Dinâmico ANTES do Automático. O SIC audita o equilíbrio das forças de frenagem."},
                {p: "INCORRETO", i: "MFI INCORRETO (6.3.32): Independente aliviado em circulação evita superaquecimento de rodas e desvios de conceito."}
            ],
            6: [
                {p: "MANOBRA", i: "VELOCIDADE DE MANOBRA: Respeite o limite do pátio. Garante parada em metade da distância visível e evita incidentes."},
                {p: "RADIO", i: "CONTAGEM DE DISTÂNCIA: Informe o espaço em vagões. O silêncio no rádio exige parada imediata. Sem 'vem vindo'."},
                {p: "ESTACIONA", i: "GARANTIA DE ESTACIONAMENTO: SHISA KANKO! Aponte e diga: 'Sapata colada, corrente tensionada'. O visual é a lei."},
                {p: "PN", i: "PASSAGEM EM NÍVEL: Gerenciamento de Risco. Antecipe a falha do terceiro. Reduza preventivamente se houver dúvida."}
            ]
        },

        init() {
            this.buildGrid();
            this.bindEvents();
        },

        buildGrid() {
            const board = document.getElementById('grid-board');
            const tags = document.getElementById('word-tags');
            board.innerHTML = ''; tags.innerHTML = '';
            
            // Gerar 144 células (12x12)
            const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for(let i=0; i<144; i++) {
                let c = document.createElement('div');
                c.className = 'cell';
                c.innerText = abc[Math.floor(Math.random()*26)];
                board.appendChild(c);
            }

            // Tags da fase
            this.dados[this.fase].forEach(o => {
                let t = document.createElement('div');
                t.className = 'tag';
                t.id = 'tag-' + o.p;
                t.innerText = o.p;
                tags.appendChild(t);
            });
            document.getElementById('fase-label').innerText = `Fase: ${this.fase}/6`;
        },

        bindEvents() {
            const b = document.getElementById('grid-board');
            
            const onStart = (e) => {
                this.arrastando = true;
                this.selecionadas = [];
                this.handleMove(e);
            };

            const onMove = (e) => {
                if(!this.arrastando) return;
                e.preventDefault();
                const touch = e.touches ? e.touches[0] : e;
                const cell = document.elementFromPoint(touch.clientX, touch.clientY);
                if(cell && cell.classList.contains('cell') && !this.selecionadas.includes(cell)) {
                    cell.classList.add('selecting');
                    this.selecionadas.push(cell);
                }
            };

            const onEnd = () => {
                this.arrastando = false;
                const word = this.selecionadas.map(c => c.innerText).join('');
                this.check(word);
                this.selecionadas.forEach(c => c.classList.remove('selecting'));
            };

            b.addEventListener('mousedown', onStart);
            window.addEventListener('mousemove', onMove);
            window.addEventListener('mouseup', onEnd);
            b.addEventListener('touchstart', onStart, {passive: false});
            b.addEventListener('touchmove', onMove, {passive: false});
            b.addEventListener('touchend', onEnd);
        },

        check(w) {
            const rev = w.split('').reverse().join('');
            const found = this.dados[this.fase].find(o => o.p === w || o.p === rev);
            
            if(found && !this.encontradas.includes(found.p)) {
                this.encontradas.push(found.p);
                this.selecionadas.forEach(c => c.classList.add('found'));
                document.getElementById('tag-' + found.p).classList.add('done');
                this.showInsight(found.p, found.i);
                this.updateProgresso();
            }
        },

        showInsight(t, b) {
            document.getElementById('m-title').innerText = t;
            document.getElementById('m-body').innerText = b;
            document.getElementById('overlay').style.display = 'flex';
        },

        updateProgresso() {
            document.getElementById('progresso-label').innerText = `Progresso: ${this.encontradas.length}/4`;
            if(this.encontradas.length === 4) {
                setTimeout(() => {
                    this.sendToForms();
                    if(this.fase < 6) {
                        this.fase++; this.encontradas = [];
                        this.buildGrid();
                    } else {
                        alert("TREINAMENTO CONCLUÍDO! Parabéns, Sr Assis.");
                    }
                }, 1000);
            }
        },

        sendToForms() {
            // Sincronização com o Google Forms (Backend)
            const url = "URL_DO_SEU_FORMS_AQUI";
            console.log("Fase " + this.fase + " concluída. Enviando dados...");
        }
    };

    function closeModal() { document.getElementById('overlay').style.display = 'none'; }
    window.onload = () => App.init();
</script>
</body>
</html>
