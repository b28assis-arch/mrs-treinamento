<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRS - Treinamento Operacional</title>
    <style>
        :root {
            --primary: #0b3a6f; --accent: #ffcc00; --cell-bg: #ffffff;
            --selected: #5dade2; --danger: #e74c3c; --warning: #f1c40f;
            --info: #2ecc71; --dark: #1a252f;
        }
        body {
            margin: 0; font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--dark) 100%);
            color: #fff; text-align: center; padding: 10px; min-height: 100vh;
        }
        .header-game {
            background: rgba(255, 255, 255, 0.05); padding: 15px;
            border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1);
        }
        h2 { margin: 0; font-size: 1.1rem; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); }
        .progresso-container { margin-top: 5px; font-weight: bold; font-size: 0.9rem; }
        .contador-bolinha { background: rgba(0,0,0,0.3); padding: 2px 10px; border-radius: 20px; border: 1px solid var(--accent); }
        .legenda-container { 
            max-width: 460px; margin: 10px auto; text-align: center; 
            background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px;
        }
        .legenda-item { padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .leg-verde { background: var(--info); color: #fff; }
        .leg-amarelo { background: var(--warning); color: #000; }
        .leg-vermelho { background: var(--danger); color: #fff; }
        .grid {
            display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px;
            max-width: 460px; margin: 10px auto; background: rgba(0,0,0,0.2);
            padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
        }
        .cell {
            aspect-ratio: 1; background: var(--cell-bg); color: var(--primary);
            display: flex; align-items: center; justify-content: center;
            border-radius: 3px; font-weight: 800; font-size: 0.75rem; cursor: pointer; user-select: none;
        }
        .selected { background: var(--selected) !important; color: #fff !important; }
        .found-grave { background: var(--danger) !important; color: #fff !important; }
        .found-medio { background: var(--warning) !important; color: #000 !important; }
        .found-leve { background: var(--info) !important; color: #fff !important; }
        .btn-next { 
            background: var(--accent); color: var(--primary); display: none; 
            width: 100%; max-width: 460px; margin: 15px auto; padding: 16px; 
            font-size: 1rem; font-weight: 800; border-radius: 8px; cursor: pointer; border: none;
        }
        .controles { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .btn-aux { border: none; padding: 8px 12px; border-radius: 5px; font-weight: 700; cursor: pointer; font-size: 0.7rem; text-transform: uppercase; }
        #resultado { max-width: 460px; margin: 15px auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 20px; }
        .insight { padding: 12px; border-radius: 8px; text-align: left; font-size: 0.85rem; border-left: 6px solid rgba(0,0,0,0.3); animation: slideIn 0.3s; }
        .grave { background: var(--danger); color: #fff; } .medio { background: var(--warning); color: #000; } .leve { background: var(--info); color: #fff; }
        .btn-forms { background: #2ecc71; color: white; padding: 15px; border-radius: 8px; text-decoration: none; display: inline-block; margin-top: 10px; font-weight: bold; border: 2px solid #fff; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="header-game">
        <h2 id="fase-titulo">Carregando Trilha Técnica...</h2>
        <div class="progresso-container">
            Palavras: <span class="contador-bolinha" id="contador-txt">0 / 0</span>
        </div>
    </div>

    <div class="legenda-container" id="painel-legenda"></div>

    <div class="controles">
        <button class="btn-aux" style="background:#fff; color:var(--primary)" onclick="limparSelecao()">Limpar Seleção</button>
        <button class="btn-aux" style="background:var(--danger); color:#fff" onclick="reiniciarTrilha()">Reiniciar Trilha</button>
    </div>

    <div class="grid" id="grid-box"></div>

    <button class="btn-next" id="btn-next" onclick="proximaFase()">PRÓXIMO NÍVEL ➔</button>

    <div id="resultado"></div>

    <a href="https://forms.gle/ut3jDiKRPWSGVXw37" target="_blank" class="btn-forms">📋 ENVIAR RELATÓRIO AO FORMS</a>

<script>
    const SIZE = 13;
    let selecionadas = [], encontradas = [], gridData = [], faseAtual = 1;

    const bancoFases = {
        1: {
            titulo: "Fase 1: Segurança Geral",
            palavras: [
                {txt: "SEGURANCA", nome: "SEGURANÇA", nivel: "grave", dica: "A base de toda operação. Retorno seguro para casa."},
                {txt: "ATENCAO", nome: "ATENÇÃO", nivel: "grave", dica: "Foco total 360° no ambiente ferroviário."},
                {txt: "TRECHO", nome: "TRECHO", nivel: "medio", dica: "Conhecimento do perfil e pontos críticos da via."},
                {txt: "MARCO", nome: "MARCO", nivel: "medio", dica: "Localização exata via quilometragem física."},
                {txt: "ROTINA", nome: "ROTINA", nivel: "leve", dica: "Cuidado com o piloto automático que gera desvios."},
                {txt: "GABARITO", nome: "GABARITO", nivel: "leve", dica: "Espaço livre lateral para circulação segura."}
            ]
        },
        2: {
            titulo: "Fase 2: Quebra de Chave (AMV)",
            palavras: [
                {txt: "AGULHA", nome: "AGULHA", nivel: "grave", dica: "Regra da fresta: 3mm causam arrombamento."},
                {txt: "JACARE", nome: "JACARÉ", nivel: "grave", dica: "Ponto crítico de transposição do rodeiro no AMV."},
                {txt: "SHISAKANKO", nome: "SHISA KANKO", nivel: "grave", dica: "Técnica de apontar e falar para confirmar rota."},
                {txt: "MAQUINA", nome: "MÁQUINA", nivel: "medio", dica: "Verificação da fidelidade da posição da chave."},
                {txt: "TRAVAMENTO", nome: "TRAVAMENTO", nivel: "medio", dica: "Bloqueio físico obrigatório para movimentação."},
                {txt: "CONTRATRILHO", nome: "CONTRATRILHO", nivel: "leve", dica: "Guia que garante o direcionamento do rodeiro."}
            ]
        },
        3: {
            titulo: "Fase 3: Avanço de Sinal",
            palavras: [
                {txt: "ASPECTO", nome: "ASPECTO", nivel: "grave", dica: "Confirmação real do sinal luminoso de campo."},
                {txt: "AVANCO", nome: "AVANÇO", nivel: "grave", dica: "Transposição de sinal restritivo sem licença."},
                {txt: "DISTANCIA", nome: "DISTÂNCIA", nivel: "grave", dica: "Planejamento da parada mental antecipada."},
                {txt: "COMUNICA", nome: "COMUNICAÇÃO", nivel: "medio", dica: "Escuta ativa e repetição clara de ordens do CCO."},
                {txt: "EXPECTATIVA", nome: "EXPECTATIVA", nivel: "medio", dica: "Não projete o verde; confirme o que seus olhos veem."}
            ]
        },
        4: {
            titulo: "Fase 4: Acidentes Pessoais",
            palavras: [
                {txt: "CONFIANCA", nome: "AUTOCONFIANÇA", nivel: "grave", dica: "Excesso de experiência que ignora riscos básicos."},
                {txt: "PRESSA", nome: "PRESSA", nivel: "grave", dica: "Emoção que atropela procedimentos de segurança."},
                {txt: "PERCEPCAO", nome: "PERCEPÇÃO", nivel: "grave", dica: "Olhar de turista: buscar o que mudou no cenário."},
                {txt: "LINHA", nome: "LINHA DE FOGO", nivel: "medio", dica: "Zona de perigo onde a energia é liberada."}
            ]
        },
        5: {
            titulo: "Fase 5: Parâmetros SIC (POP-0018)",
            palavras: [
                {txt: "ALIVIO", nome: "ALÍVIO", nivel: "grave", dica: "Redução gradual de tração para evitar choque."},
                {txt: "CICLAGEM", nome: "CICLAGEM", nivel: "grave", dica: "Tempo técnico para recarga do encanamento geral."},
                {txt: "DINAMICO", nome: "DINÂMICO", nivel: "grave", dica: "Uso prioritário antes do freio automático."},
                {txt: "CORRENTE", nome: "CORRENTE", nivel: "medio", dica: "Monitoramento de amperagem para proteção de motores."},
                {txt: "FRENAGEM", nome: "FRENAGEM", nivel: "medio", dica: "Gestão da velocidade conforme o perfil da via."}
            ]
        },
        6: {
            titulo: "Fase 6: Manobras (MOF)",
            palavras: [
                {txt: "MANOBRA", nome: "MANOBRA", nivel: "grave", dica: "Velocidade reduzida para parada em meia distância."},
                {txt: "RADIO", nome: "RÁDIO", nivel: "grave", dica: "Contagem de distância obrigatória via rádio."},
                {txt: "ESTACIONA", nome: "ESTACIONA", nivel: "grave", dica: "Garantia: sapata colada e corrente tensionada."},
                {txt: "PN", nome: "PASSAGEM NÍVEL", nivel: "medio", dica: "Atenção máxima em cruzamentos rodoferroviários."},
                {txt: "SAPATA", nome: "SAPATA", nivel: "medio", dica: "Verificação visual da imobilização do vagão."}
            ]
        }
    };

    function init() {
        selecionadas = []; encontradas = [];
        document.getElementById("resultado").innerHTML = "";
        document.getElementById("btn-next").style.display = "none";
        
        let pronto = false;
        while (!pronto) { 
            gridData = Array(SIZE).fill(null).map(() => Array(SIZE).fill('')); 
            pronto = distribuirPalavras(); 
        }
        preencherLixo(); desenhar(); atualizarUI();
    }

    function distribuirPalavras() {
        const lista = [...bancoFases[faseAtual].palavras].sort(() => Math.random() - 0.5);
        for (let p of lista) {
            let colocada = false, tentativas = 0;
            while (!colocada && tentativas < 2000) {
                let h = Math.random() > 0.5, 
                    r = Math.floor(Math.random() * (h ? SIZE : SIZE - p.txt.length)), 
                    c = Math.floor(Math.random() * (h ? SIZE - p.txt.length : SIZE));
                if (podeColocar(p.txt, r, c, h)) {
                    for (let i = 0; i < p.txt.length; i++) gridData[h ? r : r + i][h ? c + i : c] = p.txt[i];
                    colocada = true;
                }
                tentativas++;
            }
            if (!colocada) return false;
        }
        return true;
    }

    function podeColocar(p, r, c, h) {
        for (let i = 0; i < p.length; i++) {
            let currR = h ? r : r + i, currC = h ? c + i : c;
            if (gridData[currR][currC] !== '' && gridData[currR][currC] !== p[i]) return false;
        }
        return true;
    }

    function preencherLixo() { 
        const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"; 
        for (let r = 0; r < SIZE; r++) 
            for (let c = 0; c < SIZE; c++) 
                if (gridData[r][c] === '') gridData[r][c] = abc[Math.floor(Math.random() * abc.length)]; 
    }

    function desenhar() {
        const container = document.getElementById("grid-box"); container.innerHTML = '';
        gridData.forEach((row, r) => row.forEach((letra, c) => {
            const div = document.createElement("div"); div.className = "cell"; div.innerText = letra;
            div.onclick = () => clicarCelula(div, letra, r, c); container.appendChild(div);
        }));
    }

    function clicarCelula(el, letra, r, c) {
        if (el.classList.contains('found-grave') || el.classList.contains('found-medio') || el.classList.contains('found-leve')) return;
        if (el.classList.contains('selected')) { 
            el.classList.remove('selected'); 
            selecionadas = selecionadas.filter(s => s.el !== el);
            return; 
        }
        el.classList.add('selected'); selecionadas.push({el, letra, r, c});
        verificarJogo();
    }

    function verificarJogo() {
        const palavraFormada = selecionadas.map(s => s.letra).join('');
        const alvo = bancoFases[faseAtual].palavras.find(p => p.txt === palavraFormada && !encontradas.includes(p.txt));
        if (alvo) {
            selecionadas.forEach(s => { 
                s.el.classList.remove('selected'); 
                s.el.classList.add(`found-${alvo.nivel}`); 
            });
            encontradas.push(alvo.txt);
            document.getElementById("resultado").innerHTML = `<div class="insight ${alvo.nivel}"><strong>✔ ${alvo.nome}</strong>: ${alvo.dica}</div>` + document.getElementById("resultado").innerHTML;
            selecionadas = [];
            atualizarUI();
            if (encontradas.length === bancoFases[faseAtual].palavras.length) {
                document.getElementById("btn-next").style.display = "block";
            }
        }
    }

    function atualizarUI() {
        document.getElementById("fase-titulo").innerText = bancoFases[faseAtual].titulo;
        document.getElementById("contador-txt").innerText = `${encontradas.length} / ${bancoFases[faseAtual].palavras.length}`;
        const painel = document.getElementById("painel-legenda");
        const graves = bancoFases[faseAtual].palavras.filter(p => p.nivel === 'grave').map(p => p.nome).join(' • ');
        const medios = bancoFases[faseAtual].palavras.filter(p => p.nivel === 'medio').map(p => p.nome).join(' • ');
        const leves = bancoFases[faseAtual].palavras.filter(p => p.nivel === 'leve').map(p => p.nome).join(' • ');
        painel.innerHTML = `
            <div class="legenda-item leg-vermelho">${graves}</div>
            <div class="legenda-item leg-amarelo">${medios}</div>
            <div class="legenda-item leg-verde">${leves}</div>
        `;
    }

    function proximaFase() {
        if (faseAtual < 6) { faseAtual++; init(); } 
        else { alert("Trilha Técnica MRS Concluída com Sucesso!"); }
    }

    function limparSelecao() { 
        document.querySelectorAll('.cell.selected').forEach(c => c.classList.remove('selected'));
        selecionadas = []; 
    }

    function reiniciarTrilha() { if(confirm("Deseja reiniciar todo o treinamento técnico?")) { faseAtual = 1; init(); } }

    window.onload = init;
</script>
</body>
</html>
