<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRS - Trilha de Conhecimento Operacional</title>
    <style>
        :root {
            --primary: #0b3a6f; --accent: #ffcc00; --cell-bg: #ffffff;
            --selected: #5dade2; --danger: #e74c3c; --warning: #f1c40f;
            --info: #2ecc71; --dark: #1a252f;
        }
        body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, var(--primary) 0%, var(--dark) 100%); color: #fff; text-align: center; padding: 10px; min-height: 100vh; }
        .header-game { background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 12px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); }
        h2 { margin: 0; font-size: 1.1rem; text-transform: uppercase; color: var(--accent); letter-spacing: 1px;}
        .progresso-container { margin-top: 5px; font-weight: bold; font-size: 0.9rem; }
        .contador-bolinha { background: rgba(0,0,0,0.3); padding: 2px 10px; border-radius: 20px; border: 1px solid var(--accent); }
        .legenda-container { max-width: 460px; margin: 10px auto 15px auto; text-align: center; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 10px; }
        .legenda-item { padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .leg-verde { background: var(--info); color: #fff; }
        .leg-amarelo { background: var(--warning); color: #000; }
        .leg-vermelho { background: var(--danger); color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; max-width: 460px; margin: 10px auto; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; }
        .cell { aspect-ratio: 1; background: var(--cell-bg); color: var(--primary); display: flex; align-items: center; justify-content: center; border-radius: 3px; font-weight: 800; font-size: 0.75rem; cursor: pointer; }
        .selected { background: var(--selected) !important; color: #fff !important; }
        .found-grave { background: var(--danger) !important; color: #fff !important; }
        .found-medio { background: var(--warning) !important; color: #000 !important; }
        .found-leve { background: var(--info) !important; color: #fff !important; }
        .btn-next { background: var(--accent); color: var(--primary); display: none; width: 100%; max-width: 460px; margin: 15px auto; padding: 16px; font-size: 1rem; font-weight: 800; border-radius: 8px; cursor: pointer; border: none; box-shadow: 0 4px 0 #b38f00;}
        .controles { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .btn-aux { border: none; padding: 8px 12px; border-radius: 5px; font-weight: 700; cursor: pointer; font-size: 0.7rem; }
        
        /* SEÇÃO DE ANÁLISE / FORMS */
        .analise-section { max-width: 460px; margin: 25px auto; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; text-align: left; border: 1px solid rgba(255,255,255,0.1); box-sizing: border-box; }
        .analise-section h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: var(--accent); text-transform: uppercase; }
        textarea { width: 100%; height: 70px; border-radius: 8px; border: none; padding: 10px; box-sizing: border-box; font-family: inherit; margin-bottom: 10px; background: #eee; color: #333; }
        .btn-box { display: flex; justify-content: space-between; gap: 10px; }
        .btn-acao { background: var(--primary); color: #fff; border: 1px solid var(--accent); padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.75rem; flex: 1; }
        .btn-forms { background: #2ecc71; color: #fff; border: none; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 0.75rem; flex: 1; }
        
        #resultado { max-width: 460px; margin: 15px auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 30px;}
        .insight { padding: 12px; border-radius: 8px; text-align: left; font-size: 0.85rem; border-left: 6px solid rgba(0,0,0,0.3); }
        .grave { background: var(--danger); color: #fff; } .medio { background: var(--warning); color: #000; } .leve { background: var(--info); color: #fff; }
    </style>
</head>
<body>
    <div class="header-game">
        <h2 id="fase-titulo">Fase 01: Conceitos Gerais</h2>
        <div class="progresso-container">Palavras: <span class="contador-bolinha" id="contador-txt">0 / 9</span></div>
    </div>
    <div class="legenda-container" id="painel-legenda"></div>
    <div class="controles">
        <button class="btn-aux" style="background:#fff; color:var(--primary)" id="btn-reset">Limpar Seleção</button>
        <button class="btn-aux" style="background:var(--danger); color:#fff" id="btn-master">Reiniciar Trilha</button>
    </div>
    <div class="grid" id="grid-box"></div>
    <button class="btn-next" id="btn-next">PRÓXIMO NÍVEL ➔</button>

    <div class="analise-section">
        <h3>📊 Banco de Dados Operacional</h3>
        <p style="font-size: 0.7rem; margin-bottom: 8px; opacity: 0.8;">Registre observações técnicas sobre o fator humano observadas em campo.</p>
        <textarea id="input-comentario" placeholder="Descreva um compromisso ou desvio observado..."></textarea>
        <div class="btn-box">
            <button class="btn-acao" onclick="salvarComentario()">Registrar Fator</button>
            <button class="btn-forms" onclick="abrirForms()">Enviar ao Forms</button>
        </div>
        <div id="lista-comentarios" style="margin-top:10px; font-size:0.75rem; color:var(--accent)"></div>
    </div>

    <div id="resultado"></div>

    <script>
        const SIZE = 13;
        let selecionadas = [], encontradas = [], gridData = [], faseAtual = 1;

        const fasesPalavras = {
            1: [
                {txt: "AUTOCONTROLE", nome: "AUTOCONTROLE", nivel: "grave", dica: "A pressa é uma decisão consciente de ignorar a segurança. Domine a impulsividade."},
                {txt: "VIGILANCIA", nome: "VIGILÂNCIA", nivel: "grave", dica: "Mantenha a atenção ativa mesmo em rotinas repetitivas."},
                {txt: "CONDUTA", nome: "CONDUTA", nivel: "grave", dica: "A segurança não é um manual, é um valor inegociável."},
                {txt: "HABITUACAO", nome: "HABITUAÇÃO", nivel: "medio", dica: "O perigo de se acostumar com o risco. O trilho nunca fica seguro."},
                {txt: "PERCEPCAO", nome: "PERCEPÇÃO", nivel: "medio", dica: "Ver não é observar. Treine seus olhos para o desvio sutil."},
                {txt: "FADIGA", nome: "FADIGA", nivel: "medio", dica: "Reconhecer o próprio cansaço é ferramenta técnica de segurança."},
                {txt: "PROATIVO", nome: "PROATIVO", nivel: "leve", dica: "Corrigir o risco antes que ele se torne um boletim de acidente."},
                {txt: "ROTINA", nome: "ROTINA", nivel: "leve", dica: "Onde o erro se esconde. Trate cada turno como o primeiro."},
                {txt: "ZELO", nome: "ZELO", nivel: "leve", dica: "Cuidado com o ativo e com a vida além do regulamento."}
            ],
            2: [
                {txt: "GABARITO", nome: "GABARITO", nivel: "grave", dica: "O corpo não reconhece o perigo do ativo silencioso. Respeite o limite."},
                {txt: "VISAO360", nome: "VISÃO 360°", nivel: "grave", dica: "Escanear o ambiente além da tarefa imediata a cada 2 minutos."},
                {txt: "FOCOESTREITO", nome: "FOCO ESTREITO", nivel: "grave", dica: "Estar muito concentrado em algo impede de ver o trem adjacente."},
                {txt: "DISTRACAO", nome: "DISTRAÇÃO", nivel: "medio", dica: "Celular ou conversas paralelas: o cérebro não é multitarefa."},
                {txt: "INTERRUPCAO", nome: "INTERRUPÇÃO", nivel: "medio", dica: "Se for interrompido, reinicie o protocolo. A memória falha no retorno."},
                {txt: "AUDICAO", nome: "AUDIÇÃO", nivel: "medio", dica: "O protetor não deve anular sua percepção sonora do ambiente."},
                {txt: "TRAJETO", nome: "TRAJETO SEGURO", nivel: "leve", dica: "Caminhar apenas em locais permitidos, fora da movimentação."},
                {txt: "POSTURA", nome: "POSTURA", nivel: "leve", dica: "A forma como você se posiciona dita seu tempo de reação."},
                {txt: "EQUIPE", nome: "OLHAR O PAR", nivel: "leve", dica: "Você é responsável pelo colega que entrou no gabarito."}
            ],
            3: [
                {txt: "VIES", nome: "VIÉS", nivel: "grave", dica: "Não veja o que espera ver (Verde). Veja o que o sinal realmente mostra."},
                {txt: "EXPECTATIVA", nome: "EXPECTATIVA", nivel: "grave", dica: "O erro ocorre ao mentalizar a via livre antes de confirmá-la."},
                {txt: "MARGEM", nome: "MARGEM", nivel: "grave", dica: "Pare sempre antes. Confiar na frenagem final é ignorar a física."},
                {txt: "MONOTONIA", nome: "MONOTONIA", nivel: "medio", dica: "Em trechos longos, o cérebro cria imagens falsas. Quebre o padrão."},
                {txt: "CONFIRMACAO", nome: "CONFIRMAÇÃO", nivel: "medio", dica: "A dúvida é sua amiga. Sem certeza, trate como parada absoluta."},
                {txt: "ESTRESSE", nome: "ESTRESSE", nivel: "medio", dica: "Sob pressão o campo visual diminui. Retome a consciência."},
                {txt: "CHAMADA", nome: "CHAMADA", nivel: "leve", dica: "A repetição no rádio fixa a realidade e evita a ilusão mental."},
                {txt: "RECONHECER", nome: "RECONHECER", nivel: "leve", dica: "Identificar o sinal à distância e planejar a reação antecipada."},
                {txt: "ALERTA", nome: "ALERTA", nivel: "leve", dica: "O som do sistema é um lembrete para sua mente voltar para a cabine."}
            ],
            4: [
                {txt: "ENCOSTO", nome: "ENCOSTO", nivel: "grave", dica: "A falha humana aqui é o achismo. Verifique o encosto positivamente."},
                {txt: "MEMORIA", nome: "MEMÓRIA", nivel: "grave", dica: "A memória operacional é curta. Travamento exige foco total."},
                {txt: "REDUNDANCIA", nome: "REDUNDÂNCIA", nivel: "grave", dica: "Fator Humano: Olhar, tocar e conferir. 3 sentidos contra 1 erro."},
                {txt: "PRESSAO", nome: "PRESSÃO", nivel: "medio", dica: "Não agilize a manobra. O tempo da segurança é o do encosto."},
                {txt: "AUTOMATISMO", nome: "AUTOMATISMO", nivel: "medio", dica: "O maior inimigo. Fazer sem pensar leva à agulha entreaberta."},
                {txt: "VERBALIZAR", nome: "VERBALIZAR", nivel: "medio", dica: "Falar 'Agulha colada' reforça a memória de execução."},
                {txt: "LIMPEZA", nome: "LIMPEZA", nivel: "leve", dica: "Detritos na agulha induzem ao erro de percepção de fechamento."},
                {txt: "ALINHAR", nome: "ALINHAR", nivel: "leve", dica: "O alinhamento mental precede o físico. Planeje a rota antes."},
                {txt: "CHAVE", nome: "CHAVE", nivel: "leve", dica: "A ferramenta só funciona se a mente do operador estiver presente."}
            ],
            5: [
                {txt: "GRAVACAO", nome: "GRAVAÇÃO", nivel: "grave", dica: "O SIC não é punição, é o espelho do seu comportamento operacional."},
                {txt: "PADRAO", nome: "PADRÃO", nivel: "grave", dica: "A inovação é manter a mesma condução com ou sem supervisão."},
                {txt: "DESVIO", nome: "DESVIO", nivel: "grave", dica: "Pequenos desvios aceitáveis hoje são acidentes amanhã."},
                {txt: "TELEMETRIA", nome: "TELEMETRIA", nivel: "medio", dica: "Os dados mostram a intenção do maquinista nos comandos."},
                {txt: "CORRECAO", nome: "CORREÇÃO", nivel: "medio", dica: "Aprender com o gráfico para ajustar a sensibilidade da mão."},
                {txt: "VELOCIDADE", nome: "VELOCIDADE", nivel: "medio", dica: "Respeitar a VMA é prova de maturidade e controle emocional."},
                {txt: "EVENTO", nome: "EVENTO", nivel: "leve", dica: "Cada registro é oportunidade de melhoria antes da falha real."},
                {txt: "FEEDBACK", nome: "FEEDBACK", nivel: "leve", dica: "Ouvir a coordenação para calibrar sua percepção de risco."},
                {txt: "HISTORICO", nome: "HISTÓRICO", nivel: "leve", dica: "Sua carreira é a consistência dos seus gráficos."}
            ],
            6: [
                {txt: "INTEGRIDADE", nome: "INTEGRIDADE", nivel: "grave", dica: "O MOF 2025 foca na integridade do sistema via fator humano."},
                {txt: "RESPONSAVEL", nome: "RESPONSÁVEL", nivel: "grave", dica: "No final, a segurança depende da sua decisão na cabine."},
                {txt: "NORMA", nome: "NORMA", nivel: "grave", dica: "A norma protege você quando o instinto falha."},
                {txt: "PROCEDIMENTO", nome: "PROCEDIMENTO", nivel: "medio", dica: "Seguir o passo a passo evita que o cérebro pule etapas."},
                {txt: "ATUALIZAR", nome: "ATUALIZAR", nivel: "medio", dica: "Conhecimento técnico que não se renova vira vício operacional."},
                {txt: "DOMINIO", nome: "DOMÍNIO", nivel: "medio", dica: "Conhecer o manual para agir em condições degradadas."},
                {txt: "CONSULTA", nome: "CONSULTA", nivel: "leve", dica: "Na dúvida, consulte. O erro por orgulho é o mais difícil."},
                {txt: "CLAREZA", nome: "CLAREZA", nivel: "leve", dica: "Comunicação clara evita interpretações perigosas."},
                {txt: "EFICIENCIA", nome: "EFICIÊNCIA", nivel: "leve", dica: "Operar no tempo certo com segurança máxima."}
            ]
        };

        function init() {
            let pronto = false;
            while (!pronto) { gridData = Array(SIZE).fill(null).map(() => Array(SIZE).fill('')); pronto = distribuirPalavras(); }
            preencherLixo(); desenhar(); atualizarUI();
        }

        function distribuirPalavras() {
            const lista = [...fasesPalavras[faseAtual]].sort(() => Math.random() - 0.5);
            for (let p of lista) {
                let colocada = false, tentativas = 0;
                while (!colocada && tentativas < 3000) {
                    let h = Math.random() > 0.5, r = Math.floor(Math.random() * (h ? SIZE : SIZE - p.txt.length)), c = Math.floor(Math.random() * (h ? SIZE - p.txt.length : SIZE));
                    if (podeColocar(p.txt, r, c, h)) {
                        for (let i = 0; i < p.txt.length; i++) gridData[h ? r : r + i][h ? c + i : c] = p.txt[i];
                        colocada = true;
                    }
                    tentativas++;
                }
                if (!colocada) return false;
            }
            return true;
        }

        function podeColocar(p, r, c, h) {
            for (let i = -1; i <= p.length; i++) {
                for (let j = -1; j <= 1; j++) {
                    let currR = h ? r + j : r + i, currC = h ? c + i : c + j;
                    if (currR >= 0 && currR < SIZE && currC >= 0 && currC < SIZE) {
                        if (i >= 0 && i < p.length && j === 0) { if (gridData[currR][currC] !== '' && gridData[currR][currC] !== p[i]) return false; }
                        else if (i >= 0 && i < p.length && gridData[currR][currC] !== '') return false;
                    }
                }
            }
            return true;
        }

        function preencherLixo() { const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"; for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (gridData[r][c] === '') gridData[r][c] = abc[Math.floor(Math.random() * abc.length)]; }

        function desenhar() {
            const container = document.getElementById("grid-box"); container.innerHTML = '';
            gridData.forEach((row, r) => row.forEach((letra, c) => {
                const div = document.createElement("div"); div.className = "cell"; div.innerText = letra;
                div.onclick = () => clicarCelula(div, letra, r, c); container.appendChild(div);
            }));
        }

        function clicarCelula(el, letra, r, c) {
            if (el.classList.contains('found-grave') || el.classList.contains('found-medio') || el.classList.contains('found-leve')) return;
            if (el.classList.contains('selected')) { if (selecionadas.length > 0 && selecionadas[selecionadas.length - 1].el === el) { el.classList.remove('selected'); selecionadas.pop(); } return; }
            if (selecionadas.length > 0) {
                const last = selecionadas[selecionadas.length - 1];
                if (Math.abs(r - last.r) > 1 || Math.abs(c - last.c) > 1 || (Math.abs(r - last.r) === 1 && Math.abs(c - last.c) === 1)) return;
                if (selecionadas.length >= 2) {
                    const first = selecionadas[0], second = selecionadas[1];
                    if (first.r === second.r && r !== last.r) return; if (first.r !== second.r && c !== last.c) return;
                }
            }
            el.classList.add('selected'); selecionadas.push({el, letra, r, c}); verificarJogo();
        }

        function verificarJogo() {
            const palavraFormada = selecionadas.map(s => s.letra).join('');
            const alvo = fasesPalavras[faseAtual].find(p => p.txt === palavraFormada && !encontradas.includes(p.txt));
            if (alvo) {
                selecionadas.forEach(s => { s.el.classList.remove('selected'); s.el.classList.add(alvo.nivel === 'grave' ? 'found-grave' : alvo.nivel === 'medio' ? 'found-medio' : 'found-leve'); });
                encontradas.push(alvo.txt); exibirInsight(alvo); selecionadas = []; atualizarUI(); checarFimFase();
            }
        }

        function exibirInsight(p) {
            const res = document.getElementById("resultado");
            const card = document.createElement("div"); card.className = `insight ${p.nivel}`;
            card.innerHTML = `<strong>✔ ${p.nome}</strong>: ${p.dica}`; res.prepend(card);
        }

        function atualizarUI() {
            const total = fasesPalavras[faseAtual].length;
            document.getElementById("contador-txt").innerText = `${encontradas.length} / ${total}`;
            const titulos = { 1: "Fase 01: Conceitos Gerais", 2: "Fase 02: Acidente Pessoal", 3: "Fase 03: Avanço de Sinal", 4: "Fase 04: Chave Contra (AMV)", 5: "Fase 05: Parâmetros SIC", 6: "Fase 06: Domínio MOF 2025" };
            document.getElementById("fase-titulo").innerText = titulos[faseAtual];
            const painel = document.getElementById("painel-legenda");
            const graves = fasesPalavras[faseAtual].filter(p => p.nivel === 'grave').map(p => p.nome).join(' • ');
            const medios = fasesPalavras[faseAtual].filter(p => p.nivel === 'medio').map(p => p.nome).join(' • ');
            const leves = fasesPalavras[faseAtual].filter(p => p.nivel === 'leve').map(p => p.nome).join(' • ');
            painel.innerHTML = `<div class="legenda-item leg-verde">${leves}</div><div class="legenda-item leg-amarelo">${medios}</div><div class="legenda-item leg-vermelho">${graves}</div>`;
        }

        function checarFimFase() { if (encontradas.length === fasesPalavras[faseAtual].length) { document.getElementById("btn-next").style.display = (faseAtual < 6) ? "block" : "none"; if(faseAtual === 6) alert("Trilha concluída!"); } }

        function salvarComentario() {
            const texto = document.getElementById("input-comentario").value;
            if (!texto) return;
            document.getElementById("lista-comentarios").innerHTML = `✅ Fator registrado localmente! Envie ao Forms para consolidar.`;
            alert("Observação técnica registrada.");
        }

        function abrirForms() { window.open("https://forms.gle/ut3jDiKRPWSGVXw37", '_blank'); }

        document.getElementById("btn-reset").onclick = function() { document.querySelectorAll(".cell.selected").forEach(el => el.classList.remove("selected")); selecionadas = []; };
        document.getElementById("btn-master").onclick = function() { if(confirm("Reiniciar trilha?")) { faseAtual = 1; encontradas = []; selecionadas = []; document.getElementById("resultado").innerHTML = ""; init(); } };
        document.getElementById("btn-next").onclick = function() { faseAtual++; encontradas = []; selecionadas = []; document.getElementById("resultado").innerHTML = ""; this.style.display = "none"; init(); };

        init();
    </script>
</body>
</html>
