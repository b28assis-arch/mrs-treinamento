<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRS - Trilha de Conhecimento Operacional</title>
    <style>
        :root {
            --primary: #0b3a6f; /* Azul Oficial MRS */
            --accent: #ffffff; /* Branco Puro */
            --cell-bg: #ffffff;
            --selected: #5dade2; 
            --danger: #e74c3c; 
            --warning: #f1c40f;
            --info: #2ecc71; 
            --dark: #082a50;
        }
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, var(--primary) 0%, var(--dark) 100%); color: #fff; text-align: center; padding: 10px; min-height: 100vh; }
        
        /* Cabeçalho com Hierarquia Visual Corrigida */
        .header-game { background: rgba(255, 255, 255, 0.1); padding: 20px 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.2); }
        .mrs-titulo { margin: 0; font-size: 1.3rem; font-weight: 900; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
        .slogan { font-size: 0.75rem; color: #fff; margin: 10px 0; font-weight: 400; font-style: italic; opacity: 0.8; line-height: 1.3; }
        
        /* Badge da Fase agora com Azul MRS e Branco */
        .fase-badge { background: var(--accent); color: var(--primary); display: inline-block; padding: 6px 15px; border-radius: 6px; font-weight: 900; font-size: 0.9rem; margin: 10px 0; text-transform: uppercase; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
        
        .progresso-container { margin-top: 10px; font-weight: bold; font-size: 0.95rem; }
        .contador-bolinha { background: var(--primary); padding: 3px 15px; border-radius: 20px; border: 2px solid var(--accent); color: var(--accent); }
        
        .legenda-container { max-width: 460px; margin: 10px auto 15px auto; text-align: center; }
        .legenda-item { padding: 8px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 0.8rem; font-weight: 800; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.2); }
        
        /* Legendas com contraste para leitura no trecho */
        .leg-verde { background: var(--info); color: #000; }
        .leg-amarelo { background: var(--warning); color: #000; }
        .leg-vermelho { background: var(--danger); color: #fff; }
        
        .grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 4px; max-width: 460px; margin: 10px auto; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); }
        .cell { aspect-ratio: 1; background: var(--cell-bg); color: var(--primary); display: flex; align-items: center; justify-content: center; border-radius: 4px; font-weight: 900; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
        
        /* Cores de Acerto no Grid */
        .selected { background: var(--selected) !important; color: #fff !important; }
        .found-grave { background: var(--danger) !important; color: #fff !important; }
        .found-medio { background: var(--warning) !important; color: #000 !important; }
        .found-leve { background: var(--info) !important; color: #000 !important; }
        
        .btn-next { background: #27ae60; color: #fff; display: none; width: 100%; max-width: 460px; margin: 15px auto; padding: 18px; font-size: 1.1rem; font-weight: 900; border-radius: 10px; cursor: pointer; border: none; box-shadow: 0 5px 0 #1e8449; text-transform: uppercase; }
        .controles { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; }
        .btn-aux { border: none; padding: 10px 15px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 0.75rem; text-transform: uppercase; }
        
        .analise-section { max-width: 460px; margin: 25px auto; background: #ffffff; padding: 20px; border-radius: 12px; text-align: left; border: 3px solid var(--primary); box-sizing: border-box; color: #333; }
        .analise-section h3 { margin: 0 0 12px 0; font-size: 1rem; color: var(--primary); text-transform: uppercase; font-weight: 900; border-bottom: 2px solid var(--primary); padding-bottom: 5px; }
        textarea { width: 100%; height: 90px; border-radius: 8px; border: 1px solid #ccc; padding: 12px; box-sizing: border-box; font-family: inherit; margin-bottom: 15px; font-size: 0.95rem; background: #f9f9f9; }
        .btn-box { display: flex; gap: 10px; }
        .btn-acao { background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 800; font-size: 0.8rem; flex: 1; }
        .btn-forms { background: #27ae60; color: #fff; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 800; font-size: 0.8rem; flex: 1; }
        
        #resultado { max-width: 460px; margin: 15px auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 40px;}
        .insight { padding: 14px; border-radius: 8px; text-align: left; font-size: 0.9rem; font-weight: 600; line-height: 1.4; border-left: 8px solid rgba(0,0,0,0.2); }
        .grave { background: var(--danger); color: #fff; } .medio { background: var(--warning); color: #000; } .leve { background: var(--info); color: #000; }
    </style>
</head>
<body>
    <div class="header-game">
        <h1 class="mrs-titulo">MRS - TRILHA DE CONHECIMENTO</h1>
        
        <p class="slogan">
            "Desafie sua mente. Teste sua segurança. <br> Opcional para muitos, essencial para os melhores."
        </p>
        
        <div id="fase-badge" class="fase-badge">Fase 01: Conceitos Gerais</div>
        
        <div class="progresso-container">Palavras: <span class="contador-bolinha" id="contador-txt">0 / 9</span></div>
    </div>

    <div class="legenda-container" id="painel-legenda"></div>

    <div class="controles">
        <button class="btn-aux" style="background:#fff; color:var(--primary)" id="btn-reset">Limpar Seleção</button>
        <button class="btn-aux" style="background:var(--danger); color:#fff" id="btn-master">Reiniciar Trilha</button>
    </div>

    <div class="grid" id="grid-box"></div>
    
    <button class="btn-next" id="btn-next">PRÓXIMO NÍVEL ➔</button>

    <div class="analise-section">
        <h3>📊 BANCO DE DADOS OPERACIONAL</h3>
        <p style="font-size: 0.75rem; margin-bottom: 10px; font-weight: bold; color: #555;">Registre aqui observações técnicas ou desvios sobre o fator humano:</p>
        <textarea id="input-comentario" placeholder="Descreva um compromisso ou desvio observado..."></textarea>
        <div class="btn-box">
            <button class="btn-acao" onclick="salvarComentario()">Registrar Fator</button>
            <button class="btn-forms" onclick="abrirForms()">Enviar ao Forms</button>
        </div>
        <div id="lista-comentarios" style="margin-top:12px; font-size:0.85rem; font-weight: bold; color: var(--primary);"></div>
    </div>

    <div id="resultado"></div>

    <script>
        const SIZE = 13;
        let selecionadas = [], encontradas = [], gridData = [], faseAtual = 1;

        const fasesPalavras = {
            1: [
                {txt: "AUTOCONTROLE", nome: "AUTOCONTROLE", nivel: "grave", dica: "A pressa é uma falha de julgamento. Segurança é manter o controle sob pressão."},
                {txt: "VIGILANCIA", nome: "VIGILÂNCIA", nivel: "grave", dica: "Atenção ativa: o cérebro relaxa na rotina. Force o foco no ambiente."},
                {txt: "CONDUTA", nome: "CONDUTA", nivel: "grave", dica: "Sua postura dita a segurança do time. Siga o regulamento por valor."},
                {txt: "HABITUACAO", nome: "HABITUAÇÃO", nivel: "medio", dica: "Cuidado: o cérebro 'apaga' o perigo de locais conhecidos. Reavalie a via sempre."},
                {txt: "PERCEPCAO", nome: "PERCEPÇÃO", nivel: "medio", dica: "Ver não é observar. Identifique o desvio visual antes do incidente."},
                {txt: "FADIGA", nome: "FADIGA", nivel: "medio", dica: "Reconhecer o cansaço é decisão técnica de segurança. Saiba seu limite."},
                {txt: "PROATIVO", nome: "PROATIVO", nivel: "leve", dica: "Não espere o erro acontecer. Corrija a condição insegura imediatamente."},
                {txt: "ROTINA", nome: "ROTINA", nivel: "leve", dica: "Onde o excesso de confiança se esconde. Trate cada operação como a primeira."},
                {txt: "ZELO", nome: "ZELO", nivel: "leve", dica: "Cuidado genuíno com os ativos e vidas além do manual."}
            ],
            2: [
                {txt: "GABARITO", nome: "GABARITO", nivel: "grave", dica: "Respeite o limite físico. O trem não desvia; você deve manter a distância."},
                {txt: "VISAO360", nome: "VISÃO 360°", nivel: "grave", dica: "Escaneie o ambiente além da sua tarefa. O perigo vem de onde você não olha."},
                {txt: "FOCOESTREITO", nome: "FOCO ESTREITO", nivel: "grave", dica: "Concentrar-se demais em algo pequeno cega você para o movimento adjacente."},
                {txt: "DISTRACAO", nome: "DISTRAÇÃO", nivel: "medio", dica: "Celular ou conversas: o cérebro ferroviário não é multitarefa."},
                {txt: "INTERRUPCAO", nome: "INTERRUPÇÃO", nivel: "medio", dica: "Parou a manobra? Reinicie o protocolo. A memória falha no retorno."},
                {txt: "AUDICAO", nome: "AUDIÇÃO", nivel: "medio", dica: "Use a audição como radar. Ruídos diferentes indicam mudanças no risco."},
                {txt: "TRAJETO", nome: "TRAJETO SEGURO", nivel: "leve", dica: "Caminhe apenas onde é permitido e seguro fora da via."},
                {txt: "POSTURA", nome: "POSTURA", nivel: "leve", dica: "Posicionamento correto agiliza sua reação em emergências."},
                {txt: "EQUIPE", nome: "OLHAR O PAR", nivel: "leve", dica: "Segurança coletiva: avise o colega se ele entrar no gabarito."}
            ],
            3: [
                {txt: "VIES", nome: "VIÉS", nivel: "grave", dica: "Não aceite o 'deve estar verde'. Confirme o aspecto real do sinal."},
                {txt: "EXPECTATIVA", nome: "EXPECTATIVA", nivel: "grave", dica: "A mente projeta o que deseja. Quebre a expectativa e valide cada sinal."},
                {txt: "MARGEM", nome: "MARGEM", nivel: "grave", dica: "Segurança é espaço. Pare sempre com margem antes do impeditivo."},
                {txt: "MONOTONIA", nome: "MONOTONIA", nivel: "medio", dica: "Em trechos longos, mude o foco visual para manter o cérebro desperto."},
                {txt: "CONFIRMACAO", nome: "CONFIRMAÇÃO", nivel: "medio", dica: "Dúvida no sinal? Considere parada absoluta. Na ferrovia, a dúvida protege."},
                {txt: "ESTRESSE", nome: "ESTRESSE", nivel: "medio", dica: "Sob pressão o campo de visão fecha. Respire e retome a consciência."},
                {txt: "CHAMADA", nome: "CHAMADA", nivel: "leve", dica: "Repetir o sinal no rádio é ancoragem da realidade mental."},
                {txt: "RECONHECER", nome: "RECONHECER", nivel: "leve", dica: "Identifique o sinal à distância. O plano de freio começa no visual."},
                {txt: "ALERTA", nome: "ALERTA", nivel: "leve", dica: "Use os avisos sonoros para 'resetar' sua atenção para a cabine."}
            ],
            4: [
                {txt: "ENCOSTO", nome: "ENCOSTO", nivel: "grave", dica: "Não confie no visual de longe. Verifique o encosto da agulha fisicamente."},
                {txt: "MEMORIA", nome: "MEMÓRIA", nivel: "grave", dica: "A memória de curto prazo falha. Use o checklist mental em cada AMV."},
                {txt: "REDUNDANCIA", nome: "REDUNDÂNCIA", nivel: "grave", dica: "Olhar, tocar e conferir. 3 sentidos contra 1 erro."},
                {txt: "PRESSAO", nome: "PRESSÃO", nivel: "medio", dica: "A pressa causa a abertura da agulha. Siga o tempo da segurança."},
                {txt: "AUTOMATISMO", nome: "AUTOMATISMO", nivel: "medio", dica: "Fazer sem pensar é convite para erro. Cada chave exige nova atenção."},
                {txt: "VERBALIZAR", nome: "VERBALIZAR", nivel: "medio", dica: "Falar 'Agulha travada' em voz alta reforça a execução correta."},
                {txt: "LIMPEZA", nome: "LIMPEZA", nivel: "leve", dica: "Detritos na agulha induzem ao falso encosto. Mantenha a área limpa."},
                {txt: "ALINHAR", nome: "ALINHAR", nivel: "leve", dica: "O alinhamento mental da rota precede o esforço físico na chave."},
                {txt: "CHAVE", nome: "CHAVE", nivel: "leve", dica: "A ferramenta é extensão da sua decisão. Opere com consciência plena."}
            ],
            5: [
                {txt: "GRAVACAO", nome: "GRAVAÇÃO", nivel: "grave", dica: "O SIC é seu aliado técnico. Ele registra a precisão do seu profissionalismo."},
                {txt: "PADRAO", nome: "PADRÃO", nivel: "grave", dica: "Condução de excelência é manter o padrão com ou sem supervisão."},
                {txt: "DESVIO", nome: "DESVIO", nivel: "grave", dica: "Pequenos erros tolerados hoje pavimentam o acidente amanhã."},
                {txt: "TELEMETRIA", nome: "TELEMETRIA", nivel: "medio", dica: "Seus comandos contam uma história. Garanta que seja de segurança."},
                {txt: "CORRECAO", nome: "CORREÇÃO", nivel: "medio", dica: "Use os dados do SIC para calibrar sua sensibilidade operacional."},
                {txt: "VELOCIDADE", nome: "VELOCIDADE", nivel: "medio", dica: "Respeitar a VMA é prova de maturidade e domínio do trem."},
                {txt: "EVENTO", nome: "EVENTO", nivel: "leve", dica: "Cada registro é um aprendizado. Analise seus eventos para evoluir."},
                {txt: "FEEDBACK", nome: "FEEDBACK", nivel: "leve", dica: "A crítica técnica serve para ajustar sua percepção de risco."},
                {txt: "HISTORICO", nome: "HISTÓRICO", nivel: "leve", dica: "Sua carreira na MRS é escrita pela consistência dos seus gráficos."}
            ],
            6: [
                {txt: "INTEGRIDADE", nome: "INTEGRIDADE", nivel: "grave", dica: "O MOF 2025 foca na proteção do sistema via integridade humana."},
                {txt: "RESPONSAVEL", nome: "RESPONSÁVEL", nivel: "grave", dica: "A segurança da malha começa e termina na sua decisão individual."},
                {txt: "NORMA", nome: "NORMA", nivel: "grave", dica: "A regra protege você quando o instinto ou o cansaço tentam falhar."},
                {txt: "PROCEDIMENTO", nome: "PROCEDIMENTO", nivel: "medio", dica: "Seguir o passo a passo impede que o cérebro pule etapas críticas."},
                {txt: "ATUALIZAR", nome: "ATUALIZAR", nivel: "medio", dica: "Conhecimento que não se renova vira vício. Estude o manual."},
                {txt: "DOMINIO", nome: "DOMÍNIO", nivel: "medio", dica: "Dominar o manual é ter calma para agir sob condições adversas."},
                {txt: "CONSULTA", nome: "CONSULTA", nivel: "leve", dica: "Na dúvida, não arrisque. Consulte o MOF e garanta a ação correta."},
                {txt: "CLAREZA", nome: "CLAREZA", nivel: "leve", dica: "Comunicação padronizada elimina interpretações perigosas."},
                {txt: "EFICIENCIA", nome: "EFICIÊNCIA", nivel: "leve", dica: "A verdadeira eficiência ferroviária é operar com risco zero."}
            ]
        };

        function init() {
            let pronto = false;
            while (!pronto) { gridData = Array(SIZE).fill(null).map(() => Array(SIZE).fill('')); pronto = distribuirPalavras(); }
            preencherLixo(); desenhar(); atualizarUI();
        }

        function distribuirPalavras() {
            const lista = [...fasesPalavras[faseAtual]].sort(() => Math.random() - 0.5);
            for (let p of lista) {
                let colocada = false, tentativas = 0;
                while (!colocada && tentativas < 3000) {
                    let h = Math.random() > 0.5, r = Math.floor(Math.random() * (h ? SIZE : SIZE - p.txt.length)), c = Math.floor(Math.random() * (h ? SIZE - p.txt.length : SIZE));
                    if (podeColocar(p.txt, r, c, h)) {
                        for (let i = 0; i < p.txt.length; i++) gridData[h ? r : r + i][h ? c + i : c] = p.txt[i];
                        colocada = true;
                    }
                    tentativas++;
                }
                if (!colocada) return false;
            }
            return true;
        }

        function podeColocar(p, r, c, h) {
            for (let i = -1; i <= p.length; i++) {
                for (let j = -1; j <= 1; j++) {
                    let currR = h ? r + j : r + i, currC = h ? c + i : c + j;
                    if (currR >= 0 && currR < SIZE && currC >= 0 && currC < SIZE) {
                        if (i >= 0 && i < p.length && j === 0) { if (gridData[currR][currC] !== '' && gridData[currR][currC] !== p[i]) return false; }
                        else if (i >= 0 && i < p.length && gridData[currR][currC] !== '') return false;
                    }
                }
            }
            return true;
        }

        function preencherLixo() { const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"; for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (gridData[r][c] === '') gridData[r][c] = abc[Math.floor(Math.random() * abc.length)]; }

        function desenhar() {
            const container = document.getElementById("grid-box"); container.innerHTML = '';
            gridData.forEach((row, r) => row.forEach((letra, c) => {
                const div = document.createElement("div"); div.className = "cell"; div.innerText = letra;
                div.onclick = () => clicarCelula(div, letra, r, c); container.appendChild(div);
            }));
        }

        function clicarCelula(el, letra, r, c) {
            if (el.classList.contains('found-grave') || el.classList.contains('found-medio') || el.classList.contains('found-leve')) return;
            if (el.classList.contains('selected')) { if (selecionadas.length > 0 && selecionadas[selecionadas.length - 1].el === el) { el.classList.remove('selected'); selecionadas.pop(); } return; }
            if (selecionadas.length > 0) {
                const last = selecionadas[selecionadas.length - 1];
                if (Math.abs(r - last.r) > 1 || Math.abs(c - last.c) > 1 || (Math.abs(r - last.r) === 1 && Math.abs(c - last.c) === 1)) return;
                if (selecionadas.length >= 2) {
                    const first = selecionadas[0], second = selecionadas[1];
                    if (first.r === second.r && r !== last.r) return; if (first.r !== second.r && c !== last.c) return;
                }
            }
            el.classList.add('selected'); selecionadas.push({el, letra, r, c}); verificarJogo();
        }

        function verificarJogo() {
            const palavraFormada = selecionadas.map(s => s.letra).join('');
            const alvo = fasesPalavras[faseAtual].find(p => p.txt === palavraFormada && !encontradas.includes(p.txt));
            if (alvo) {
                selecionadas.forEach(s => { s.el.classList.remove('selected'); s.el.classList.add(alvo.nivel === 'grave' ? 'found-grave' : alvo.nivel === 'medio' ? 'found-medio' : 'found-leve'); });
                encontradas.push(alvo.txt); exibirInsight(alvo); selecionadas = []; atualizarUI(); checarFimFase();
            }
        }

        function exibirInsight(p) {
            const res = document.getElementById("resultado");
            const card = document.createElement("div"); card.className = `insight ${p.nivel}`;
            card.innerHTML = `<strong>✔ ${p.nome}</strong>: ${p.dica}`; res.prepend(card);
        }

        function atualizarUI() {
            const total = fasesPalavras[faseAtual].length;
            document.getElementById("contador-txt").innerText = `${encontradas.length} / ${total}`;
            const titulos = { 1: "Fase 01: Conceitos Gerais", 2: "Fase 02: Acidente Pessoal", 3: "Fase 03: Avanço de Sinal", 4: "Fase 04: Chave Contra (AMV)", 5: "Fase 05: Parâmetros SIC", 6: "Fase 06: Domínio MOF 2025" };
            document.getElementById("fase-badge").innerText = titulos[faseAtual];
            const painel = document.getElementById("painel-legenda");
            const graves = fasesPalavras[faseAtual].filter(p => p.nivel === 'grave').map(p => p.nome).join(' • ');
            const medios = fasesPalavras[faseAtual].filter(p => p.nivel === 'medio').map(p => p.nome).join(' • ');
            const leves = fasesPalavras[faseAtual].filter(p => p.nivel === 'leve').map(p => p.nome).join(' • ');
            painel.innerHTML = `<div class="legenda-item leg-verde">${leves}</div><div class="legenda-item leg-amarelo">${medios}</div><div class="legenda-item leg-vermelho">${graves}</div>`;
        }

        function checarFimFase() { if (encontradas.length === fasesPalavras[faseAtual].length) { document.getElementById("btn-next").style.display = (faseAtual < 6) ? "block" : "none"; if(faseAtual === 6) alert("Trilha concluída com sucesso!"); } }

        function salvarComentario() {
            const texto = document.getElementById("input-comentario").value;
            if (!texto) return;
            document.getElementById("lista-comentarios").innerHTML = `✅ Fator registrado no sistema piloto da MRS.`;
            alert("Observação guardada.");
        }

        function abrirForms() { window.open("https://forms.gle/ut3jDiKRPWSGVXw37", '_blank'); }

        document.getElementById("btn-reset").onclick = function() { document.querySelectorAll(".cell.selected").forEach(el => el.classList.remove("selected")); selecionadas = []; };
        document.getElementById("btn-master").onclick = function() { if(confirm("Reiniciar trilha?")) { faseAtual = 1; encontradas = []; selecionadas = []; document.getElementById("resultado").innerHTML = ""; init(); } };
        document.getElementById("btn-next").onclick = function() { faseAtual++; encontradas = []; selecionadas = []; document.getElementById("resultado").innerHTML = ""; this.style.display = "none"; init(); };

        init();
    </script>
</body>
</html>
