<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MRS - Trilha de Conhecimento Operacional</title>
    <style>
        :root {
            --primary: #0b3a6f; --accent: #ffffff; --cell-bg: #ffffff;
            --selected: #5dade2; --danger: #e74c3c; --warning: #f1c40f;
            --info: #2ecc71; --dark: #082a50;
        }
        body { margin: 0; font-family: 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, var(--primary) 0%, var(--dark) 100%); color: #fff; text-align: center; padding: 10px; min-height: 100vh; overflow-x: hidden; }
        .header-game { background: rgba(255, 255, 255, 0.15); padding: 20px 10px; border-radius: 12px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.3); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .mrs-titulo { margin: 0; font-size: 1.2rem; font-weight: 900; color: var(--accent); letter-spacing: 1px; text-transform: uppercase; }
        .slogan { font-size: 0.85rem; color: #ffffff; margin: 12px 0; font-weight: 700; font-style: italic; text-shadow: 1px 1px 3px rgba(0,0,0,0.6); line-height: 1.4; }
        .fase-badge { background: var(--accent); color: var(--primary); display: inline-block; padding: 6px 14px; border-radius: 6px; font-weight: 900; font-size: 0.85rem; margin: 5px 0; text-transform: uppercase; box-shadow: 0 4px 0 rgba(0,0,0,0.2); }
        .progresso-container { margin-top: 10px; font-weight: bold; font-size: 0.9rem; }
        .contador-bolinha { background: var(--primary); padding: 3px 12px; border-radius: 20px; border: 2px solid var(--accent); color: var(--accent); }
        .legenda-container { max-width: 100%; margin: 10px auto; }
        .legenda-item { padding: 8px; border-radius: 6px; margin-bottom: 5px; font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }
        .leg-verde { background: var(--info); color: #000; }
        .leg-amarelo { background: var(--warning); color: #000; }
        .leg-vermelho { background: var(--danger); color: #fff; }
        .grid { display: grid; grid-template-columns: repeat(13, 1fr); gap: 3px; width: 100%; max-width: 440px; margin: 10px auto; background: rgba(0,0,0,0.4); padding: 8px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .cell { aspect-ratio: 1; background: var(--cell-bg); color: var(--primary); display: flex; align-items: center; justify-content: center; border-radius: 3px; font-weight: 900; font-size: 0.75rem; cursor: pointer; transition: all 0.1s ease; user-select: none; }
        .cell:active { transform: scale(0.9); opacity: 0.8; }
        .selected { background: var(--selected) !important; color: #fff !important; }
        .found-grave { background: var(--danger) !important; color: #fff !important; }
        .found-medio { background: var(--warning) !important; color: #000 !important; }
        .found-leve { background: var(--info) !important; color: #000 !important; }
        .btn-next { background: #27ae60; color: #fff; display: none; width: 100%; max-width: 440px; margin: 15px auto; padding: 18px; font-size: 1rem; font-weight: 900; border-radius: 10px; cursor: pointer; border: none; box-shadow: 0 5px 0 #1e8449; text-transform: uppercase; }
        .controles { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
        .btn-aux { border: none; padding: 10px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 0.7rem; text-transform: uppercase; flex: 1; max-width: 215px; }
        .analise-section { width: 100%; max-width: 440px; margin: 20px auto; background: #ffffff; padding: 15px; border-radius: 12px; text-align: left; border: 3px solid var(--primary); box-sizing: border-box; color: #333; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .analise-section h3 { margin: 0 0 10px 0; font-size: 0.9rem; color: var(--primary); text-transform: uppercase; font-weight: 900; border-bottom: 2px solid var(--primary); padding-bottom: 5px; }
        textarea { width: 100%; height: 80px; border-radius: 8px; border: 1px solid #ccc; padding: 10px; box-sizing: border-box; font-family: inherit; margin-bottom: 10px; font-size: 0.9rem; background: #fdfdfd; }
        .btn-box { display: flex; gap: 8px; }
        .btn-acao { background: var(--primary); color: #fff; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 800; font-size: 0.75rem; flex: 1; }
        .btn-forms { background: #27ae60; color: #fff; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: 800; font-size: 0.75rem; flex: 1; }
        #resultado { width: 100%; max-width: 440px; margin: 15px auto; display: flex; flex-direction: column; gap: 8px; padding-bottom: 40px;}
        .insight { padding: 12px; border-radius: 8px; text-align: left; font-size: 0.85rem; font-weight: 600; line-height: 1.4; border-left: 8px solid rgba(0,0,0,0.2); }
        .grave { background: var(--danger); color: #fff; } .medio { background: var(--warning); color: #000; } .leve { background: var(--info); color: #000; }
    </style>
</head>
<body>
    <div class="header-game">
        <h1 class="mrs-titulo">MRS - TRILHA DE CONHECIMENTO</h1>
        <p class="slogan">"Desafie sua mente. Teste sua segurança. <br> Opcional para muitos, essencial para os melhores."</p>
        <div id="fase-badge" class="fase-badge">Fase 01: Conceitos Gerais</div>
        <div class="progresso-container">Palavras: <span class="contador-bolinha" id="contador-txt">0 / 9</span></div>
    </div>
    <div class="legenda-container" id="painel-legenda"></div>
    <div class="controles">
        <button class="btn-aux" style="background:#fff; color:var(--primary)" id="btn-reset">Limpar Seleção</button>
        <button class="btn-aux" style="background:var(--danger); color:#fff" id="btn-master">Reiniciar Trilha</button>
    </div>
    <div class="grid" id="grid-box"></div>
    <button class="btn-next" id="btn-next">PRÓXIMO NÍVEL ➔</button>
    <div class="analise-section">
        <h3>📊 BANCO DE DADOS OPERACIONAL</h3>
        <p style="font-size: 0.7rem; margin-bottom: 8px; font-weight: bold; color: #555;">Registre aqui observações técnicas ou desvios sobre o fator humano:</p>
        <textarea id="input-comentario" placeholder="Descreva um compromisso ou desvio observado..."></textarea>
        <div class="btn-box">
            <button class="btn-acao" onclick="salvarComentario()">Registrar Fator</button>
            <button class="btn-forms" onclick="abrirForms()">Enviar ao Forms</button>
        </div>
        <div id="lista-comentarios" style="margin-top:10px; font-size:0.8rem; font-weight: bold; color: var(--primary);"></div>
    </div>
    <div id="resultado"></div>
    <script>
        const SIZE = 13;
        let selecionadas = [], encontradas = [], gridData = [], faseAtual = 1;
        const fasesPalavras = {
            1: [
                {txt: "AUTOCONTROLE", nome: "AUTOCONTROLE", nivel: "grave", dica: "A pressa é uma falha de julgamento. Segurança é manter o controle sob pressão emocional e técnica."},
                {txt: "VIGILANCIA", nome: "VIGILÂNCIA", nivel: "grave", dica: "O cérebro relaxa na rotina. Force o foco: a complacência é o primeiro passo para o erro."},
                {txt: "CONDUTA", nome: "CONDUTA", nivel: "grave", dica: "Sua postura dita a segurança do time. Siga o regulamento por valor intrínseco e profissionalismo."},
                {txt: "HABITUACAO", nome: "HABITUAÇÃO", nivel: "medio", dica: "O cérebro 'apaga' o perigo de locais familiares. Reavalie a via como se fosse a primeira vez sempre."},
                {txt: "PERCEPCAO", nome: "PERCEPÇÃO", nivel: "medio", dica: "Ver não é observar. Identifique o desvio visual antes que ele evolua para um incidente real."},
                {txt: "FADIGA", nome: "FADIGA", nivel: "medio", dica: "Reconhecer o cansaço é ferramenta técnica. O micro-sono na cabine é um risco letal e invisível."},
                {txt: "PROATIVO", nome: "PROATIVO", nivel: "leve", dica: "Não espere o erro. Corrija a condição insegura imediatamente. A prevenção evita o boletim técnico."},
                {txt: "ROTINA", nome: "ROTINA", nivel: "leve", dica: "Onde o excesso de confiança se esconde. Trate cada operação como única, crítica e fundamental."},
                {txt: "ZELO", nome: "ZELO", nivel: "leve", dica: "Cuidado genuíno com os ativos e vidas. Vai além do manual: é a dedicação ao detalhe operacional."}
            ],
            2: [
                {txt: "GABARITO", nome: "GABARITO", nivel: "grave", dica: "O limite físico é absoluto. O trem não desvia; respeite o espaço operacional e a sua própria vida."},
                {txt: "VARREDURA", nome: "VARREDURA", nivel: "grave", dica: "Escaneie além da tarefa. O perigo vem de onde você não olha. Mantenha os olhos em movimento constante."},
                {txt: "PERIGO", nome: "PERIGO", nivel: "grave", dica: "Identifique áreas de risco e mantenha distância segura. O perigo ignorado é o acidente de amanhã."},
                {txt: "DISTRACAO", nome: "DISTRAÇÃO", nivel: "medio", dica: "Celular ou conversas: o cérebro ferroviário não é multitarefa. Um segundo cego é um risco inaceitável."},
                {txt: "REINICIAR", nome: "REINICIAR", nivel: "medio", dica: "Parou a manobra? Reinicie o protocolo. A memória falha no ponto onde você foi interrompido."},
                {txt: "AUDICAO", nome: "AUDIÇÃO", nivel: "medio", dica: "Use o ouvido como radar. Ruídos estranhos indicam mudanças no ambiente de risco ou falhas mecânicas."},
                {txt: "TRAJETO", nome: "TRAJETO", nivel: "leve", dica: "Caminhe apenas no permitido. Atalhos na via são caminhos diretos para o acidente pessoal grave."},
                {txt: "POSTURA", nome: "POSTURA", nivel: "leve", dica: "Posicionamento correto dita sua agilidade na reação. Esteja pronto fisicamente para o imprevisto."},
                {txt: "PARCEIRO", nome: "PARCEIRO", nivel: "leve", dica: "Você é o guardião do colega. Avise se ele entrar em zona de risco. Segurança é compromisso de equipe."}
            ],
            3: [
                {txt: "VIES", nome: "VIÉS", nivel: "grave", dica: "Não aceite o 'deve estar verde'. Confirme o aspecto real do sinal sem suposições mentais."},
                {txt: "EXPECTATIVA", nome: "EXPECTATIVA", nivel: "grave", dica: "A mente projeta o que deseja. Quebre a projeção mental e aceite apenas a realidade visual do sinal."},
                {txt: "SINALIZACAO", nome: "SINALIZAÇÃO", nivel: "grave", dica: "O cumprimento estrito da sinalização é inegociável. Cada aspecto é uma ordem que preserva a malha."},
                {txt: "MONOTONIA", nome: "MONOTONIA", nivel: "medio", dica: "Em trechos longos, mude o foco visual para manter o cérebro desperto e presente na operação."},
                {txt: "CONFIRMACAO", nome: "CONFIRMAÇÃO", nivel: "medio", dica: "Dúvida no sinal? Parada absoluta. Na ferrovia, o benefício da dúvida pertence à segurança sempre."},
                {txt: "MARGEM", nome: "MARGEM", nivel: "medio", dica: "Segurança é espaço e tempo. Pare sempre com folga antes do limite impeditivo. A física não perdoa."},
                {txt: "CHAMADA", nome: "CHAMADA", nivel: "leve", dica: "Repetir o sinal no rádio ancora a realidade mental e evita o piloto automático perigoso."},
                {txt: "RECONHECER", nome: "RECONHECER", nivel: "leve", dica: "Identifique o sinal à distância. O planejamento da sua reação começa no visual inicial do aspecto."},
                {txt: "ALERTA", nome: "ALERTA", nivel: "leve", dica: "Use os avisos sonoros para 'resetar' sua atenção. O 'bip' é o lembrete auditivo da sua missão técnica."}
            ],
            4: [
                {txt: "ENCOSTO", nome: "ENCOSTO", nivel: "grave", dica: "Não confie no visual de longe. Verifique o encosto da agulha fisicamente. Milímetros causam desastres."},
                {txt: "MEMORIA", nome: "MEMÓRIA", nivel: "grave", dica: "A memória de curto prazo falha sob pressão. Use o checklist mental em cada AMV operado."},
                {txt: "REDUNDANCIA", nome: "REDUNDÂNCIA", nivel: "grave", dica: "Olhar, tocar e conferir. Use múltiplos sentidos contra a falha de um único sentido perceptivo."},
                {txt: "PRESSAO", nome: "PRESSÃO", nivel: "medio", dica: "A pressa causa a abertura da agulha. Siga o tempo da segurança, nunca o tempo do relógio da produção."},
                {txt: "AUTOMATISMO", nome: "AUTOMATISMO", nivel: "medio", dica: "Fazer sem pensar é convite para erro. Cada chave de AMV exige um novo pensamento crítico atualizado."},
                {txt: "VERBALIZAR", nome: "VERBALIZAR", nivel: "medio", dica: "Falar 'Agulha travada' reforça a execução correta. O que o ouvido ouve, o cérebro fixa com clareza."},
                {txt: "LIMPEZA", nome: "LIMPEZA", nivel: "leve", dica: "Detritos induzem ao falso encosto. Mantenha a área de curso limpa para evitar desvios operacionais."},
                {txt: "ALINHAR", nome: "ALINHAR", nivel: "leve", dica: "O alinhamento mental da rota precede o esforço físico na chave. Planeje a rota antes de agir."},
                {txt: "CHAVE", nome: "CHAVE", nivel: "leve", dica: "A ferramenta é extensão da sua decisão técnica. Opere com consciência plena da tarefa e da malha."}
            ],
            5: [
                {txt: "GRAVACAO", nome: "GRAVAÇÃO", nivel: "grave", dica: "O SIC é seu aliado técnico, não punição. Ele registra a precisão do seu profissionalismo diário."},
                {txt: "PADRAO", nome: "PADRÃO", nivel: "grave", dica: "Condução de excelência é manter o mesmo padrão com ou sem supervisão direta no trecho."},
                {txt: "DESVIO", nome: "DESVIO", nivel: "grave", dica: "Pequenos erros tolerados hoje são os acidentes de amanhã. Zere o desvio na origem da falha."},
                {txt: "TELEMETRIA", nome: "TELEMETRIA", nivel: "medio", dica: "Seus comandos contam uma história técnica. Garanta que seja uma história de segurança e domínio."},
                {txt: "CORRECAO", nome: "CORREÇÃO", nivel: "medio", dica: "Aprenda com o gráfico. Use os dados para calibrar sua mão na tração e na frenagem pneumática."},
                {txt: "VELOCIDADE", nome: "VELOCIDADE", nivel: "medio", dica: "Respeitar a VMA é sinal de maturidade operacional. A pressa é inimiga do gráfico de telemetria."},
                {txt: "EVENTO", nome: "EVENTO", nivel: "leve", dica: "Cada alerta é um aprendizado. Analise seus eventos para evoluir antes que ocorra a falha real."},
                {txt: "FEEDBACK", nome: "FEEDBACK", nivel: "leve", dica: "A crítica técnica calibra sua percepção de risco. Ouça quem vê de fora para corrigir vícios."},
                {txt: "HISTORICO", nome: "HISTÓRICO", nivel: "leve", dica: "Sua carreira é a soma da sua consistência. Um bom SIC é seu melhor currículo técnico na MRS."}
            ],
            6: [
                {txt: "INTEGRIDADE", nome: "INTEGRIDADE", nivel: "grave", dica: "O MOF 2025 foca na proteção via integridade humana. Fazer o certo sem vigilância externa."},
                {txt: "RESPONSAVEL", nome: "RESPONSÁVEL", nivel: "grave", dica: "A segurança da malha termina na sua decisão na cabine. Você é a última e principal barreira."},
                {txt: "NORMA", nome: "NORMA", nivel: "grave", dica: "A regra te protege quando o corpo falha. O regulamento é escrito com lições de vida reais."},
                {txt: "PROCEDIMENTO", nome: "PROCEDIMENTO", nivel: "medio", dica: "Seguir o passo a passo impede que o cérebro pule etapas críticas para poupar energia mental."},
                {txt: "ATUALIZAR", nome: "ATUALIZAR", nivel: "medio", dica: "Conhecimento que não renova vira vício. Estude o manual constante; a via ferroviária muda sempre."},
                {txt: "DOMINIO", nome: "DOMÍNIO", nivel: "medio", dica: "Dominar o manual dá calma para agir sob pressão. Quem conhece a regra não entra em pânico."},
                {txt: "CONSULTA", nome: "CONSULTA", nivel: "leve", dica: "Na dúvida, não arrisque. Consulte o MOF e garanta a ação correta. Orgulho não salva vidas."},
                {txt: "CLAREZA", nome: "CLAREZA", nivel: "leve", dica: "Comunicação padronizada elimina interpretações perigosas. Seja preciso no rádio em toda chamada."},
                {txt: "EFICIENCIA", nome: "EFICIÊNCIA", nivel: "leve", dica: "Eficiência real é operar no tempo certo com risco zero. Sorte não é estratégia de carreira."}
            ]
        };
        function init() {
            let pronto = false;
            while (!pronto) { gridData = Array(SIZE).fill(null).map(() => Array(SIZE).fill('')); pronto = distribuirPalavras(); }
            preencherLixo(); desenhar(); atualizarUI();
        }
        function distribuirPalavras() {
            const lista = [...fasesPalavras[faseAtual]].sort((a,b) => b.txt.length - a.txt.length);
            for (let p of lista) {
                let colocada = false, tentativas = 0;
                while (!colocada && tentativas < 5000) {
                    let h = Math.random() > 0.5, r = Math.floor(Math.random() * (h ? SIZE : SIZE - p.txt.length)), c = Math.floor(Math.random() * (h ? SIZE - p.txt.length : SIZE));
                    if (podeColocar(p.txt, r, c, h)) {
                        for (let i = 0; i < p.txt.length; i++) gridData[h ? r : r + i][h ? c + i : c] = p.txt[i];
                        colocada = true;
                    }
                    tentativas++;
                }
                if (!colocada) return false;
            }
            return true;
        }
        function podeColocar(p, r, c, h) {
            for (let i = -1; i <= p.length; i++) {
                for (let j = -1; j <= 1; j++) {
                    let currR = h ? r + j : r + i, currC = h ? c + i : c + j;
                    if (currR >= 0 && currR < SIZE && currC >= 0 && currC < SIZE) {
                        if (i >= 0 && i < p.length && j === 0) { if (gridData[currR][currC] !== '' && gridData[currR][currC] !== p[i]) return false; }
                        else if (i >= 0 && i < p.length && gridData[currR][currC] !== '') return false;
                    }
                }
            }
            return true;
        }
        function preencherLixo() { const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"; for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) if (gridData[r][c] === '') gridData[r][c] = abc[Math.floor(Math.random() * abc.length)]; }
        function desenhar() {
            const container = document.getElementById("grid-box"); container.innerHTML = '';
            gridData.forEach((row, r) => row.forEach((letra, c) => {
                const div = document.createElement("div"); div.className = "cell"; div.innerText = letra;
                div.onclick = () => clicarCelula(div, letra, r, c); container.appendChild(div);
            }));
        }
        function clicarCelula(el, letra, r, c) {
            if (el.classList.contains('found-grave') || el.classList.contains('found-medio') || el.classList.contains('found-leve')) return;
            if (el.classList.contains('selected')) { if (selecionadas.length > 0 && selecionadas[selecionadas.length - 1].el === el) { el.classList.remove('selected'); selecionadas.pop(); } return; }
            if (selecionadas.length > 0) {
                const last = selecionadas[selecionadas.length - 1];
                if (Math.abs(r - last.r) > 1 || Math.abs(c - last.c) > 1 || (Math.abs(r - last.r) === 1 && Math.abs(c - last.c) === 1)) return;
                if (selecionadas.length >= 2) {
                    const first = selecionadas[0], second = selecionadas[1];
                    if (first.r === second.r && r !== last.r) return; if (first.r !== second.r && c !== last.c) return;
                }
            }
            el.classList.add('selected'); selecionadas.push({el, letra, r, c}); verificarJogo();
        }
        function verificarJogo() {
            const palavraFormada = selecionadas.map(s => s.letra).join('');
            const alvo = fasesPalavras[faseAtual].find(p => p.txt === palavraFormada && !encontradas.includes(p.txt));
            if (alvo) {
                selecionadas.forEach(s => { s.el.classList.remove('selected'); s.el.classList.add(alvo.nivel === 'grave' ? 'found-grave' : alvo.nivel === 'medio' ? 'found-medio' : 'found-leve'); });
                encontradas.push(alvo.txt); exibirInsight(alvo); selecionadas = []; atualizarUI(); checarFimFase();
            }
        }
        function exibirInsight(p) {
            const res = document.getElementById("resultado");
            const card = document.createElement("div"); card.className = `insight ${p.nivel}`;
            card.innerHTML = `<strong>✔ ${p.nome}</strong>: ${p.dica}`; res.prepend(card);
        }
        function atualizarUI() {
            const total = fasesPalavras[faseAtual].length;
            document.getElementById("contador-txt").innerText = `${encontradas.length} / ${total}`;
            const titulos = { 1: "Fase 01: Conceitos Gerais", 2: "Fase 02: Acidente Pessoal", 3: "Fase 03: Avanço de Sinal", 4: "Fase 04: Chave Contra (AMV)", 5: "Fase 05: Parâmetros SIC", 6: "Fase 06: Domínio MOF 2025" };
            document.getElementById("fase-badge").innerText = titulos[faseAtual];
            const painel = document.getElementById("painel-legenda");
            const graves = fasesPalavras[faseAtual].filter(p => p.nivel === 'grave').map(p => p.nome).join(' • ');
            const medios = fasesPalavras[faseAtual].filter(p => p.nivel === 'medio').map(p => p.nome).join(' • ');
            const leves = fasesPalavras[faseAtual].filter(p => p.nivel === 'leve').map(p => p.nome).join(' • ');
            painel.innerHTML = `<div class="legenda-item leg-verde">${leves}</div><div class="legenda-item leg-amarelo">${medios}</div><div class="legenda-item leg-vermelho">${graves}</div>`;
        }
        function checarFimFase() { if (encontradas.length === fasesPalavras[faseAtual].length) { document.getElementById("btn-next").style.display = (faseAtual < 6) ? "block" : "none"; if(faseAtual === 6) alert("Trilha concluída com sucesso!"); } }
        function salvarComentario() {
            const texto = document.getElementById("input-comentario").value;
            if (!texto) return;
            document.getElementById("lista-comentarios").innerHTML = `✅ Fator registrado no sistema piloto da MRS.`;
            alert("Observação guardada.");
        }
        function abrirForms() { window.open("https://forms.gle/ut3jDiKRPWSGVXw37", '_blank'); }
        document.getElementById("btn-reset").onclick = function() { document.querySelectorAll(".cell.selected").forEach(el => el.classList.remove("selected")); selecionadas = []; };
