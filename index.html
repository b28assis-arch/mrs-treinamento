    function init() {
        let pronto = false;
        while (!pronto) { 
            gridData = Array(SIZE).fill(null).map(() => Array(SIZE).fill('')); 
            pronto = distribuirPalavras(); 
        }
        preencherLixo(); 
        desenhar(); 
        atualizarUI();
    }

    function distribuirPalavras() {
        const lista = [...fasesPalavras[faseAtual]].sort(() => Math.random() - 0.5);
        for (let p of lista) {
            let colocada = false, tentativas = 0;
            while (!colocada && tentativas < 3000) {
                let h = Math.random() > 0.5;
                let r = Math.floor(Math.random() * (h ? SIZE : SIZE - p.txt.length));
                let c = Math.floor(Math.random() * (h ? SIZE - p.txt.length : SIZE));
                if (podeColocar(p.txt, r, c, h)) {
                    for (let i = 0; i < p.txt.length; i++) gridData[h ? r : r + i][h ? c + i : c] = p.txt[i];
                    colocada = true;
                }
                tentativas++;
            }
            if (!colocada) return false;
        }
        return true;
    }

    function podeColocar(p, r, c, h) {
        for (let i = -1; i <= p.length; i++) {
            for (let j = -1; j <= 1; j++) {
                let currR = h ? r + j : r + i, currC = h ? c + i : c + j;
                if (currR >= 0 && currR < SIZE && currC >= 0 && currC < SIZE) {
                    if (i >= 0 && i < p.length && j === 0) {
                        if (gridData[currR][currC] !== '' && gridData[currR][currC] !== p[i]) return false;
                    } else if (i >= 0 && i < p.length && gridData[currR][currC] !== '') return false;
                }
            }
        }
        return true;
    }

    function preencherLixo() { 
        const abc = "ABCDEFGHIJKLMNOPQRSTUVWXYZ"; 
        for (let r = 0; r < SIZE; r++) 
            for (let c = 0; c < SIZE; c++) 
                if (gridData[r][c] === '') gridData[r][c] = abc[Math.floor(Math.random() * abc.length)]; 
    }

    function desenhar() {
        const container = document.getElementById("grid-box"); 
        container.innerHTML = '';
        gridData.forEach((row, r) => row.forEach((letra, c) => {
            const div = document.createElement("div"); 
            div.className = "cell"; 
            div.innerText = letra;
            div.onclick = () => clicarCelula(div, letra, r, c); 
            container.appendChild(div);
        }));
    }

    function clicarCelula(el, letra, r, c) {
        if (el.classList.contains('found-grave') || el.classList.contains('found-medio') || el.classList.contains('found-leve')) return;
        if (el.classList.contains('selected')) {
            if (selecionadas.length > 0 && selecionadas[selecionadas.length - 1].el === el) {
                el.classList.remove('selected'); selecionadas.pop();
            }
            return;
        }
        if (selecionadas.length > 0) {
            const last = selecionadas[selecionadas.length - 1];
            if (Math.abs(r - last.r) > 1 || Math.abs(c - last.c) > 1 || (Math.abs(r - last.r) === 1 && Math.abs(c - last.c) === 1)) return;
            if (selecionadas.length >= 2) {
                const first = selecionadas[0], second = selecionadas[1];
                if (first.r === second.r && r !== last.r) return;
                if (first.r !== second.r && c !== last.c) return;
            }
        }
        el.classList.add('selected'); 
        selecionadas.push({el, letra, r, c}); 
        verificarJogo();
    }

    function verificarJogo() {
        const palavraFormada = selecionadas.map(s => s.letra).join('');
        const alvo = fasesPalavras[faseAtual].find(p => p.txt === palavraFormada && !encontradas.includes(p.txt));
        if (alvo) {
            selecionadas.forEach(s => {
                s.el.classList.remove('selected');
                s.el.classList.add(alvo.nivel === 'grave' ? 'found-grave' : alvo.nivel === 'medio' ? 'found-medio' : 'found-leve');
            });
            encontradas.push(alvo.txt); 
            exibirInsight(alvo); 
            selecionadas = []; 
            atualizarUI(); 
            checarFimFase();
        }
    }

    function exibirInsight(p) {
        const res = document.getElementById("resultado");
        const card = document.createElement("div"); 
        card.className = `insight ${p.nivel}`;
        card.innerHTML = `<strong>✔ ${p.nome}</strong>: ${p.dica}`; 
        res.prepend(card);
    }

    function atualizarUI() {
        const total = fasesPalavras[faseAtual].length;
        document.getElementById("contador-txt").innerText = `${encontradas.length} / ${total}`;
        
        const titulos = {
            1: "Fase 01: Conceitos Gerais",
            2: "Fase 02: Acidente Pessoal",
            3: "Fase 03: Avanço de Sinal",
            4: "Fase 04: Chave Contra (AMV)",
            5: "Fase 05: Parâmetros SIC",
            6: "Fase 06: Domínio MOF 2025"
        };
        document.getElementById("fase-titulo").innerText = titulos[faseAtual];

        const painel = document.getElementById("painel-legenda");
        const graves = fasesPalavras[faseAtual].filter(p => p.nivel === 'grave').map(p => p.nome).join(' • ');
        const medios = fasesPalavras[faseAtual].filter(p => p.nivel === 'medio').map(p => p.nome).join(' • ');
        const leves = fasesPalavras[faseAtual].filter(p => p.nivel === 'leve').map(p => p.nome).join(' • ');

        painel.innerHTML = `
            <div class="legenda-item leg-verde">${leves}</div>
            <div class="legenda-item leg-amarelo">${medios}</div>
            <div class="legenda-item leg-vermelho">${graves}</div>
        `;
    }

    function checarFimFase() { 
        if (encontradas.length === fasesPalavras[faseAtual].length) {
            document.getElementById("btn-next").style.display = (faseAtual < 6) ? "block" : "none";
            if(faseAtual === 6) {
                alert("Parabéns, Sr Assis! Trilha concluída com sucesso.");
            }
        }
    }

    function salvarComentario() {
        const texto = document.getElementById("input-comentario").value;
        if (!texto) return;
        document.getElementById("lista-comentarios").innerHTML = `✅ Fator registrado! Envie para consolidar.`;
        alert("Observação salva.");
    }

    function abrirForms() { window.open("https://forms.gle/ut3jDiKRPWSGVXw37", '_blank'); }

    document.getElementById("btn-reset").onclick = function() { 
        document.querySelectorAll(".cell.selected").forEach(el => el.classList.remove("selected")); 
        selecionadas = []; 
    };
    
    document.getElementById("btn-master").onclick = function() { 
        if(confirm("Reiniciar toda a trilha técnica?")) { 
            faseAtual = 1; encontradas = []; selecionadas = []; 
            document.getElementById("resultado").innerHTML = ""; 
            document.getElementById("btn-next").style.display = "none"; 
            init(); 
        } 
    };
    
    document.getElementById("btn-next").onclick = function() { 
        faseAtual++; encontradas = []; selecionadas = []; 
        document.getElementById("resultado").innerHTML = ""; 
        this.style.display = "none"; 
        init(); 
    };

    init();</script>
