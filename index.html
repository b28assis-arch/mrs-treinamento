<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Treinamento Operacional MRS - Sr Assis</title>
    
    <style>
        :root {
            --mrs-blue: #003399;      /* Azul Oficial MRS */
            --mrs-yellow: #FFCC00;    /* Amarelo Segurança */
            --mrs-green: #28a745;     /* Sucesso Operacional */
            --mrs-red: #dc3545;       /* Alerta de Risco */
            --bg-gray: #f4f4f4;       /* Fundo Neutro */
            --shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* --- CABEÇALHO --- */
        header {
            background-color: var(--mrs-blue);
            color: white;
            width: 100%;
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        header h2 { margin: 0; letter-spacing: 1px; }
        header small { opacity: 0.8; font-weight: 300; }

        /* --- BARRA DE STATUS --- */
        #game-info {
            width: 90%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            font-weight: bold;
            color: var(--mrs-blue);
        }

        .status-box {
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* --- GRID DE OPERAÇÃO (O JOGO) --- */
        #grid-container {
            background: white;
            padding: 12px;
            border-radius: 10px;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 5px;
            width: 90vw;
            max-width: 480px;
            aspect-ratio: 1;
            touch-action: none; /* ESSENCIAL PARA O ARRASTE NO MOBILE */
        }

        .cell {
            background: #ffffff;
            border: 1px solid #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            border-radius: 4px;
            transition: background 0.15s ease;
            cursor: pointer;
        }

        /* EFEITO DE ARRASTE */
        .cell.selected {
            background-color: var(--mrs-yellow);
            transform: scale(1.05);
            z-index: 2;
        }

        /* PALAVRA ENCONTRADA */
        .cell.found {
            background-color: var(--mrs-green);
            color: white;
            border: none;
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* --- LISTA DE PALAVRAS --- */
        #word-list {
            width: 90%;
            max-width: 500px;
            margin: 25px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        .word-tag {
            background: white;
            padding: 10px 18px;
            border-radius: 25px;
            border: 2.5px solid var(--mrs-blue);
            font-size: 0.9rem;
            color: var(--mrs-blue);
            font-weight: bold;
            transition: 0.3s;
        }

        .word-tag.done {
            background: var(--mrs-green);
            color: white;
            border-color: var(--mrs-green);
            text-decoration: line-through;
            opacity: 0.7;
        }

        /* --- MODAL DE INSIGHTS TÉCNICOS --- */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        #modal {
            background: white;
            width: 85%;
            max-width: 450px;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #modal h2 { 
            color: var(--mrs-blue); 
            margin-top: 0; 
            border-bottom: 2px solid var(--mrs-yellow);
            padding-bottom: 10px;
        }

        #modal p {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #333;
            margin: 20px 0;
        }

        #modal button {
            background: var(--mrs-blue);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<header>
    <h2>CAÇA-PALAVRAS SEGURANÇA</h2>
    <small>Fase Operacional - Maquinista Sr Assis</small>
</header>

<div id="game-info">
    <div class="status-box" id="label-fase">Fase: 1/6</div>
    <div class="status-box" id="label-progresso">Progresso: 0/4</div>
</div>

<div id="grid-container"></div>

<div id="word-list"></div>

<div id="modal-overlay">
    <div id="modal">
        <h2 id="modal-title">INSIGHT TÉCNICO</h2>
        <p id="modal-body"></p>
        <button onclick="fecharModal()">Confirmar e Prosseguir</button>
    </div>
</div>

<script>
    /** --- LÓGICA DO SISTEMA (JAVASCRIPT) --- **/
    
    const Jogo = {
        fase: 1,
        encontradas: [],
        selecionadas: [],
        estaArrastando: false,

        // BANCO DE DADOS LAPIDADO (6 FASES)
        dados: {
            1: [
                {p: "TRECHO", i: "Conhecimento do Trecho: Antecipe riscos conhecendo o perfil da via e pontos críticos."},
                {p: "GABARITO", i: "Gabarito: Mantenha o olhar atento a obstruções laterais. Gabarito livre evita abalroamentos."},
                {p: "BRITA", i: "Caminhar na Brita: Terreno irregular causa entorses. Foque no passo e use EPI correto."},
                {p: "DORMER", i: "Dormentes: A saúde da via garante a estabilidade. Verifique rachaduras ou podridão."}
            ],
            2: [
                {p: "AGULHA", i: "Regra da Fresta: 3mm de abertura causam arrombamento. Limpe britas antes de operar."},
                {p: "JACARE", i: "Jacaré: O choque de ponta ocorre se a agulha não estiver firme. Visualize a rota de fuga."},
                {p: "CONTRATRILHO", i: "Guia da Segurança: Verifique fixações soltas na transposição de AMVs."},
                {p: "MAQUINA", i: "Shisa Kanko: Aponte e fale. Confirme a fidelidade da posição da chave antes do movimento."}
            ],
            3: [
                {p: "ASPECTO", i: "Visão Periférica: Não confie no hábito. Reconfirme o dado real do sinal antes de agir."},
                {p: "DISTANCIA", i: "Tempo de Ciclo: Planeje a parada mental muito antes do dado ficar crítico no visor."},
                {p: "COMUNICA", i: "Escuta Empática: Não absorva a pressa do rádio. A autoridade do comando é sua."},
                {p: "EXPECTATIVA", i: "Mente de Principiante: Trate cada autorização como se fosse a primeira da carreira."}
            ],
            4: [
                {p: "CONFIANCA", i: "Autoconfiança: O perigo mora na experiência. Não ignore riscos que um novato respeitaria."},
                {p: "PRESSA", i: "Pressa: É uma emoção. Vocalize a urgência para recuperar a consciência operacional imediata."},
                {p: "PERCEPCAO", i: "Olhar de Turista: Veja o pátio como se fosse a primeira vez. Busque o que mudou no cenário."},
                {p: "LINHA", i: "Linha de Fogo: Visualize a liberação de energia antes de se posicionar próximo ao engate."}
            ],
            5: [
                {p: "ALIVIO", i: "Item 6.3.3: Reduza o esforço gradualmente (>10s). Evita choque dinâmico e quebra de engates."},
                {p: "CICLAGEM", i: "Item 6.3.11: Aguarde min. 30s após o alívio para nova aplicação. Garante a recarga do ar."},
                {p: "DINAMICO", i: "Item 6.3.6: Freio Dinâmico antes do Automático. O SIC audita o equilíbrio das forças."},
                {p: "INCORRETO", i: "Item 6.3.32: Independente aliviado em circulação evita superaquecimento de rodas."}
            ],
            6: [
                {p: "MANOBRA", i: "Limite de Pátio: Garante a parada em metade da distância visível. Evita incidentes graves."},
                {p: "RADIO", i: "Contagem de Distância: Informe espaço em vagões. Silêncio no rádio exige parada imediata."},
                {p: "ESTACIONA", i: "Garantia de Estacionamento: Shisa Kanko - Aponte e diga: 'Sapata colada, corrente tensionada'."},
                {p: "PN", i: "Passagem em Nível: Gerenciamento de Risco. Antecipe a falha de terceiros. Reduza na dúvida."}
            ]
        },

        init() {
            console.log("Sistema Iniciado - Sr Assis");
            this.render();
            this.bindEventos();
        },

        render() {
            const grid = document.getElementById('grid-container');
            const lista = document.getElementById('word-list');
            grid.innerHTML = ''; 
            lista.innerHTML = '';
            
            // Geração da Grade 12x12
            const alfabeto = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for(let i=0; i<144; i++) {
                let celula = document.createElement('div');
                celula.className = 'cell';
                celula.innerText = alfabeto[Math.floor(Math.random() * 26)];
                grid.appendChild(celula);
            }

            // Geração das Tags de Palavras
            this.dados[this.fase].forEach(item => {
                let tag = document.createElement('div');
                tag.className = 'word-tag';
                tag.id = 'tag-' + item.p;
                tag.innerText = item.p;
                lista.appendChild(tag);
            });

            document.getElementById('label-fase').innerText = `Fase: ${this.fase}/6`;
            document.getElementById('label-progresso').innerText = `Progresso: ${this.encontradas.length}/4`;
        },

        bindEventos() {
            const container = document.getElementById('grid-container');
            
            const iniciar = (e) => {
                this.estaArrastando = true;
                this.selecionadas = [];
                this.processarMovimento(e);
            };

            const mover = (e) => {
                if(!this.estaArrastando) return;
                e.preventDefault(); // BLOQUEIA SCROLL
                const ponto = e.touches ? e.touches[0] : e;
                const alvo = document.elementFromPoint(ponto.clientX, ponto.clientY);
                
                if(alvo && alvo.classList.contains('cell') && !this.selecionadas.includes(alvo)) {
                    alvo.classList.add('selected');
                    this.selecionadas.push(alvo);
                }
            };

            const finalizar = () => {
                this.estaArrastando = false;
                const palavra = this.selecionadas.map(c => c.innerText).join('');
                this.verificarPalavra(palavra);
                
                // Limpa rastro visual de erro
                this.selecionadas.forEach(c => c.classList.remove('selected'));
                this.selecionadas = [];
            };

            // MOUSE
            container.addEventListener('mousedown', iniciar);
            window.addEventListener('mousemove', mover);
            window.addEventListener('mouseup', finalizar);

            // TOUCH (MOBILE)
            container.addEventListener('touchstart', iniciar, {passive: false});
            container.addEventListener('touchmove', mover, {passive: false});
            container.addEventListener('touchend', finalizar);
        },

        verificarPalavra(p) {
            const invertida = p.split('').reverse().join('');
            const match = this.dados[this.fase].find(o => o.p === p || o.p === invertida);
            
            if(match && !this.encontradas.includes(match.p)) {
                this.encontradas.push(match.p);
                this.selecionadas.forEach(c => c.classList.add('found'));
                document.getElementById('tag-' + match.p).classList.add('done');
                this.abrirModal(match.p, match.i);
                this.validarFimFase();
            }
        },

        abrirModal(titulo, corpo) {
            document.getElementById('modal-title').innerText = titulo;
            document.getElementById('modal-body').innerText = corpo;
            document.getElementById('modal-overlay').style.display = 'flex';
        },

        validarFimFase() {
            document.getElementById('label-progresso').innerText = `Progresso: ${this.encontradas.length}/4`;
            
            if(this.encontradas.length === 4) {
                setTimeout(() => {
                    this.enviarDadosCoordenação();
                    if(this.fase < 6) {
                        this.fase++;
                        this.encontradas = [];
                        this.render();
                    } else {
                        alert("TREINAMENTO CONCLUÍDO! Parabéns Maquinista Sr Assis.");
                    }
                }, 1000);
            }
        },

        enviarDadosCoordenação() {
            console.log("Log: Fase " + this.fase + " concluída. Sincronizando Forms...");
            // fetch('URL_DO_FORMS', { mode: 'no-cors' });
        }
    };

    function fecharModal() {
        document.getElementById('modal-overlay').style.display = 'none';
    }

    // DISPARO INICIAL
    window.onload = () => Jogo.init();

</script>
</body>
</html>
